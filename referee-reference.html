<body><main class="wrap"><header class="head"><h1>심판 참고문제</h1><p>업로드 텍스트 파일별 원문형 참고문제</p></header><a class="back" href="./">← 첫 화면으로 돌아가기</a><section id="card" class="card"></section><p class="note">문제 문장은 업로드한 텍스트 자료를 기준으로 수록했습니다. 원문에 정답이 없는 시험지는 임의로 정답을 만들지 않았고, 역할 예상문제의 기재 답안은 ‘원문 기재 답안’으로 표시합니다.</p></main>
<script>const displayNames=["참고2. 심판 기출문제(1)","참고3. 심판 기출문제(2)","참고4. 심판 예상문제(1)","참고5. 심판 예상문제(2)","참고6. 심판 예상문제(3)"];const sets=[{"name":"3급 심판 자격 이론시험 (기출문제)","items":[{"n":1,"q":"[1~20] 다음 글을 읽고 정답을 선택하시오. (사지선다형 문항당 2점)\n\n샷의 순서를 지키는 방법이다. 거리가 먼 것은?\n가. 세컨드 샷부터는 깃대를 기준으로 먼 곳의 공이 우선하는 것을 준수한다.\n나. 다음 홀에서는 전 홀에서의 적은 타수 순에 따라 티샷을 하면 된다.\n다. 경기진행상 퍼팅 시 홀컵에 가까운 공이 먼저 컵인을 시도할 수도 있다.\n라. 비슷한 위치에서 러프에 빠진 동반자보다는 페어웨이에 있는 자신의 공이 우선하므로 먼저 진행해야만 한다.","a":"정답: 라. 세컨드 샷 이후에는 깃대에서 먼 공부터 경기한다. 2개 이상의 공이 비슷한 거리에 있으면 경기자끼리 순서를 정할 수 있고, 결정하기 어려우면 이전 샷 순서대로 경기한다. 비슷한 위치에서는 러프나 OB에 있는 공을 우선하도록 배려하는 것이 좋다. 따라서 러프와 페어웨이라는 이유만으로 페어웨이의 공이 반드시 우선하는 것은 아니다."},{"n":2,"q":"코스 내에는 경기자에게 홀 공략을 어렵게 하기 위하여 연못, 냇물, 나무, 수풀 등의 장애물이 있다. 이를 무엇이라고 하는가?\n가. 벙커\n나. 러프\n다. 해저드\n라. OB 지역","a":"정답: 다. 해저드."},{"n":3,"q":"벙커에서 경기규칙 적용 기준이 다른 것을 고르시오.\n가. 모래에 묻혀 있는 공을 치기 쉽도록 클럽 헤드로 모래를 누르는 경우\n나. 공 주변의 모래를 고르는 경우\n다. 샷을 하면서 백스윙 없이 퍼 올리는 경우\n라. 공을 맞히지 못하고 주변 모래만 친 경우","a":"정답: 라. 공을 맞히지 못하고 주변 모래만 친 경우는 스트로크를 하지 않은 것으로 간주한다. 반면 모래를 눌러 공을 치기 쉽게 하는 행위, 공 주위 모래를 고르는 행위, 백스윙 없이 밀어내듯이 또는 퍼 올리는 행위는 모두 2벌타이다."},{"n":4,"q":"경기 중인 공에 대한 설명을 나열하였다. 아닌 것을 고르시오.\n가. 마크를 해서 공을 집어 든 후 다시 공을 놓고 볼마커를 들었을 때\n나. 경기자가 공이 흠집이 나서 예비 공으로 교체하려 할 때\n다. 분실구, 언플레이어블 등으로 공을 집어 들고 나서 규칙에 의한 지점에 공을 놓고 스트로크를 하였을 때\n라. 티잉 그라운드에서 스트로크를 한 공이 홀아웃 할 때까지의 상태","a":"정답: 나. 단순한 흠집만으로 임의 교체할 수는 없다. 경기 중인 공이 경기에 부적합하다고 판단되면 동반자에게 확인 의사를 밝히고 마크한 뒤 확인받아야 한다. 경기에 부적합하다고 확인받아 예비공으로 정상적으로 교체한 경우, 그 예비공은 이후 경기 중인 공(플레이볼)이 된다."},{"n":5,"q":"Par4 홀에서 경기자가 티샷을 하여 그린에 올려놓고 퍼팅을 시도하다가 공이 홀컵을 돌아나오기에 공을 클럽 헤드로 막았는데 이후 순서에 따라 한 손으로 컵인을 하였다. 모두 몇 타로 기록해야 하는가?\n가. 2타\n나. 3타\n다. 4타\n라. 5타","a":"정답: 라. 5타. 티샷 1타 + 퍼팅 1타 + 움직이는 자기 공을 클럽으로 막은 행위의 2벌타 + 컵인 1타."},{"n":6,"q":"Par5 홀에서 경기자가 티잉 그라운드에서 왼발 뒤꿈치를 벗어나게 스탠스하고 티샷을 하였다. 세컨드 샷은 1회의 헛스윙을 하고서 깃대 2m에 공을 보낸 다음 이후 2타 만에 컵인이 되었다. 모두 몇 타에 해당하는가?\n가. 4타\n나. 5타\n다. 6타\n라. 7타","a":"정답: 다. 6타. 티샷 1타 + 티잉그라운드 스탠스 위반 2벌타 + 세컨드샷 1타 + 이후 2타 = 총 6타. 공이 움직이지 않은 1회의 헛스윙은 타수에 넣지 않는다."},{"n":7,"q":"전국 규모대회를 개최하면서 해당 시도협회의 1급 지도자를 소집하여 진행요원 임무를 부여하였다. 지정 홀에 고정 배치되어 샷건 방식으로 진행 시 자신의 역할이 잘못된 것을 고르시오.\n가. 선수 인적사항을 확인하고 몸 풀기를 시키면서 기다렸다.\n나. 경기가 시작되었으나 조원 중에 급한 용무가 있어 잠시 기다렸다가 진행시켰다.\n다. 시작 조가 홀아웃하고 후속조가 도착하기에 조원의 타수를 확인하고 티샷 순서를 가위바위보로 정하게 하여 진행시켰다.\n라. 선수 중에 컨디션이 안 좋아서 경기 포기를 희망하기에 경기를 금지시켰다.","a":"정답: 나. 경기 시작 후 개인 사정으로 조 전체의 출발을 임의로 늦추어서는 안 된다."},{"n":8,"q":"다음 경기 규칙 적용 방법이 다른 하나를 고르시오.\n가. 연습스윙 시 클럽 헤드에 공이 맞아 티에서 떨어진 경우\n나. 낙엽을 치우다가 공을 건드린 경우\n다. OB라인이 떠 있어 밟고샷을 한 경우\n라. 언플레이어블을 선언하지 않은 경우","a":"정답: 가. 연습스윙 중 클럽헤드에 공이 맞아 티에서 떨어진 경우는 스트로크로 간주하여 1타가 된다. 나·다·라는 제시된 행위 자체로는 무벌타이다."},{"n":9,"q":"다음은 경기 규칙에 대한 설명이다. 거리가 먼 것을 고르시오.\n가. 코스 내 곡선의 도로가 있어 OB 말뚝으로 설치가 곤란한 경우 말뚝 없이 도로의 홀 쪽 라인을 OB 경계선으로 할 수 있다.\n나. 우천으로 경기가 잠시 중단되었다가 재개될 경우 중지된 홀 티잉 그라운드에서 다시 티샷을 하게 된다.\n다. 도그레그 홀은 굽어져 있는 상태의 홀로 직접 공략을 못하게 할 수 있다.\n라. 다음 홀로 이동하는 안내판은 고정 설치물로 위치이동이 안 된다.","a":"정답: 나. 경기 중단 후 재개 방법은 대회본부·경기위원회의 지시에 따르며 무조건 해당 홀 티잉그라운드에서 다시 시작하는 것은 아니다."},{"n":10,"q":"다음 설명 중 맞는 것을 고르시오.\n가. 캐주얼 워터는 홀의 난이도, 경관을 위해 만든 것으로 무벌타 구제를 받을 수 없다\n나. 워터 해저드는 일시적으로 생긴 웅덩이로 구제받을 수 없다.\n다. 수리지는 잔디보수를 위해 만들어진 구역으로 무벌타로 구제를 받을 수 있다.\n라. 수리지는 가능하면 공이 정지한 위치에서 다음 경기를 하여야 한다.","a":"정답: 다. 수리지는 잔디 보수 등을 위해 정한 구역으로 무벌타 구제 대상이다."},{"n":11,"q":"경기 중 마크에 대한 설명으로 틀린 것을 고르시오.\n가. 티잉 그라운드에 있는 공은 마크를 요구하고 동반자가 티샷을 해도 된다.\n나. 경기자가 세컨드 샷을 위해 마크를 요구하였으나 공과 공 사이가 20m를 넘는 위치이기에 동반자는 이에 응하지 않았다\n다. 홀컵에서 2클럽 이상의 거리에 있는 공을 동반자의 요구가 없는데 임의로 마크할 경우 2벌타를 부여한다.\n라. 볼마커를 좌우로 이동한 후에 원 위치하지 않고 샷을 한 경우 2벌타를 부여한다.","a":"정답: 가. 티샷 전에 티잉그라운드의 공에 대해 마크를 요구하는 방식은 적용하지 않는다."},{"n":12,"q":"경기 진행 중에 A-9홀을 홀아웃하고 다음 코스인 B-1 홀에 도착하여 티샷 순서를 정하려고 한다. 맞는 것은?\n가. A-9홀에서 종료되었기에 가위바위보로 티샷 순서를 다시 정한다.\n나. A-9홀에서 더블파로 먼저 홀아웃되어 B-1홀에 미리 도착한 선수에게 격려성 오너의 기회를 준다.\n다. A-9홀에서 경기자 모두가 타수가 동일하기에 A-8홀에서의 타순에 따라 티샷을 한다.\n라. 경기 흐름을 중시하여 티샷이 준비된 경기자를 먼저 경기하게 한다.","a":"정답: 다. 이전 홀의 타수가 모두 같으면 이전 홀의 타순을 유지한다."},{"n":13,"q":"다음 처치 방법 중 잘못된 것은?\n가. 공이 분실되었다고 추정되는 지점에서 깃대와 가깝지 않게 예비 공을 놓아야 한다.\n나. 예비 홀컵 위에 공이 놓여 있을 경우 클럽 2개 길이 이내로 구제받는다.\n다. 스프링쿨러 옆에서는 페어웨이 좌, 우측으로 클럽 2개 길이 이내로 깃대와 가깝지 않게 이동할 수 있다.\n라. 캐주얼 워터에서 구제 시 공이 놓인 위치로부터 가까운 쪽으로 스탠스가 걸리지 않고 스트로크가 가능한 지점으로 나와야 한다.","a":"정답: 나. 예비 홀컵 구제는 클럽 2개 길이가 아니라 2헤드길이를 기준으로 한다."},{"n":14,"q":"선수 2명 중 먼 거리에 있는 선수 A가 퍼팅을 시도하여 공이 굴러가는데 옆에서 어드레스 하면 선수 B도 퍼팅을 하면서 공이 충돌하였다면 어떤 경기규칙을 적용받게 되는가?\n가. 순서를 지키지 않았으므로 선수 2명 모두에게 2벌타를 부여한다.\n나. 공이 움직이는 중에 샷을 하였으므로 B 선수에게만 2벌타를 부여하고 A 선수는 벌타 없이 현 위치에서 경기를 진행한다.\n다. 근거리에 있던 B 선수는 순서를 지키지 않았으나 벌타 없이 현 위치에서 다음 경기를 진행하고 A 선수에게만 다시 퍼팅 기회를 부여한다.\n라. 샷 순서를 지키지 않은 결과이므로 각자의 책임에 따라 벌타 없이 공이 정지한 위치에서 계속 경기를 진행한다.","a":"정답: 나. 앞선 공이 움직이는 중 다음 선수가 샷하여 충돌한 경우 다음 선수에게 2벌타를 적용하고 두 공은 최종 정지 위치에서 처리한다."},{"n":15,"q":"그린에서 경기자가 준수할 사항을 나열하였다. 이 중 잘못된 것을 고르시오.\n가. 퍼팅 순서는 페어웨이와 동일하게 먼 거리 순을 원칙으로 한다.\n나. 경사도가 심한 그린에서 퍼팅을 하였으나 홀컵을 벗어나 다시 먼 거리에 위치하기에 다시 퍼팅을 하기 위해 순서를 기다리기보다는 동반자에게 먼저 퍼팅을 유도하였다.\n다. 그린에 있는 동반자의 공 3개가 목표 방향 쪽에 있는 경우에 모두 마크해 달라고 요구할 수 있다.\n라. 자신의 공이 약간 멀리 있으나, 동반자의 공 때문에 스탠스에 문제가 있어서 동반자에게 마크 요구보다는 먼저 퍼팅 하도록 요청한다.","a":"정답: 다. 세컨드 샷부터 경기자는 20m 이내에서 경기에 방해되는 동반자의 공에 대해 마크를 요구할 수 있다. 단순히 목표 방향 쪽에 공 3개가 있다는 이유만으로 모두 마크를 요구할 수 있는 것은 아니다. 방해되는 공은 마크를 요구하거나 동반자의 동의를 받아 먼저 경기하도록 할 수도 있다."},{"n":16,"q":"경기자가 티샷을 하였는데 공이 반쪽으로 파손된 것이 확인된 경우 어떻게 조치하여야 하는가?\n가. 공이 반쪽으로 파손되는 상황이 극히 드문 경우이므로 자신의 판단하에 더 좋은 방법을 선택하여 동반자에게 통보 후 다음 경기를 한다.\n나. 반쪽으로 나누어진 공의 큰 부위가 홀컵 가까이 있어 이를 사용하여 컵인올 시도한다.\n다. 반쪽으로 나누어진 공의 큰 부위 위치에 예비공을 놓고서 다음 경기를 시도한다.\n라. 동반자와 동행하여 티잉 그라운드에 도착한 후속조에게 상황 설명 및 양해를 구하고 예비 공으로 다시 티샷을 한다.","a":"정답: 라. 스트로크 결과 공이 2개 이상으로 분리되었거나 분리되기 직전 상태가 된 경우 그 스트로크를 취소하고, 예비공을 사용하여 스트로크를 하였다고 추정되는 지점에서 벌타 없이 다시 경기한다. 티샷으로 공이 반쪽으로 파손된 경우에는 티잉 그라운드에서 예비공으로 다시 티샷한다."},{"n":17,"q":"경기 도중 마크에 대한 설명으로 틀린 것을 고르시오.\n가. 경기자가 티샷한 공이 티잉 그라운드 1m 앞에 놓여 있을 경우 다음 순서인 동반자가 티샷 시 방해가 되므로 마크를 요구할 수 있다.\n나. 경기자가 세컨드 샷 준비 중 목표 방향의 공에 대해 마크를 요구하였으나 동반자가 응하지 않은 경우 경기진행이 중지될 수 있다.\n다. 깃대에서 2클럽 이상의 거리에 있는 공을 동반자 요구가 없는데 임의로 마크를 할 경우 2벌타를 부여한다.\n라. 경기자가 마크를 원할 경우 동반자가 볼 마커가 없을 시 나뭇잎이나 작은 돌로는 마크를 하면 안 된다.","a":"정답: 가. 티샷 단계에서는 앞의 공이 방해된다는 이유로 마크를 요구하지 않는다."},{"n":18,"q":"A 선수가 티샷을 하여 페어웨이로 공이 굴러가는데 옆 홀에서 B 선수가 티샷을 한 공과 충돌하여 A, B 선수의 공이 모두 OB가 되었다. 이후 처리 방법이 맞는 것을 고르시오.\n가. A 선수의 잘못이 없으므로 심판 및 동반자에게 확인 후 다시 티샷을 한다.\n나. A 선수의 잘못이 없으므로 나간 지점의 페어웨이에 공을 놓고 무벌타로 세컨드샷을 한다.\n다. A 선수. B 선수는 공을 회수하여 각각 자신의 홀에서 다시 티샷을 하도록 한다.\n라. A. B 선수공은 OB로 판정하여 OB가 난 추정 지점에서 규칙대로 OB 처치를 해야 한다.","a":"정답: 라. A·B 선수의 공은 충돌 후 최종 정지 위치를 기준으로 처리한다. 두 공 모두 OB에 정지했으므로 각각 OB로 판정하여 OB가 난 것으로 추정되는 지점에서 규정에 따라 OB 처치를 한다."},{"n":19,"q":"파크골프장의 시설물과 설치물에 관한 내용이다. 틀린 내용을 고르시오.\n가. 난이도를 부여하기 위해 벙커, 러프, 워터해저드 등을 설치한다.\n나. OB 말뚝은 홀의 경계를 구분하는 데 필요한 곳에 많이 설치하는 것이 좋다.\n다. 코스 내 안전망은 안전을 위해 필요한 것이지만 적절하게 설치하는 것이 권고된다.\n라. 시설물은 클럽하우스, 페어웨이, 그린, 벙커 등이며 설치물은 티잉 그라운드, 안전망, 깃대, 배수구 등이 있다.","a":"정답: 나. OB 말뚝은 경계를 명확히 확인할 수 있도록 필요한 위치에 설치하는 것이지 많을수록 좋은 것이 아니다."},{"n":20,"q":"파크골프는 에티켓과 매너를 중시한다. 위반 행위에 해당하는 것은?\n가. 그린에서 동반자의 퍼팅 라인을 밟지 않도록 하기 위해 깃대를 바라보고 순서를 기다리는 동반자의 앞쪽으로 이동한다.\n나. 경기자는 컵인이 되면 자신의 이름과 타수를 동반자에게 알려준다.\n다. 동반자 공과 본인 공이 거리상 위치가 애매할 경우 자신이 먼저 샷을 할 준비가 되었다면 통보하면서 다음 경기를 하면 된다.\n라. 조원 모두가 홀아웃하면 후속조에게 수신호를 해주고 다음 홀로 이동한다.","a":"정답: 가. 동반자의 퍼팅 라인을 침범하거나 방해할 수 있는 이동은 피해야 한다."},{"n":21,"q":"[21~30] 다음 글을 읽고 답을 쓰시오. (단답약술형 문항당 3점)\n\n전국적으로 파크골프를 즐기는 동호회원수 증가에 따라 공인 파크골프장도 신설되고 있다. 파크골프장에 설비하는 시설물과 설치물을 각각 4가지씩 쓰세요.\n①시설물\n②설치물","a":"모범답안: 시설물 예 — 페어웨이, 러프, 벙커, 그린. 설치물 예 — 티잉그라운드, 홀 표지판, 안전망, OB말뚝."},{"n":22,"q":"티잉 그라운드에서 바라보면 OB 말뚝, 깃대, 안전망 등이 있다. 파크골프장 신설 시 코스 내에 설비하는 러프와 벙커의 필요성에 대해서 쓰세요.","a":"모범답안: 러프와 벙커는 코스의 난이도와 전략성을 높이고, 샷의 정확성·거리조절 능력을 요구하도록 설치한다."},{"n":23,"q":"언플레이어블은 어떤 조건에 공이 정지한 경우에 해당하므로 이에 따라 처치를 해야 하는지를 1가지 조건 상황을 제시하면서 약술하세요.","a":"모범답안: 긴 러프·수풀·장애물 등으로 정상적인 샷이 불가능하다고 경기자가 판단하면 언플레이어블을 선언할 수 있다. 2벌타 후 공이 있던 지점을 기준으로 홀컵에 가깝지 않은 좌·우 2클럽 이내에 놓는다. 그 범위에 샷 가능한 곳이 없으면 추가 벌타 없이 이전 샷 방향으로 이동하여 샷 가능한 지점에서 경기한다."},{"n":24,"q":"OB 경계선 부근 경사진 위치에서 다음 경기를 하기 위해 어드레스한 후 클럽헤드가 공에 접촉되면서 OB 경계선을 넘어갔다. 이후 조치방법을 약술하세요.","a":"모범답안: 어드레스 후 클럽 접촉으로 공이 움직여 OB 경계 밖에 정지했다면 그 스트로크를 1타로 보고, OB 2벌타를 적용하여 공이 마지막으로 OB 경계를 벗어난 지점을 기준으로 홀컵에 가깝지 않은 좌·우 2클럽 이내에서 처치한다."},{"n":25,"q":"파크골프장을 찾아오는 신입회원(초, 중, 고, 일반인)이 있어 파크골프를 소개하면서 그립의 종류를 알려주려고 한다. 종류 3가지를 쓰세요.\n①\n②","a":"모범답안: ① 오버래핑 그립 ② 인터로킹 그립 ③ 베이스볼 그립"},{"n":26,"q":"스트로크플레이 방식과 매치플레이 방식에 대해 설명하시오.\n①스트로크플레이 방식\n②매치플레이 방식","a":"모범답안: 스트로크플레이는 정해진 홀 전체의 총타수로 순위를 정하는 방식이다. 매치플레이는 홀마다 승패를 정해 이긴 홀 수로 승부를 가리는 방식이다."},{"n":27,"q":"경기 중에 경기자가 지켜야 할 안전수칙을 3가지만 쓰세요.\n①","a":"모범답안: ① 스윙 전 주변 사람과 안전거리를 확인한다. ② 앞 조가 안전거리 밖으로 이동한 뒤 샷한다. ③ 다른 경기자의 샷 방향·스윙 반경 안에 들어가지 않는다."},{"n":28,"q":"OB 난 공이 분실되었을 때 몇 분 내로 찾아야 하며, 벌타는 몇 타인가?","a":"정답: 3분 이내에 찾아야 하며, 분실구는 2벌타이다."},{"n":29,"q":"상대방의 요구가 없어도 마크할 수 있는 상황과 방법을 설명하세요.\n①상황\n②방법","a":"모범답안: 그린에서 홀컵 2클럽 이내에 공이 있으면 동반자에게 알리고 우선 마크할 수 있다. 볼마커를 공 뒤에 놓은 뒤 공을 집어 올린다."},{"n":30,"q":"경기 중에 공끼리 충돌하는 경우가 자주 발생한다. 그 이유를 3가지만 쓰세요.","a":"모범답안: ① 앞선 공이 아직 움직이는데 다음 선수가 샷한 경우 ② 방해되는 공을 마크하지 않고 샷한 경우 ③ 다른 홀에서 날아온 공과 진행 중인 공의 경로가 겹친 경우."},{"n":31,"q":"[31~35] 다음 글을 읽고 답을 쓰시오. (단답기술형 문항당 6점)\n\n마크와 마커의 차이점을 설명하시오.","a":"정답: 마크는 공의 위치를 표시하는 행위이고, 마커(볼마커)는 그 위치를 표시하기 위해 사용하는 용구이다."},{"n":32,"q":"포섬 방식과 포볼 방식의 차이점을 설명하시오.","a":"정답: 포섬은 한 팀이 하나의 공을 번갈아 치는 방식이고, 포볼은 팀원 각자가 자기 공으로 경기한 뒤 홀별 좋은 스코어를 팀 성적으로 사용하는 방식이다."},{"n":33,"q":"백카운트 방식과 서든 데스 방식의 차이점을 설명하시오.","a":"정답: 백카운트는 동타일 때 후반 홀 또는 정해진 역순의 홀 성적을 비교해 순위를 정하는 방식이고, 서든데스는 연장 홀을 진행하여 먼저 승부가 갈리는 시점에 순위를 정하는 방식이다."},{"n":34,"q":"플레이스와 리플레이스의 차이점을 설명하시오.","a":"정답: 플레이스(place)는 규칙이 정한 지점에 공을 놓는 것이고, 리플레이스(replace)는 들어 올리거나 움직인 공을 원래 위치에 되놓는 것이다."},{"n":35,"q":"캐주얼 워터와 워터 해저드이 차이점을 설명하시오.\n————————————————————————","a":"정답: 캐주얼워터는 비 등으로 일시적으로 생긴 물로 무벌타 구제 대상이다. 워터해저드는 코스 난이도·경관 등을 위해 설치된 상시적인 수역이다."}]},{"name":"심판 3급 자격검정 이론시험","items":[{"n":11,"q":"참고3. 심판 기출문제(2)\n\n심판 3급 자격검정 이론시험\n\n선택형 1~10번 문항은 생략\n\n[11~21] 아래 글을 읽고 질문에 답을 선택하시오.\n4개 코스가 있는 oo파크골프장에서 3일간의 전국대회가 개최되었다.\n선수 528명이 운동복장을 착용하고 참가하여 대회본부에서는 선수 1개조를 4명씩, 총 3개 그룹으로 편성하였고, 심판은 코스별 3명씩 총 12명이 배치되어 첫째날 1그룹 선수부터 샷건으로 경기를 시작하였다.\n이후, 둘째날은 2그룹 선수부터 경기를 시작하는 등 계획된 일정대로 경기가 성공리에 종료되어 시상식까지 끝마쳤다.\n\n상기 00파크골프장은 협회 규정에 맞도록 홀 제원이 구비된 코스라면, 규정상 얼마로 규정하고 있는가?\n가. PAR3:30~40m PAR4:50~70m PAR5:100m 이내\n나. PAR3:40~50m PAR4:60~80m PAR5:100~120m\n다. PAR3:30~60m PAR4:70~100m PAR5:100~150m\n라. PAR3:40~60m PAR4:60~100m PAR5:100~150m","a":"정답: 라. PAR3 40~60m, PAR4 60~100m, PAR5 100~150m."},{"n":12,"q":"대회에 참가한 선수에게 필요한 운동 복장을 설명한 것이다. 거리가 먼 것을 고르시오.\n가. 여름철에 자외선을 차단하도록 모자 착용과 선크림을 바르는 것이 좋다.\n나. 통상 골프화 또는 운동화를 착용하는데 캐주얼화도 가능하다.\n다. 클럽 그립의 미끄럼 방지 목적으로 장갑을 착용해야만 한다.\n라. 기존 골프와 동일 또는 유사한 복장을 착용하는데 여성의 경우는 반바지 차림이 가능하다.","a":"정답: 다. 장갑 착용은 도움이 될 수 있으나 반드시 착용해야 하는 의무사항은 아니다."},{"n":13,"q":"샷건을 위한 홀 배치로 출발위치인 첫 번째 홀에서 샷의 순서를 정하는 방법이다. 모든 조의 선수가 동일하게 선택할 수 있도록 하는 방법을 고르시오.\n가. 순서뽑기로 순서를 정한다.\n나. 가위바위보로 순서를 정한다.\n다. 연장자순으로 순서를 정한다.\n라. 스코어카드에 적힌 순서대로 정한다.","a":"정답: 가 또는 나. 경기규칙상 첫 홀의 순서는 순서뽑기 또는 가위바위보로 정할 수 있다."},{"n":14,"q":"그룹별로 경기를 시작하기 위하여 1그룹부터 홀에 배치할 때 중복 배치해야 하는 조는 모두 몇 개인가?\n가. 7개조\n나. 8개조\n다. 9개조\n라. 10개조","a":"정답: 이 문항은 원문에 제시된 그룹별 조 편성표가 누락되어 있어 중복 배치 조 수를 확정할 수 없다."},{"n":15,"q":"경기가 시작되어 3번째 홀인 Par 4홀에 도착한 조에 대한 질문이다. 티샷의 순서가 맞는 방법을 고르시오.\n가. 스코어카드에 기록된 선수명단 순서를 계속해서 따른다.\n나. 2번째 홀에서 제일 먼저 홀아웃한 순서를 따른다.\n다. 2번째 홀이 모두 동타일 경우 1번째 홀에서의 타순을 따른다.\n라. 앞조가 홀아웃하여 이미 빠져나가면, 티박스에 도착한 선수가 우선하는 것이 좋다.","a":"정답: 다. 직전 홀의 타수가 같으면 직전 홀의 타순을 유지한다."},{"n":16,"q":"3번째 홀에서 선수 4명이 2타째로 그린 주변에 안착하여 동시에 접근하는데 선수 중 자신의 공이 깃대에 2클럽 이내로 놓여 있다면 이후 어떤 조치가 가장 바람직한가?\n가. 먼 위치의 동반자가 퍼트 준비(라이 확인 등)를 하고 있으면 공을 그대로 놔둔다.\n나. 가까이 대기 중인 심판에게 자신의 공에 대해 마크를 요청한다.\n다. 접근하면서 먼저 걸어나가서 깃대 주위를 확인하고 퍼트 순서를 기다린다.\n라. 동반자가 이동하는 것을 확인하면서 동반자에게 통보하고 컵인하거나 마크를 한다.","a":"정답: 라. 동반자에게 알리고 우선 마크하거나 컵인한다."},{"n":18,"q":"4번째 홀에 도착하여 순서에 따라 선수가 티샷을 하였는데 공이 우측으로 많이 밀려서 OB구역 쪽으로 굴러가 이후 조원과 같이 확인해본 결과, OB 여부를 누가 먼저 결정하면 되는가?\n가. 본인\n나. 동반자\n다. 심판\n라. 본부석(심판위원장)","a":"정답: 가. 경기자 본인이 먼저 OB 여부를 판단하고 동반자 모두의 확인을 받는다."},{"n":19,"q":"A 선수가 동반자에게 배려와 매너를 준수하는 행위이다. 거리가 먼 것을 고르시오.\n가. 그린 위에서 동반자의 퍼팅라인을 밟지 않도록 하며, 필요할 경우는 선을 밟지 않게 넘어갈 수도 있다.\n나. 컵인이 되면 자신의 타수를 동반자에게 자연스레 알려주며, 동반자는 축하와 격려의 말을 듣는다.\n다. 공이 비슷한 위치일 경우, 자신이 먼저 샷을 하려고 동반자의 이동 또는 샷행위를 중지시킨다.\n라. 조원 모두 홀아웃하면 각자의 타수를 확인한 후, 다음 홀로 이동하여 스코어카드에 기록한다.","a":"정답: 다. 공의 거리가 비슷할 때 임의로 먼저 경기하기보다 순서를 확인해야 한다."},{"n":20,"q":"본 대회에서 선수의 실격사유를 나열하였다. 아닌 것을 고르시오.\n가. 조원끼리 담합하여 타수를 조작한 경우\n나. 스코어카드를 실제 타수보다 많게 합산하여 제출한 경우\n다. 심판의 최종 판정에 이의가 있어 이를 불복하는 경우\n라. 선수가 홀 배치가 완료되어 경기가 시작된 이후에 해당 홀에 도착한 경우","a":"정답: 나. 실제 타수보다 많이 기록해 제출한 경우에는 그 기재 타수를 그대로 인정하며 실격 사유가 아니다."},{"n":21,"q":"본 대회에 심판으로 참가하여 역할을 수행하였다. 다음 중 가장 잘못된 것을 고르시오.\n가. 선수를 서로 잘 식별하도록 공의 색상을 스코어카드 이름 위에다 표식 또는 메모를 하게 하였다.\n나. OB경계구역을 완전히 벗어난 공을 접근하는 경기자에게 굴려서 전달해 주고 OB처치를 요구하였다.\n다. 경기 시작홀에서 스코어카드에 기록된 명단 순서대로 티샷 순서를 따르도록 제시하여 진행시켰다.\n라. 경기자가 볼마커를 소지하고 있지를 않아 경기를 중지시키고서 동반자에게 빌려주도록 하였다.","a":"정답: 나. 경기자의 OB 공을 진행요원이 임의로 굴려 전달하는 방식은 적절하지 않다."},{"n":22,"q":"[22~29] 전국대회 시 경기 도중에 발생하는 경기진행과 벌타유무에 대한 설명이다. 아래 선수 4명(A,B,C,D)의 행동과 진행 상황을 이해하면서 질문에 답을 선택하시오.\n\n대회본부에서 경기를 시작하게 하여 A-1홀부터 진입을 한 선수 4명이 티샷 순서를 정하고서 매너와 경기 규정을 지키면서 3개 홀을 진행하였는데.\n(23)A-4홀에서는 러프에 빠진 조원 1명의 공을 찾는다고 많이 (24)지체되어 늦게 홀아웃을 하였고, A-5(PAR5)홀로 이동해 보니 앞 조는 이미 홀아웃하고 빠져나가서 조 간격을 유지하려는 다소 조급한 마음이 들었다.\n이때, 더블파로 홀아웃한 (25)A 선수가 먼저 티박스에서 기다리다가 동반자가 도착하는 것을 보고 티박스 매트 위에 있던 공을 그대로 티샷을 하였다.\n이후 나머지 제일 적은 타수로 홀아웃한 B 선수를 포함한 C, D 선수가 티샷을 하였는데, A 선수 경우는 이번 홀에서도 공이 우측으로 밀려서 OB구역을 벗어나 처치 후 4타 만에 컵인을 하였으며 B, C, D 선수도 (25~29)OB와 벌타를 부가받으며, 5~8타로 홀아웃이 되었기에 앞 조와의 간격을 줄이지 못하였다.\n\nA 선수를 포함한 조원 모두가 A-4홀에서 경기를 진행한 결과이다. 규정에 맞는 행위로 볼 수 없는 것은?\n가. 경기흐름(또는 조 간격)을 유지하고자 A 선수의 요청을 동반자가 양해하에 티샷을 하게 하였다.\n나. 앞 조와의 벌어진 간격을 좁히려고 A 선수의 티샷을 동반자가 요청할 수도 있다.\n다. A-4홀에서 분실된 공을 조원 모두가 러프지역을 수색하면서 후속조를 대기시켜 경기를 지연시켰다.\n라. A 선수가 더블파로 다음 홀에서 타수를 만회하도록 조원이 양해해주어 미리 다음 홀로 이동 대기하였다.","a":"정답: 다. 분실구는 정해진 시간 안에 찾아야 하며, 조원 모두가 수색에 참여해 후속 조를 계속 대기시키면서 경기를 지연하는 것은 규정에 맞는 진행으로 볼 수 없다."},{"n":23,"q":"이 선수 조는 모두가 러프지역 등에 빠진 공은()분 내로 찾도록 하고, 시간이 경과되어 못 찾으면 분실구 처리를 해야 한다. ()에 맞는 시간은?\n가. 3분\n나. 5분\n다. 7분\n라. 10분","a":"정답: 가. 3분."},{"n":24,"q":"A 선수는 A-5홀에서 몇 타로 스코어카드에 기록하게 되는가?\n가. 8타\n나. 9타\n다. 10타\n라. 11타","a":"정답: 나. 9타. 티를 사용하지 않고 티박스 매트 위의 공을 그대로 티샷한 데 따른 2벌타와 OB 2벌타를 포함해 계산한다."},{"n":25,"q":"다음 중 벌타에 해당하지 않는 것이 있다. 맞는 것을 고르시오.\n가. 어드레스하려고 클럽헤드를 공 뒤에 두다가 공을 건드려서 OB가 된 경우\n나. 벙커에서 백스윙 없이 공을 밀어내듯이 샷을 한 경우\n다. 페어웨이에서 본인 공이 아닌 동반자의 공으로 샷을 한 경우\n라. 러프에서 샷을 하였는데 공을 맞히지 못하여 헛스윙이 된 경우","a":"정답: 라. 헛스윙으로 공이 움직이지 않으면 스트로크로 보지 않으며 벌타도 없다."},{"n":26,"q":"티샷 이후 페어웨이에서 선수가 다음 샷을 위한 여러 행위를 나열하였다. 가장 좋은 행위를 고르시오.\n가. 자신의 공과 동일한 색상의 공이 있어 본인 공인지를 건드리면서 확인한다.\n나. 공의 위치가 좋지 않았지만 연습 스윙을 생략하고 어드레스 및 안정된 샷에 집중한다.\n다. 티샷이 미스되어 세컨드 샷을 먼저 해야 하므로 동반자의 티샷을 하는 중에 멀리 돌아 자신의 공으로 다가간다.\n라. 자신의 공이 그린에서 떨어져 먼저 샷을 하게 되었으나, 깃대 주변의 상태를 다가가서 확인하면 좋다.","a":"정답: 나. 연습스윙을 생략하고 정상적인 어드레스와 샷에 집중하는 행위가 적절하다."},{"n":27,"q":"다음 중 OB처치를 하는 경우이다. 잘못된 것을 고르시오.\n가. OB처치는 공이 안착된 최종 위치에서 최단 직선지점인 페어웨이로 이동, 처치하는 로컬룰은 지양해야 한다.\n나. OB처치 시 공은 어깨높이에서 Drop하기 보다는 허리를 숙여서 좋은 곳을 선정할 수 있다.\n다. OB처치 시 위치 선정을 잘못하고서 다음 샷을 하였다고 인정될 시는 2벌타를 부가하게 된다.\n라. OB처치는 클럽을 사용하여 깃대에 가깝지 않은 방향으로 그립길이로 2회 이내를 준수한다.","a":"정답: 나. OB 공은 드롭하는 방식이 아니라 규정된 지점에 놓고 경기한다."},{"n":28,"q":"벙커 내에서 선수의 행동을 나열하였다. 틀린 것을 고르시오.\n가. 스탠스하려고 양발로 모래를 가볍게 문지르면서 발 위치를 고정할 수도 있다.\n나. 어드레스 시 클럽헤드 소울부분을 모래에 살짝 갖다 댈 수도 있다.\n다. 빗물이 고여 있어 발의 위치가 물 때문에 애로사항이 있으면, 무벌타로 공을 2클럽 이내로서 벙커 밖에다 처치하면 된다.\n라. 발자국에 안착된 공은 그대로 두고서 다음 샷을 하는 것이 원칙이지만, 무벌타로 처치를 할 수 있는 로컬룰을 제시한 경우 공이 있는 앞, 뒤의 발자국은 정리할 수 없다.","a":"정답: 다. 벙커의 캐주얼워터라고 해서 임의로 벙커 밖 2클럽 이내에 놓는 방식은 아니다."},{"n":29,"q":"장애물과 주변에 대한 설명을 나열하였다. 잘못된 것을 고르시오.\n가. 경기 도중에 코스 내에서 접하는 자연물 및 인공물 모두를 말한다.\n나. 움직일 수 없는 장애물 주변에서는 2벌타를 부과받고 다음 샷을 해야 한다.\n다. 통상 장애물은 움직일 수 있는 장애물과 움직일 수 없는 장애물로 구분된다.\n라. 고정장애물이 방해되는 경우, 무벌타로 처치할 수 없다. 30. 아래 글을 읽고 맞는 답을 선택하시오.","a":"정답: 나. 움직일 수 없는 장애물은 규정에 따른 무벌타 구제가 가능하며 무조건 2벌타를 부과하지 않는다."},{"n":30,"q":"아래 글을 읽고 맞는 답을 선택하시오.\n\n3개 코스가 있는 파크골프장에서 전국대회 개최 시 샷건 방식으로 27홀을 A→B→C→A 순으로 진행한다고 한다.\nA 선수는 B코스 9번홀에 종료되었고, B 선수는 C코스 1번홀. C 선수는 A코스 9번홀에서 종료되었다면 선수 자신의 조가 어느 홀에서 시작되었는가?\n\n가. A 선수: B코스 9번홀, B 선수: A코스 1번홀, C 선수: C코스 9번홀\n나. A 선수: C코스 1번홀, B 선수: C코스 2번홀, C 선수: B코스 1번홀\n다. A 선수: A코스 9번홀, B 선수: B코스 2번홀, C 선수: A코스 9번홀\n라. A 선수: A코스 1번홀, B 선수: A코스 1번홀, C 선수: C코스 1번홀","a":"정답: 제시된 A→B→C→A 진행순서와 종료 홀을 역산해야 하나, 현재 저장된 원문에서 보기 일부가 잘려 있어 선택지 번호를 확정하지 않는다."},{"n":31,"q":"단답형 30문항\n\n[31~44] 아래 글을 읽고 질문에 답을 쓰시오.\n\n파크골프는 3대가 함께 즐기는 가족형 스포츠로서 도심의 공원 또는 유휴부지에 조성하여 일반 골프보다 쉽게 접하면서 재미있게 즐길 수 있도록 (31)(  )년도에 일본 마쿠베스에서 탄생한 운동이다.\n국내에는 2003년에 도입된 이래 파크골프장이 계속해서 신설되고 있으며, 그 예가 2017년도에 완공되는 경기도 가평 소재 대성리파크골프장 36홀로서 전국에서 동호인 증가와 생활체육 관심종목으로 자리매김하고 있다.\n일반골프와 같이 파크골프도 운동에 필요한 (32~33)용구를 지참하고서 (34)조를 이루어 대한파크골프협회 경기 규정을 적용하면서 해당 코스의 (35)1번홀부터 진입을 하여 티샷부터 홀아웃하면서 (36)타수에 의한 (37)순위를 경쟁하는 것이다.\n또한, 전국에는 150개가 넘는 파크골프장이 산재해 있으며, 구장마다 특성과 난이도가 부여되고 있어 일반 회원부터 처음 접하는 초보자는 지도자의 안내 또는 지도를 받고 (38)진행 흐름에 동참하여 상호 배려하는 마음으로 (39)샷 순서와 안전수칙 등을 지키면서 운동하는 모습이 타 종목의 모범이 되고 있다.\n\n괄호 안에 해당하는 년도는? ()","a":"정답: 원문에서 연도를 묻는 기준 문장이 누락되어 있어 확정할 수 없다."},{"n":32,"q":"운동에 필요한 용구 중에 파크골프채 및 공의 무게는 얼마인가?. ( g이하).(g)","a":"정답: 클럽은 600g 이하, 공은 80~95g."},{"n":33,"q":"운동에 필요한 용구 중에서 예비공과 스코어카드를 넣는 것을 무엇이라 하는가?()","a":"정답: 볼 포켓."},{"n":34,"q":"초보자 17명이 단체로 파크골프장에서 다른 회원과 어울려 조를 편성하여 라운드하려 한다. 17명을 어떻게 인원을 나누어서 몇 개 조로 편성하는 것이 가장 타당하고 좋겠는가?( )","a":"모범답안: 4인 1조를 기본으로 하면 4개 조 16명과 1명이 남으므로, 실제 운영에서는 3~4명 기준으로 균형 있게 5개 조로 편성하는 것이 적절하다."},{"n":35,"q":"34번 항으로 조 편성 후에 라운드가 시작되어 첫 번째 조가 1번홀에서 티샷을 하는데 2명이 먼저 친 공이 티박스 바로 앞쪽에 2개가 안착되어 3번째 선수가 방향 확보에 방해를 받고 있어 망설이고 있다. 이때, 후속조에 지도자인 당신이 대기하고 있었다면 어떻게 조언하겠는가?( )","a":"모범답안: 티샷한 공이 다음 경기자의 샷을 방해하는 상황이라도 티샷 단계에서는 마크 요구를 적용하지 않는다. 안전을 확인하고 규칙에 따라 경기 순서를 진행하도록 안내한다."},{"n":36,"q":"초보자 중에 Par 5홀에서 기준타수보다 3타가 많은 타수로 컵인을 하였다. 용어로 무엇이라 호칭하는가?. ( )","a":"정답: 트리플 보기(Par보다 3타 많은 스코어)."},{"n":37,"q":"초보자 17명이 18홀을 끝내고 타수를 비교하였더니 최저타가 90타로 2명이 나타났다. 이때 스코어카드로 합산하여 승자를 가리고자 하는 경기 방식을 무엇이라고 하는가?.()","a":"정답: 백카운트 방식."},{"n":38,"q":"파크골프장 관리자(1급 지도자)가 라운드 전에 전체적인 진행 흐름에 동참하도록 홀마다 기준타수의 2배수에 해당되는 경기자는 중지하고 다음 홀로 이동하라고 교육하였다. 타수용어로 이를 무엇이라 하는가? ( )","a":"정답: 더블파."},{"n":39,"q":"초보자가 1번홀 티박스에서 연습 스윙을 2회 하였고 실제로 티샷을 시도하였는데 반복된 헛스윙이 되자, 서로 웃으면서 어렵사리 4번째 샷 만에 페어웨이로 굴려 보냈다. 만약, 일반 회원이 이와 같은 행위를 하였다면 경기 규정상 어떤 지적을 받게 되겠는가?()","a":"정답: 샷 전 연습스윙은 1회가 권장되며 2회 이상 반복하면 에티켓 위반으로 지적할 수 있다. 헛스윙으로 공이 움직이지 않았다면 타수에는 포함하지 않는다."},{"n":40,"q":"초보자가 쉽게 생각했던 파크골프 운동에 어려움을 피력했던 이유로 코스 내에 연못, 나무, 큰 돌, 수풀 등의 장애물이 있어 공을 치기 어려웠다고 하였다. 이를 무엇이라고 하는가? ()","a":"정답: 해저드(장애요소)."},{"n":41,"q":"초보자가 4개 코스로 운영되고 있는 파크골프장에서 라운드 중에 4가지 깃발 색상을 보았는데 규정상 어떻게 구별되는지 빈칸에 색상을 기록하시오.\nA코스-적색, B코스-(①), C코스-(②), D코스-백색 또는 흰색","a":"정답: ① 청색 ② 황색. A 적색, B 청색, C 황색, D 백색 순이며 이후 반복한다."},{"n":42,"q":"경기 도중 페어웨이상 잔디를 새로 입힌 구역이나 어린 묘목의 식수위치를 한시적으로 보호하도록 샷을 제한하는 구역이 있다. 이를 무엇이라 하는가?( )","a":"정답: 수리지."},{"n":43,"q":"코스 내 벙커는 난이도를 높여주는 시설로서 3가지가 있다. 빈칸에 쓰시오. (①크로스 벙커, ②사이드 벙커, ③ )","a":"정답: ③ 가드 벙커."},{"n":44,"q":"파크골프장마다 특성과 차이가 있어 일반적인 규정 이외 로컬룰을 적용하고 있다. 특히, 짧은 Par 4홀이 도그레그 형상으로 인근 홀의 그린이 있어 안전에 위배가 된다면 어떻게 로컬룰을 적용시켜야 하는지를 쓰시오. ( )","a":"모범답안: 안전상 직접 공략을 제한할 필요가 있는 도그레그 홀은 적색 OB말뚝 등으로 진행 방향을 명확히 하고, 말뚝 안쪽 페어웨이 방향으로 경기하도록 로컬룰을 정할 수 있다. 로컬룰은 경기규칙과 충돌해서는 안 된다."},{"n":45,"q":"[45~54] 파크골프도 입문자 지도와 개인기량 향상을 위하여 그립잡기부터 기본기가 중요시된다. 다음 글을 읽고 질문에 답을 하시오.\n\n그립잡기 3가지 방법 중 빈칸의 1가지 그립방법을 쓰시오.\n(①스트롱(strong), ② 스퀘어(square), ③)","a":"정답: 위크(weak) 그립."},{"n":46,"q":"스탠스는 목표 방향을 선정하여 몸의 정렬을 위하여 양발을 두는 방법이다. 3가지 방법 중 빈칸의 1가지 스탠스 방법을 쓰시오.\n(①오픈, ②클로즈, ③ )","a":"정답: 스퀘어 스탠스."},{"n":47,"q":"46항에 이어서 이때, 양발의 간격 넓이는 통상 무엇을 기준으로 취하게 되는가?( )","a":"정답: 어깨너비를 기준으로 한다."},{"n":48,"q":"스윙의 단계 중, 다운스윙하면서 공을 치고 난 이후에 피니쉬까지 넘어가는 바로 전 단계를 무엇이라 하는가? ( )","a":"정답: 팔로우 스루."},{"n":49,"q":"티샷을 하였는데 공이 나아가는 방향을 보고 좌측으로 심하게 휘어나가는 것을 혹(Hook)이 났다고 한다. 이와는 반대로 우측으로 밀려 나아가는 것을 무엇이라 하는가?.()","a":"정답: 슬라이스(Slice)."},{"n":50,"q":"그린 위에서 동반자의 볼마커가 퍼트라인에 있어 이를 옮겨 달라고 요구한다. 무엇을 기준으로 최대 얼마만큼 하게 되는가? ( )","a":"정답: 클럽헤드를 기준으로 좌·우 2헤드길이 이내."},{"n":52,"q":"경기 도중 긴 풀에 빠져서 다음 샷을 하는데, 일반적으로 공을 오른발 쪽 상단에 두면서 탈출을 시도하는 샷이 요구된다. 이를 무슨 샷이라 하는가? ()","a":"첫 번째 문항 정답: 언플레이어블. 두 번째 52번 문항 정답: 러프 탈출샷."},{"n":53,"q":"티샷을 위한 안전과 매너 준수사항이다. Par 5홀(도그레그)인 경우 어떤 상황(또는 조건)이 되어야 후속조의 첫 번째 선수가 샷을 할 수가 있겠는가?( )","a":"모범답안: 앞 조가 도그레그 지점과 예상 타구 범위를 벗어나 안전거리가 충분히 확보된 뒤 티샷한다."},{"n":54,"q":"파크골프는 일반 골프와 동일하게 경기규정을 적용하면서 차이 나는 것이 몇 가지가 있다. 그 중에서 제일 크게 차이 나는 2가지만을 쓰시오. ※비용 부담 및 접근성 등 제외\n(①     ②  )","a":"모범답안: 대표적인 차이는 파크골프가 1개의 전용 클럽과 큰 공을 사용하고, 티잉그라운드에서 티를 사용하며 코스 규모·홀 거리와 경기 운영 방식이 일반 골프와 다르다는 점이다."},{"n":55,"q":"[55~60] 아래 글을 읽고서 질문에 답을 쓰시오.\nPar4홀에서 1개조 4명이 순서에 따라 티샷부터 실시하여 이후 홀아웃까지의 경기를 진행하는 상황이다\n첫번째 A선수가 티샷을 하였는데 살짝 맞아 티박스 위에 있고, 이어서 두번째 B선수가 티샷을 페어웨이로 잘 하영ㅆ다.\n세번째 C 선수는 티샷을 한 공이 페어웨이로 나아가다 장애물인 나무와 충돌하여 왼쪽 OB경계 구역으로 굴러가는 것을 눈으로 보았으며, 네번째 D선수는 C선수가 맞힌 장애물을 고려하여 티샷을 하였으나 슬라이스가 나서 오른쪽 러프 위치로 나아가 OB가 확실하게 되었다.\n이후 먼거리 순을 지키면서 세컨드 샷부터 진행하게 되었는바, A선수가 공을 쳤으나, 동반자 B선수의 공에 충돌하여 OB가 났기 때문에 마음을 안정시키면서 규정대로 2클럽 이내로 처치하고 다음 샷을 깃대쪽으로 공을 잘 보냈으며, B 선수는 안정되게 방향과 비거리를 확보하여 그린까지 공이 굴러갔다.\nC 선수의 경우 공이 OB경계선의 애매한 위치(OB로 보임)에 안착되어 있어 그대로 자신도 샷 순서에 따라 진행하였고, D 선수의 공은 찾지를 못해 분실구로 처리를 하였고 자신은 예비공이 없기 때문에 동반자에게 공을 빌려 처치하고 샷을 한 다음 그린쪽으로 접근해 보니, 선수 4명이 온 그린(On Green)되었다.\n이후 A 선수와 C 선수는 2회씩 그리고 B 선수와 D 선수는 3회씩 퍼팅을 시도하여 컵인이 되어서 홀아웃을 하였다.\n\n제일 먼저 경기 규정을 준수하지 않은 선수와 그 내용은 무엇인가? ( )","a":"정답: 55~60번의 공통 경기상황 본문이 현재 원문에서 누락되어 있어 선수와 위반 내용을 확정할 수 없다."},{"n":56,"q":"두 번째로 경기 규정을 준수하지 않은 선수와 그 내용은 무엇인가? ( )","a":"정답: 55~60번의 공통 경기상황 본문이 현재 원문에서 누락되어 있어 선수와 위반 내용을 확정할 수 없다."},{"n":57,"q":"상기 경기 진행을 한 A 선수와 선수는 몇 타로 홀아웃을 하였는가? (A: D: )","a":"정답: 55~60번의 공통 경기상황 본문이 현재 원문에서 누락되어 있어 A·D선수의 타수를 확정할 수 없다."},{"n":58,"q":"상기 경기 진행을 하면서 A 선수와 D 선수가 OB가 났다는데 만약, OB 경계에 Line를 깔아서 기준을 삼았다면 어떻게 확인하면서, OB 여부를 판정하게 되는가? ( )","a":"모범답안: OB선은 공의 위치를 수직으로 내려다보아 공 전체가 경계선 밖에 있는지를 판단한다. 선에 닿아 있으면 OB가 아니다. 경기자 본인이 먼저 판단하고 동반자 모두의 확인을 받으며 의견이 다르면 심판 판정을 받는다."},{"n":59,"q":"상기 홀에서 홀아웃을 하고 나서 다음 홀로 이동하면서 후속조에게 보여주는 매너 행위가 있다. 어떻게 하는 것을 말하는가? ( )","a":"정답: 후속조가 경기할 수 있도록 홀아웃 후 손을 들어 수신호를 보내고 신속히 다음 홀로 이동한다."},{"n":60,"q":"만약, 4명의 선수가 상기 홀에서 단합을 하여 OB 난 타수를 줄이는 등 순위에 입상되는 승부조작을 하였다면, 본 협회의 스포츠공정위원회의 규정상 ()년 이상의 자격정지, 해임 또는 영구 정지에 적용을 받아 위원회의 결정에 따라 조치하게 된다.","a":"정답: 스포츠공정위원회 징계 연수는 해당 규정의 구체 조항 확인이 필요한 문항으로, 현재 문제 본문만으로 숫자를 임의 확정하지 않는다."},{"n":61,"q":"약술형 2문항\n\n[61~62] 다음 질문에 대해 약술하시오.\n\n경기자가 설치된 안전망 주변에 공이 안착되어 이후 행위로 벌타가 발생하거나 또는 벌타를 부과받고 경기를 하게 된다. 이에 해당하는 4가지 행위를 나열하시오.\n①\n③\n②","a":"모범답안: 안전망 주변에서는 ① 공·스탠스·스윙에 방해가 되는지 확인하고 ② 규정상 구제 대상이면 정해진 방법으로 구제하며 ③ 샷 전 안전망을 임의로 이동·훼손하지 않고 ④ 백스윙 과정에서 단순 접촉한 것과 고의로 경기조건을 개선한 행위를 구분해 판정한다."},{"n":62,"q":"코스 내에서 세컨드 샷을 하는데 오른쪽 사진 모습과 같이 사람(동반자. 제3자)을 맞히는 안전사고가 간혹 발생한다. 2가지 이상의 그 이유 및 예방책을 약술하시오.\n①이유: 예방:\n②이유: 예방:\n\n————————————————————————","a":"모범답안: 이유 — 샷 순서·안전거리 미확인, 타구 방향에 사람이 있는데 샷함. 예방 — 샷 전 전방과 스윙 반경을 확인하고, 앞사람이 안전거리 밖으로 이동한 뒤 경기하며 위험 시 즉시 '볼' 등으로 알린다."}]},{"name":"3급 심판 역할 예상문제 (1)","items":[{"n":1,"q":"참고4. 심판 예상문제(1)\n\n3급 심판 역할 예상문제\n\n*답을 기재하였음\n\n선수가 첫 번째 순서로 티샷을 하는데 선수 B의 전화를 듣고 그대로 스트로크를 한 결과, 볼이 티에서 떨어지자 동반자 때문에 방해가 되어 삿이 잘못되었다고 이의 제기하면서 다시 티샷을 하여 페어웨이에 공이 정지되었다. 경기규칙 위반여부와 다음 경기는 몇 타째인가?","a":"(1) 선수A: 벌타, 5타\n\n(2) 선수B: 매너위반"},{"n":2,"q":"금년도 전국대회가 36홀인 천안파크골프장에서 2일간 288명 선수가 4개 그룹으로 조편성하고 심판은 홀별로 1명을 배치하였다. 대회 경기가 시작되기 전에 홀별로 티잉 그라운드에서 통상 심판이 하게 되는 역할은?","a":"정답: ① 공 색깔 확인 ② 첫 홀 티샷 순서 확인 ③ 불참 선수 확인 ④ 스코어카드와 배정 홀 확인."},{"n":3,"q":"<경기 중 공 찾는 시간/분실구 처리.\nPar 4홀에서 선수 B가 티샷을 하였는데, 러프지역에 빠져 공을 찾지 못하여 예비공으로 처치 후 3타 만에 홀아웃을 하였고, 동반자와 함께 다음 홀에 도착해 보니 앞 홀은 이미 비어 있었다. 공을 찾는 제한 시간은 몇 분이며, 선수 B의 타수는 몇 타인가?","a":"정답: 공 찾기 제한시간은 3분. 찾지 못하면 분실구로 2벌타 후 규정에 따라 처치한다. 제시 상황의 기록은 6타."},{"n":4,"q":"마크 및 볼마커 이동 요령.\n선수 C가 세컨드 샷을 위하여 목표 방향 쪽으로 있는 선수 D의 공을 마크와 함께 볼마커를 왼쪽으로 2회 이동을 요구하여 선수 D가 이를 조치하였다. 선수가 용구를 사용하여 조치한 방법을 순서에 맞게 쓰세요.","a":"①홀컵을 바라보고 볼마커를 공 뒤에 놓는다② 공을 들어올린다. ③ 왼쪽으 로 1클럽헤드 되는 곳에 볼마커를 옮긴다. ④ 다시 왼쪽으로 1클럽헤드 되는 곳에 볼마커를 옮긴다."},{"n":5,"q":"선수 4명이 그린에 공이 모두 위치하여 퍼팅 진행 중, 홀컵에서 제일 먼 선수 A가 퍼팅한 것을 심판이 지켜보는데 다른 위치의 선수 B가 퍼팅을 한 결과, 굴러가던 선수 A의 공과 충돌하여 공 2개가 모두 컵인 되었다. 경기규칙 위반여부와 심판은 어떻게 조치를 해야 하는가?","a":"①규칙위반: 경기규칙 위반으로 B에게 2벌타② 조치방법: A. B공 모두 컵인 인정하고 샷순서를 지키지 않은 선수 B선수에게 2벌타 적용한다."},{"n":6,"q":"Par4 홀에서 선수 A가 티샷을 하였더니 공이 배수구 위에 정지되어 있어 무벌타로 구제를 받고서 세컨드 샷은 공이 홀컵에 못 미치다 보니 공이 예비 홀컵 위에 있기에 처치를 한 후 2타 만에 컵인을 하였다. 선수 A가 처치 시 적용한길이 기준과 타수는 몇 타인가?","a":"①배수구위: 2클럽이내 ② 예비홀컵 위 : 2헤드길이 이내③타수: 4타"},{"n":7,"q":"마크 요구 가능/불가능한 경우.\n설명: 티샷할 때","a":"설명: 티샷할 때"},{"n":8,"q":"홀진입 잘못한 선수에 대한 조치.\nA-5홀에서 홀아웃하고 다른 코스인 B-6홀로 잘못 진입하여 B-9홀에서 경기가 끝나고서 홀을 빼놓고 경기한 것을 알았다. 심판은 누구에게 몇 벌타를 부여하여 스코어카드에 기록해야 하며, 이후 어떻게 조치를 해야 하는지를 쓰세요.","a":"①벌타수: 총8벌타② 조치방법:누락된A-6홀로 되돌아가서 경기하고서 잘 못진행한 B-6홀부터 B-9홀까지 4개홀에 각각 2벌타씩을 조원 모두에게 부여한다. (더블파를 적용 안한다)"},{"n":9,"q":"<경기중 위반 행위에 대한 이해>\nPar 4홀에서 선수가 티샷을 하여 그린 위에 안착하였다. 내리막 경사를 고려하여 퍼팅을 약하게 하였는데 공이 홀컵을 지나치기에 클럽헤드로 막고나서 공이 자기 마음에 안 든다고 예비 공으로 교체하여 2타 만에 홀아웃을 하였다. 경기규칙 위반여부와 선수 A의 타수는 몇 타인가?","a":"①규칙위반(1)클럽헤드로 막는 행위 (2)공을 교체한 행위 ② 타수:8타"},{"n":10,"q":"<마크 행위 위반에 대한 이해>\nPar4홀에서 선수 K가 세컨드 샷을 하였는데 흘겁 바로 옆에 정지되었다. 동반자가 마크를 요구하여 선수 K는 공을 집어 들다가 바로 내려놓고 마크를한 이후 퍼팅을 시도하여 2타 만에 홀아웃을 하였다. 경기규칙 위반여부와 선수 K의 타수는 몇 타인가?","a":"①규칙위반: 마크를 하지 않고 공을 집어든 행위로 2벌 타를부여 받는다② 타수: 6타"},{"n":11,"q":"<티샷 순서 위반에 대한 조치>\n선수 D가 전에 홀에서 가장 타수가 많았음에도 다음 홀인 Par5홀에 대하여 자신이 이번 홀의 공략 방법을 잘 안다면서 D 선수가 먼저 티샷을 하였는데 동반자들이 2벌타를 제기하였다. 경기규칙 위반여부와 심판은 어떻게 처리하면 되는가?","a":"①규칙위반: 개인전에서는 샷순서는에티켓 위반 포섬에서는 벌타부여조 지방법 : 개인전에서는 무벌타로써 동반자에게 사과하고 다음 경기를 진행,\n포섬은 팀에 2벌타부여한다."},{"n":12,"q":"안전망 주변에서의 경기 진행.\nPar4홀에서 선수 G가 티샷을 하였는데 공이 안전망 앞에 안착하였다. 다음 샷을 위한 백스윙 도중 클럽헤드가 안전망에 접촉하면서 샷을 한 이후 3타 만에 컵인을 하였다. 경기규칙 위반여부와 선수 G의 타수는 몇 타인가?","a":"정답: 백스윙 중 안전망에 단순 접촉한 것만으로는 벌타가 없다. 제시된 원문 기준 기록은 5타."},{"n":13,"q":"공끼리 충돌 이후에 대한 조치.\n페어웨이에서 선수 2명이 다른 비슷한 거리에서 다음 샷 순서를 정하지 않고 동시에 샷을 하여 2개 공이 충돌하면서 모두 OB가 되었는데 먼 거리에 있었다고 주장하는 선수 A가 원래 위치로 OB 난 공을 들고 가면서 다시 샷을 하겠다고 이동하는 중이다. 경기규칙 위반여부와 심판은 어떻게 조치해야 하는가?","a":"①규칙위반: 순서를 지키지 않는 매너위반\n\n②조지방법: 2개의 공은 정지된 위치 즉 OB가 되었기 때문에 OB처치후두 선수에게 각각 2벌타를 부여하고 다음 경기를 하여야한다."},{"n":14,"q":"언플레이어블에 대한 처치 방법.\n선수 K가 세컨드 샷을 하였는데 긴 러프에 빠져서 언플레이어블을 선언 후 처치할 적합한 장소를 계속 이동하여 찾고 나서 다음 경기를 하였는데 그린을 지나서 OB가 되었고, 이후 2타 만에 컵인을 하였다. 선수 K의 타수는 몇 타이며, 언플레이어블 처치 방법을 정확히 쓰세요","a":"①타수:9타②처치방법 : 2벌타 부여, 그 위치에서 깃대를 바라보고 수직방 향으로 양팔을 벌려 좌, 우, 측에서 2클럽이내에 깃대에 가깝지 않는 지점에 공을 놓고 경기를 한 방향으로 이동하면서 샷이 가능한 지점에서 다음 경기 블한다."},{"n":15,"q":"샷 순서 지키기에 대한 조치.\n선수가 세컨샷을 하여 페어웨이로 공이 굴러가고 있는 선수 B가 다른 위치에서 바로 샷을 하였다. 이때 공끼리 충돌을 피하였지만 옆에 있던 선수 C가 공이 굴러가고 있는 상태에서 선수 B가 샷 순서를 지키지 않았으니 ’2벌타’라고 제기하였다. 경기규칙 위반여부와 어떻게 조치해야 하는가?","a":"①규칙위반: 에티켓 위반② 조치방법 : 무벌타로서 동반자에게 사과하고 다 음경기를 진행한다."},{"n":16,"q":"캐주얼 워터에서 구제 방법.\n경기 도중 갑자기 비가 내리는 가운데 케쥬얼 워터가 생겼고 여기에 공이 들어가 처치를 하려는데 목표 방향 쪽에 다른 캐주얼 워터가 있다. 어떻게 처치를 하여 다음 경기를 하는가?","a":"정답: 캐주얼워터는 무벌타 구제. 페어웨이 좌·우측 가까운 쪽 경계선에서 홀컵과 가깝지 않게 2클럽 이내에 공을 놓고 경기한다."},{"n":17,"q":"스윙 중 2회 이상 클럽에 접촉 시에 대한 조치.\n선수가 샷을 하면서 움직이는 공을 ’다시 클럽에 접촉하였다.’고 동반자인 선수 B가 벌타라고 지적하였더니, 선수 A는 경기 규칙에 아무런 문제가 안된다고 심판한데 이의 제기를 하고 있다. 경기규칙 위반여부와 어떻게 조치해야 하는가?","a":"①규칙위반: 드리블②조치방법: 스트로크가 되었기에 1타 가산에 움직이 는 공을 쳤으므로 2별타를 부여하여 3타가 되며, 공이 정지된 지점에서 경 기를한다."},{"n":18,"q":"클럽헤드로 공을 건드린 행위에 대한 조치.\n선수 F가 페어웨이에서 어드레스 자세를 할 경우 글럽헤드를 공 뒤에 두다가 건드리면서 공이 움직였다. 경기규칙 위반여부와 심판은 어떻게 조치해야 하는가?","a":"①규칙위반: 티샷이후는스트로크로 간주② 조치방법: 1타가산"},{"n":19,"q":"벙커 샷 도중 위반 행위에 대한 조치.\n선수가 벙커에서 샷을 한 공이 되돌아오기에 클럽헤드로 막으면서 자신의 몸에 접촉되어 공이 정지하였다. 경기규칙 위반여부와 다음 경기를 어떻게 하면 되는가?","a":"①규칙위반: (1)움직이는 볼을 클럽헤드로 막는 행위 2벌타 (2)자신의 몸에 공이 접촉되는 상황으로2벌타② 진행방법: 4벌타를 부여하고 공이 정지된 지점에서 진행한다."},{"n":20,"q":"우천 시 이물질 제거에 대한 조치.\n선수 B가 비가 내려 자신의 공에 진흙이 묻어 있어 다음 경기에 방해되어 마크를 하고서 이를 제거하였다. 경기규칙 위반여부와 다음 경기를 어떻게 하면 되는가?","a":"①규칙위반: 우천시에도 이물질을 제거할 수 없으며 대회시 로컬룰로 정하 여이 물질을 제거 하도록 공지하지 않았으면 임의로 마크를 하였으므로 벌 타를 부여한다. ② 진행방법: 2벌타를 부여하고 현위치에서 진행한다."},{"n":21,"q":"2개 OB말뚝 중간에 대한 공의 판정방법.\n어떤 파크골프장에슨 홀마다 OB말뚝이 설치되어 있다. 선수 B가 티샷한 공이 우측 OB말뚝 가운데 정지되었다. 선수B가 OB여부를 어떻게 판정하는지를 쓰시오.","a":"==> 공이 안착된 지점에서 두 개 OB말뚝 연장선에서 벗어난 경우에 경기자 가OB로 판정한다(OB라인을 위에서 보았을때 걸리면 오비 아님)"}]},{"name":"3급 심판 역할 예상문제 (2)","items":[{"n":1,"q":"전국대회에서 경기가 시작되면서 실격 처리되는 경우가 종종 발생한다. 그중 사유에 해당되는 경우 4가지를 쓰시오.","a":"1. 경기시작전에 도착하지 못할시\n\n2. 경기중 연습연습 경기를 할때\n\n3. 심판에게 타당하지 않은 이유로 항의할 때\n\n4. 홀컵주변에서 홀아웃하지 않고 공을 집었을때"},{"n":2,"q":"Par 5홀에서 선수 A가 티샷을 하였는데 공이 수리지에 정지되었기에 구제를 받고서 두 번째 샷에 이어 세 번째 샷을 한 결과 확인해보니 예비 홀컵 위에 정지해 있어 옆에 있는 선수 B에게 통보하고 퍼팅 3회 시도하여 컵인을 하였다. 선수 A가 컵인을 할 때까지 ①수리지와 ②예비홀 컵에서 처치방법 ③타수는 얼마인지를 쓰세요.","a":"①수리지와②예비홀 컵에서 처치방법③타수는 얼마인지를 쓰세요.\n\n1. 수리지-무벌타로 구제받음 홀컵에 가깝지 않게 2클럽길이내에서 세칸드\n\n샷을함\n\n2. 홀컵 좌우로 클럽헤드기이 2개 거리내에서 옮기고 퍼팅\n\n3.6타"},{"n":3,"q":"Par 5홀에서 선수 A가 티샷을 하였는데 공이 배수구 위에 정지되었기에 구제를 받고서 두 번째 것에 어어 세 번째 샷을 한 결과, 확인해보니 캐주얼 워터에 있어 옆에 있는 선수 B에게 알리고서 저치를 한 후 3타 만에 컵인을 할 때 선수 A가 컵인을 할 때까지 ①배수구와 케쥬얼 워터에서 처치시 용구 사용방법 ③타수가 얼마인지를 쓰세요","a":"1. 깃대를 보고 홀컵과의 거리가 가깝지 않게 좌우로 2클럽길이만큼 옴겨 구 제를 받고 다음샷을 한다.\n\n2. 캐쥬얼 워터에 들어갔을때는 공이 놓인 자리로부터 가까운 쪽의 케쥬얼 워터의 가로 나가 2클럽이내의 거리와 깃대에 가깝지 않는 곳에서 구제받고 다음 샷을 한다.\n\n3.6타"},{"n":4,"q":"Par 5홀이 도그레그인 홀에서 직접 깃대를 향해 첫 번째 적색으로 표시된 말뚝 뒤쪽으로 샷을 하면 벌타라고 로컬룰로 공지하였는데 선수 A가 공이 OB발뚝 못 미쳐 있기에 다음 샷은 깃대를 향해 직접 공략하여 말뚝 뒤쪽을 통과시켜 그린에 공을 정지시켰다. 심판은 ① 어떻게 경기규칙을 적용 하면서 ② 선수 A의 다음 샷이 몇 타입니까","a":"1. 적색말뚝 뒤로 지나갔으므로 2벌타를 적용\n\n2.5타째 샷이다."},{"n":5,"q":"선수 4명이 PAR 3인 B-7에서 홀아웃을 하고 다음 홀로 이동하여 C-1홀에서 경기를 한 결과 모두 4타에 홀아웃하였는데 2홀을 건너뛴 것을 알게 되었다. 그렇다면 심판은 ①누구에게 코어카드에 몇 타로 기록한 후 ② 어떤 조치를 해야 하는지를 쓰세요","a":"①누구에게 코어카드에 몇타로 기록한후 ② 어떤조치를 해야 하는지를 쓰세 요\n\n1.4명모두에게 4벌타를 더해서 8타로 기록한다.\n\n2.B-8번 홀로가서 티샷하도록 한다."},{"n":6,"q":"단체전 포성경기(베스트볼 적용)가 진행되어 A팀 1번과 2번은 페어웨이와 OB 그리고 B팀은 거리가 짧아 페어웨이에 안착하였다. 팀별로 공을 선택한 결과, 페어웨이에 있는 B팀 공은 홀컵에서 5m 위치에 먼 거리에 있기에 A팀의 선수에게 마크를 요구하는 데 있어 ①누가 하면 되는지와 홀아웃을 하고서 다음 홀에서 티샷하는 방법에 대하여 쓰세요.","a":"1. A팀 1번(다음샷을 할 사람)\n\n2. 적은 타수를 기록한 팀의 선수가 먼저 티샷후 두팀의 선수가 번갈아 가면 서 티샷한다."},{"n":7,"q":"Par 5홀에서 선수 A가 티샷과 두 번째 어프로치 샷을 하고서 그린 위 홀컵 바로 옆 20cm에 정지하기에 선수가 공을 집어 들고 다음 홀로 가기에 B가 제지하였다. ① 선수 B가 이동을 제지한 이유와 다시 공을 원래 위치에 두고서 하면 컵인하면 ②몇 타가 되는지를 쓰세요","a":"1. 공식경기에서는 실격처리되나 공을 집었으므로 2타를 더한다.\n\n2. 따라서 5타가 된다."},{"n":8,"q":"그린에서 선수 C가 퍼팅을 하기 위하여 자신의 공 바로 앞에 있는 D선수에게 볼마커를 오른쪽으로 2회 이동을 요구하였다. 선수 D가 용구를 사용하여 조치하는 방법을 5가지를 순서대로 쓰시오","a":"모범답안: ① 공 뒤에 볼마커를 놓는다 ② 공을 집어 올린다 ③ 클럽헤드를 기준으로 요구 방향에 맞춰 좌·우 2헤드길이 이내에서 마커를 이동한다 ④ 방해가 해소된 뒤 이동 순서의 역순으로 마커를 원위치한다 ⑤ 공을 원래 위치에 놓고 볼마커를 집은 뒤 경기한다."},{"n":9,"q":"Par4홀에인 전망 주변에서의 경기 진행\nPar4홀에서 선수 G가 티샷을 하였는데 공이 안전망 앞에 안착하였다 다음샷을 백스윙 도중 클럽헤드가 안전망에 접촉히면서 샷을 한 이후 3타 만에 컵인을 하였다. 경기규칙 위반여부와 선수 G의 타수는 몇 타인가?","a":"정답: 백스윙 중 안전망에 단순 접촉한 것만으로는 벌타가 없다. 제시된 원문 기준 기록은 5타."},{"n":10,"q":"공끼리 충돌 이후에 대한 조치\n페어웨이에서 선수 2명이 다른 비슷한 거리에서 다음 샷 순서를 정하지 않고 동시에 샷을 하여 2개 공이 충돌하면서 모두 OB가 되었는데 먼 거리에 있었다고 주장하는 A가 원래 위치로 OB 난 공을 들고 가면서 다시 샷을 하겠다고 이동하는 중이다. 경기규칙 위반여부와 심판은 어떻게 조치해야 하는가?","a":"정답: 동시에 샷한 행위는 순서 관련 에티켓 문제이며, 충돌 후 두 공은 최종 정지 위치를 기준으로 처리한다. 두 공이 모두 OB에 정지했다면 각각 OB 2벌타 후 규정된 OB 처치를 한다."},{"n":11,"q":"전 홀에서 A 선수는 3타 B 선수는 4타 C 선수는 4타 D 선수는 5타였다. 그런데 D 선수가 먼저 티샷을 하였는데 동반자들이 2벌타를 주었다 경기규칙 위반여부와 심판은 어떻게 처리하면 되는가?","a":"①규칙위반여부 : 개인전에서는 샷 순서는 에티켓 위반② 조치 방법: 개인전 에서는 무벌타로써 동반자에게 사과하고 다음 경기를 행한다."},{"n":12,"q":"샷 순서 지키기에 대한 조치 선수 A가 세컨드 샷을 하여 페어웨이로 공이 굴러가고 있는데 선수 B가 바로 샷을 하였다. 이때 공끼리 충돌은 피하였지만 옆에서 있던 선수 C가 공이 구르고 있는 상태에서 선수 B가 샷 순서를 지키지 않았으니 ’2벌타’라고 제기하였다 경기규칙 위반여부와 어떻게 조치해야 하는가?","a":"①규칙위반: 에티켓 위반\n\n② 조치방법:무벌타로시 동반자에게 사과하고 다음 경기를 한다."},{"n":13,"q":"티잉 그라운드에서 선수 A가 연습스윙을 2회 하고서 헛스윙으로 티잉 그라운드에 공이 정지하기에 기다리다가 조원이 모두 샷을 하여 이후 3타 만에 컵인을 하였다.","a":"①경기규칙을 위반한 행위와② 선수의타수가 몇타인지 쓰시오\n\n1. A선수는 샷순서를 위반하였다. 에티켓 위반\n\n2.4타"},{"n":14,"q":"엔플레이어블에 대한 처치방법\n선수 K가 세컨드 샷을 하였는데 긴 퍼프에 빠져서 언플레이어블을 선언 후 처치 위한 장소를 계속 이동하여 찾고 나서 다음 경기를 하였는데 그런을 지나서 OB가 나고 그 후 2타 만에 컵인을 하였다.","a":"① 선수 K의 타수는 몇 타이며, 8타 OB 2타+ 언플레아블 2타+2타+2타 ② 언플레이어블 처치 방법을 정확히 쓰세요.\n\n놓인 장소로부터 치기 좋은쪽으로 2클럽이내의 거리와 홀컵에서 가깝지 않 은 거리에 공을 놓고 친다. 이경우 샷이 가능한 지점이 없을 경우는 이전 샷을 한방향으로 이동하면서 샷이 가능한 지점에서 다음 경기를 한다."},{"n":15,"q":"A 선수가 티샷을 하였는데 벙커 내 정위치해 있는 고르게 옆에 떨어지자 고르개를 약간 옮기고 벙커샷을 하였는데 이번에는 배수구 위에 정지하였다. 조치 후 2타에 컵인하였다","a":"①A선수는 몇타로 기록되나요? 6타\n\n고르게 옮김-2벌타, 배수구 무벌타로 구제\n\n②A선수는 배수구 위에서 어떤조치를 했는가\n\n2클럽이내의 거리와 홀컵에 가깝지 않게 구제하고 경기한다."},{"n":16,"q":"선수 A가 Par 4홀에서 티샷을 하고, 어프로치 샷으로 홀컵과 3m 거리에 정지하자 선수 B의 퍼팅에 방해가 되기에 배려 차원에서 임의로 마크를 하고 볼를 주었다. 이후 샷 순서에 따라 볼마커 앞에 공을 내려놓고서 퍼팅을 하 여 컵인했다. A가 ①경기규칙상 위반한 행위와 ②타수는 얼마인지를 ③계산 식으로 적으시오","a":"1. 홀컵으로부터 2m 넘는 거리에 있는 공을 임의로 집었으므로 2벌타\n\n2.5타\n\n3. 티샷 1타+어프로치샷 1타+퍼팅1타+2벌타"},{"n":17,"q":"케쥬얼 워터에서의 처치\n경기 도중 갑자기 비가 내리는 가운데 선수 A가 티샷을 하였는데 페어웨이에 물이 고여 공을 칠 수가 없게 되었다. 이때 선수는 어떤 조치를 취할 수 있는지 쓰시오","a":"1. 물이 고인 케쥬얼 워터 바깥쪽(공이 놓인곳에서부터 가까운 방향으로) 으로 2클럽 길이 이내에서 홀컵에 가깝지 않은 공에 놓고 친다."},{"n":18,"q":"A 선수가 경사가 심한 PAR3홀에서 티샷을 하였는데 홀컵 주변 바위를 맞고 티박스 뒤에까지 굴러 내려왔다. A 선수는 OB처치 후 2타로 컵인하였다.","a":"①A선수가 OB처치는 어떻게 하는가 티박스 뒤쪽 선상에서 오비 처치한다.\n\n②A선수의 기록타수는? 5타"},{"n":19,"q":"4명이 한 조가 되어 티샷을 하였는데 ABC 선수의 공은 페어웨이에 안착했는데 D 선수의 공은 OB선 가까이 갔다. 이를 보고 A와 B 선수는 오비라고 하고 C와 D 선수는 오비가 아니라고 할 때 이 상황에서 심판은 어떤 기준으로 어떤 판단과 조치를 해야 하는가?","a":"①4선수가 일치하지 않을때는 심판이 판정해야하므로\n\n② 오비선과 공의 위에서 내려보아 선에 걸렸으면 오비가 아닌 것으로 판정 한다."},{"n":20,"q":"포섬경기에서 A조와 B조가 각 2명씩 경기를 하는 중에, 그린 근처에서 퍼팅하려 하는데 A조의 동반자는 흡컵 뒤편에서 클럽헤드로 바닥을 짚어주며 샷 방향을 알려주는 행위를 했고 B조의 동반자는 클럽헤드를 바닥에대지 않고 방향을 조언했다. 이 경우에 어느 조가 규칙을 위반했는지와 벌타를 쓰시오","a":"1. A조는 규칙 위반으로 2벌타를 부여 받는다."}]},{"name":"3급 심판 역할 예상문제 (3)","items":[{"n":1,"q":"상황 1 A 선수가 티잉 그라운드에서 티샷한 공이 페어웨이 옆에 갈대 숲으로 들어가서 공을 찾았으나 공을 칠 수 없다고 판단하고 처치를 하려고 하는데 처치할 지역이 또 갈대 숲이라 공을 놓고 샷을 할 수 없는 상황이 되었다.\n\nA 선수의 벌타 이유를 기술하세요. (5점)","a":"갈대 숲에 공이 있어 샷을 할 수 없어 언플레이블을 선언하고 동반자의 확인을 받아 2벌타를 부여한다."},{"n":2,"q":"A선수가 조치할 내용을 기술하세요. (5점)","a":"언플레이어블을 처치할 지역이 없을 경우에 공이 있던 지점에서 티잉그라운드 방향의 후방으로 샷을 할 수 있는 근접한 지점에 공을 놓고 경기를 한다"},{"n":3,"q":"상황 2. 파4홀인 2번 홀에서 B 선수가 티잉 그라운드에서 티샷한 공이 OB 말뚝의 경계선이 있어 B 선수가 동반자보다 먼저 나가 공을 보고 OB가 아니라고 하며 샷을 하였으나 그린을 지나 OB 경계선을 벗어나서 OB 경계선을 벗어난 지점 앞에 공을 놓고 퍼팅을 하여 컵인에 성공하였다. ※ 대회요강에 로컬룰로 더블 파를 적용하고, 2번 홀에는 좌·우측에 OB 티가 설치되어 적용한다라고 명시되어 있다.\n\nB 선수에 대한 규칙 위반 이유 2개를 기술하세요.(10점)","a":"① 첫 번째 규칙 위반 이유 기술(5점)\n동반자의 OB 판정을 받지 않아 2벌타, 나간 지점에서 OB처치를 하지 않아 2벌타를 추가하여 4벌타\n② 두 번째 규칙 위반 이유 기술(5점)\nOB 경계선을 벗어나 OB로 판정 2벌타 로컬룰에 의해 OB티를 적용하지 않아 2벌타를 추가하여 4벌타"},{"n":4,"q":"B 선수의 총타수와 이유를 기술하세요. (5점)","a":"3타에 컵인, 8벌타 합산 11벌타이나 파4의 더블파(8타)를 적용하여 8타로 기록한다."},{"n":5,"q":"상황 3 파3홀에서 C 선수가 티잉 그라운드에서 티샷을 하였으나 살짝 맞아 티에서 떨러졌기에 다시 티에 올려놓고 샷을 한 공이 그린의 홀컵에서 1클럽 이내에 안착되어 경기자가 먼저 컵인을 시도하였으나 홀컵을 맞고서 홀컵에 붙어 있어 화가 나 한 손으로 퍼팅을 하여 컵인 되었다. ※ 대회요강에서 로컬룰로 더블 파를 적용한다\n\nC 선수의 규칙 위반 이유 3개를 기술하세요. (15점)","a":"① 첫 번째 규칙 위반 이유 기술(5점)\n티에서 떨어진 공을 집어 들었으므로 2벌타. 공이 떨어진 지점이 아닌 다른 지점(오소)인 티에 놓고 샷을 하여 2벌타를 추가하여 4벌타\n② 두 번째 규칙 위반 이유 기술 (5점)\n홀컵에서 2클럽 이내인 경우는 동반자에게 통보하지 않고 먼저 컵인을 하여 매너위반\n③ 세 번째 규칙 위반 이유 기술 (5점)\n퍼팅 시 한 손으로 한 경우는 매너 위반으로 무벌타"},{"n":6,"q":"C 선수의 총타수와 인유를 기술하세요. (5점)\n4타에 컵인, 4벌타를 합산하여 8타이나 더블파(6타) 적용으로 6타로 기록 한다.","a":"4타에 컵인, 4벌타를 합산하여 8타이나 더블파(6타) 적용으로 6타로 기록한다."},{"n":7,"q":"상황 4 파4홀에서 D 선수는 티잉 그라운드에서 티샷을 하여 공이 그린 앞에 정지하였다. 동반자가 2번째 샷을 하는데 D 선수의 공이 방해되어 마크를 요구하여 마크를 하려고 하는데 공 마커를 갖고 오지 않아 주변의 작은 나뭇잎으로 공 뒤에 마크를 하였다. 이때 동반자가 D 선수의 공마커(작은 나뭇잎)가 방해되니 좌측으로 공 마커를 옮겨줄 것을 요구하여 좌로 클럽헤드 1개 길이를 이동하고 공 마커를 놓은 후에 그 자리에서 퍼팅을 하여 컵인이 되었다. ※ 대회요강에서 로컬 블로 더블 파를 적용한다.\n\nD 선수의 규칙 위반 이유 2개를 기술하세요. (10점)","a":"① 첫 번째 규칙 위반 이유를 기술하세요. (5점)\n공마커가 아닌 나뭇잎으로 마크를 하여 매너 위반으로 무벌타\n② 두 번째 규칙 위반 이유를 기술하세요. (5점)\n공마커를 원위치하지 않고(오소플레이) 퍼팅을 하여 2벌타. (퍼팅은 컵인으로 인정)"},{"n":8,"q":"D 선수의 총타수와 이유를 기술하세요. (5점)","a":"2타에 컵인, 2벌타를 합산하여 총 4타로 기록한다."},{"n":9,"q":"상황 5 파5홀에서 E 선수는 티잉 그라운드에서 티샷한 공이 옆 홀에서 OB 난 공과 충돌하여 페어웨이에 정지되었고 옆 홀의 공도 옆 홀의 페어웨이에 정지되었다. 정지된 지점에서 다음 샷을 한 공이 옆 홀의 나무를 맞고 그린 위에 정지하였다. 다음 10미터 롱 퍼팅이 홀컵 가까이 있는 동반자의 공을 맞고 컵인 되었다.\n\nE 선수의 총타수와 이유를 기술하세요. (10점)","a":"국외자의 공에 맞았으므로 무벌타로 1타 국외자(장애물)에 맞았으므로 무벌타로 1타 퍼팅이 동반자의 공에 맞아 무벌타로 컵인을 인정하여 1타 가산 총 3타로 기록한다."},{"n":10,"q":"상황 6 파3홀에서 F 선수는 티잉 그라운드에서 공을 티 위에 놓지 않고 티샷을 하였는데 OB가 나서 공이 나간 지점에서 처치를 하여 롱퍼팅이 컵인이 되었다.\n\nF 선수의 총타수와 이유를 기술하세요. (10점)","a":"공을 티 위에 놓지 않아 2벌타 (3점)\nOB에 대해 2벌타를 합하여 4벌타(3점)\n2타로 컵인되어 4벌타를 합산하여 총 6타로 기록한다. (4점)"},{"n":11,"q":"상황 7 파3홀에서 G 선수는 티잉 그라운드에서 티샷한 공이 러프지역에 정지하여 공 주위의 긴 풀을 뽑아 샷하기 좋게 하고 샷을 하여 그린에 안착되었다. 다음 퍼팅을 하기 위해 공 앞에 있는 작은 풀을 뽑고 퍼팅을 하여 공이 컵인되었다.\n\nG 선수의 총타수와 이유를 기술하세요. (10점)","a":"러프에서 공 주변을 개선하여 2벌타 (3점)\n그린 위에서 퍼팅라인을 개선하여 2벌타(3점)\n3타에 컵인, 4벌타를 합산하여 총 7타이나 더블파(6타) 적용으로 총 6타로기록한다. (4점)"},{"n":12,"q":"상황 8. 1개조 4명이 모두 스코어카드를 기록하여 대회 주최 측에 제출하는 대회에서 대회 주최 측에서 스코어카드를 검증하는 과정에 1조의 동반자 3명의 기록과 선수의 기록이 1번 홀에서 1타가 적게 기록되었고, 2조에서는 2번홀에서 동반자 3명의 기록과 K 선수의 기록이 1타가 많게 기록되어 있는 것을 발견하였다. 심판으로써 어떻게 판정하여야 하는가?\n\n1조의 선수에 규칙 위반 이유와 판정을 기술하세요. (5점)","a":"동반자의 기록보다 1타 적게 (실제 타수보다 적게) 기록하여 실격으로 처리한다."},{"n":13,"q":"2조의 K 선수에 규칙 위반 이유와 판정을 기술하세요. (5점)","a":"동반자의 기록보다 1타 많게(실제 타수보다) 기록하여 유효로 인정한다."}]}];let si=Math.max(0,Math.min(4,(Number(new URLSearchParams(location.search).get('set'))||1)-1));const card=document.getElementById('card');
