<body><main class="wrap"><header class="head"><h1>심판 참고문제</h1><p>업로드 텍스트 파일별 원문형 참고문제</p></header><a class="back" href="./referee.html">← 심판용 100문제로 돌아가기</a><div id="sets" class="sets"></div><section id="card" class="card"></section><p class="note">문제 문장은 업로드한 텍스트 자료를 기준으로 수록했습니다. 원문에 정답이 없는 시험지는 임의로 정답을 만들지 않았고, 역할 예상문제의 기재 답안은 ‘원문 기재 답안’으로 표시합니다.</p></main>
<script>const sets=[{"name":"3급 심판 자격 이론시험 (기출문제)","items":[{"n":1,"q":"샷의 순서를 지키는 방법이다. 거리가 먼 것은?\n가. 세컨드 샷부터는 깃대를 기준으로 먼 곳의 공이 우선하는 것을 준수한다.\n나. 다음 홀에서는 전홀에서의 적은 타수순에 따라티 샷을 하면 된다. 다. 경 기진행상 퍼팅 시홀컵에 가까운 공이 먼저 컵인을 시도할 수도 있다.\n라. 비슷한 위치에서 러프에 빠진 동반자보다는 페어웨이에 있는 자신의 공 이 우선하므로 먼저 진행해야만한다.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":2,"q":"코스 내에는 경기자에게 홀공략을 어렵게 하기 위하여 연못, 냇물, 나무, 수풀등의 장애물이 있다. 이를 무엇이라고 하는가?\n가. 벙커\n나. 러프\n다. 해저드\n라. OB 지역","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":3,"q":"벙커에서 경기규칙 적용 기준이 다른 것을 고르시오.\n가. 모래에 묻혀있는 공을 치기 쉽도록 클럽 헤드로 모래를 누르는 경우\n나. 공주변의 모래를 고르는 경우\n다. 샷을 하면서 백스윙 없이 퍼 올리는 경우\n라. 공을 맞히지 못하고 주변 모래만 친 경우","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":4,"q":"경기 중인공에 대한 설명을 나열하였다. 아닌 것을 고르시오.\n가. 마크를 해서공을 집어 든 후다시 공을 놓고 볼마커를 들었을 때 \n나. 경기자가공 이 흠집이 나서예비 공으로 교체하려할 때\n다. 분실구, 언플레이어블 등으로 공을 집어 들고 나서 규칙에 의한 지점에 공을 놓고스트로크를 하였을 때\n라. 티잉 그라운드에서 스트로크를 한공이 홀아웃 할 때까지의 상태","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":5,"q":"Par4 홀에서 경기자가 티 샷을 하여 그린에 올려놓고 퍼팅을 시도하다가 공이홀컵을돌아나오기에 공을 클럽 헤드로 막았는데 이후 순서에 따라 한 손으로 컵인을 하였다. 모두 몇 타로 기록해야 하는가? 가. 2타\n나. 3타\n다. 4타\n라. 5타","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":6,"q":"Par5 홀에서 경기자가 티잉 그라운드에서 왼발 뒤꿈치를 벗어나게 스탠 스하고 티샷을 하였다. 세컨드 샷은 1회의 헛스윙을 하고서 깃대2m에 공을 보낸 다음이후 2타만에 컵인이 되었다. 모두 몇 타에 해당하는가?\n가. 4타\n나. 5타\n다. 6타\n라. 7타","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":7,"q":"전국 규모대회를 개최하면서 해당 시도협회의 1급 지도자를 소집하여 진 행요원 임무를 부여하였다. 지정 홀에 고정 배치되어 샷건 방식으로 진행 시 자신의 역할이 잘못된 것을 고르시오.\n\n가. 선수 인적사항을 확인하고몸 풀기를 시키면서 기다렸다.\n나. 경기가 시작되었으나 조원중에 급한 용무가 있어 잠시 기다렸다가 진행시켰다.\n다. 시작 조가홀아웃하고 후속조가 도착하기에 조원의 타수를 확인하고 티 샷순서를 가위바위보로 정하게 하여 진행시켰다.\n라. 선수중에 컨디션이 안좋아서 경기 포기를 희망하기에 경기를 금지시켰다.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":8,"q":"다음 경기 규칙 적용 방법이 다른 하나를 고르시오.\n가. 연습스윙 시클럽 헤드에 공이 맞아 티에서 떨어진 경우\n나. 낙엽을 치우다가 공을 건드린 경우\n다. OB라인이 떠 있어 밟고샷을 한 경우\n라. 언플레이어블을 선언하지 않은 경우","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":9,"q":"다음은 경기 규칙에 대한 설명이다. 거리가 먼 것을 고르시오.\n가. 코스 내 곡선의 도로가 있어 OB 말뚝으로 설치가 곤란한 경우 말뚝 없이 도로의홀쪽라인을 OB 경계선으로 할 수 있다.\n나. 우천으로 경기가 잠시 중단되었다가 재개될 경우 중지된 홀 티잉 그라운 드에서 다시 티샷을 하게 된다.\n다. 도그레그홀은 굽어져 있는 상태의 홀로 직접 공략을 못하게 할 수 있다.\n라. 다음 홀로 이동하는 안내판은 고정 설치물로 위치이동이 안 된다.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":10,"q":"다음 설명 중 맞는 것을 고르시오.\n가. 캐주얼 워터는 홀의 난이도, 경관을 위해 만든 것으로 무벌타 구제를 받을수 없다\n나. 워터 해저드는 일시적으로 생긴 웅덩이로 구제받을 수 없다.\n다. 수리지는 잔디보수를 위해 만들어진 구역으로 무벌타로 구제를 받을수 있다.\n라. 수리지는 가능하면 공이 정지한 위치에서 다음 경기를 하여야 한다.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":11,"q":"경기 중 마크에 대한 설명으로 틀린 것을 고르시오.\n가. 티잉 그라운드에 있는공은 마크를 요구하고 동반자가 티 샷을 해도 된다.\n나. 경기자가 세컨드 샷을 위해 마크를 요구하였으나 공과 공사이가 20m를 넘는 위치이기에 동반자는 이에 응하지 않았다\n다. 홀컵에서 2클럽 이상의 거리에 있는 공을 동반자의 요구가 없는데 임의 로마크할 경우 2벌타를 부여한다.\n라. 볼마커를 좌우로 이동한 후에 원 위치하지 않고 샷을 한 경우 2벌타를 부 여한다.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":12,"q":"경기 진행중에 A-9홀을 홀아웃하고 다음코스인 B-1 홀에 도착하여 티 샷순서를 정하려고 한다. 맞는 것은?\n가.A-9홀에서 종료되었기에 가위바위보로티 샷순서를 다시 정한다. \n나. A-9홀에서 더블파로 먼저홀아웃되어B-1홀에 미리 도착한 선수에게 격려 성 오너의 기회를 준다.\n다.A-9홀에서 경기자 모두가 타수가 동일하기에 A-8홀에서의 타순에 따라 티샷을 한다.\n라. 경기 흐름을 중시하여 티 샷이 준비된 경기자를 먼저 경기하게 한다.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":13,"q":"다음 처치 방법 중잘못된 것은?\n가. 공이 분실되었다고 추정되는 지점에서 깃대와 가깝지 않게 예비 공을놓 아야한다.\n나. 예비 홀컵 위에 공이놓여 있을 경우 클럽 2개 길이 이내로 구제받는다.\n다. 스프링쿨러 옆에서는 페어웨이 좌, 우측으로 클럽 2개 길이 이내로 깃대 와 가깝지 않게 이동할 수 있다.\n라. 캐주얼 워터에서 구제시 공이 놓인 위치로부터 가까운 쪽으로 스탠스가 걸리지않고스트로크가가능한 지점으로 나와야한다.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":14,"q":"선수 2명 중 먼 거리에 있는 선수 A가 퍼팅을 시도하여 공이 굴러가는데 옆에서 어드레스 하면 선수 B도 퍼팅을 하면서 공이 충돌하였다면 어떤 경 기규칙을 적용받게 되는가?\n\n가. 순서를 지키지 않았으므로 선수 2명 모두에게 2벌타를 부여한다. \n나. 공이 움직이는 중에샷을하였으므로 선수에게만 2벌타를 부여하고 선수 는 벌타 없이 현 위치에서 경기를 진행한다.\n\n다. 근거리에 있던 B 선수는 순서를 지키지 않았으나 벌타 없이 현 위치에서 다음 경기를 진행하고 선수에게만 다시 퍼팅 기회를 부여한다.\n\n라. 샷순서를 지키지 않은 결과이므로 각자의 책임에 따라 벌타 없이 공이 정 지한 위치에서 계속 경기를 진행한다.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":15,"q":"그린에서 경기자가 준수할 사항을 나열하였다. 이중 잘못된 것을 고르 시오.\n\n가. 퍼팅 순서는 페어웨이와 동일하게 먼 거리 순을 원칙으로 한다. \n나. 경사 도가 심한 그린에서 퍼팅을 하였으나 홀컵을 벗어나 다시 먼 거리에 위치하 기에 다시 퍼팅을 하기 위해 순서를 기다리기보다는 동반자에게 먼저 퍼팅 을유도하였다.\n다. 그린에 있는 동반자의 공 3개가 목표 방향쪽에 있는 경우에 모두 마크해 달라고 요구할 수 있다.\n라. 자신의 공이 약간 멀리 있으나, 동반자의 공때문에 스탠스에 문제가 있어 서 동반자에게 마크 요구보다는 먼저 퍼팅 하도록 요청한다.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":16,"q":"경기자가 티샷을 하였는데 공이 반쪽으로 파손된 것이 확인된 경우어떻 게조치하여야하는가?\n가. 공이 반쪽으로 파손되는 상황이 극히 드문 경우이므로 자신의 판단하에 더 좋은 방법을 선택하여 동반자에게 통보후 다음 경기를 한다. \n나. 반쪽으 로 나누어진 공의 큰 부위가 홀컵 가까이 있어 이를 사용하여 컵인 올시도한다.\n다. 반쪽으로 나누어진 공의 큰부위 위치에 예비공을 놓고서 다음 경기를 시 도한다.\n라. 동반자와 동행하여 티잉 그라운드에 도착한 후속조에게 상황 설명 및 양 해를 구하고 예비 공으로 다시티 샷을 한다.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":17,"q":"경기 도중 마크에 대한 설명으로 틀린 것을 고르시오.\n가. 경기자가 티 샷한 공이 티잉 그라운드 1m 앞에 놓여있을 경우 다음 순서 인 동반자가 티 샷시 방해가 되므로 마크를 요구할 수 있다. \n나. 경기자가 세 컨드 샷준비 중목표 방향의 공에 대해 마크를 요구하였으나 동반자가 응하 지 않은 경우 경기진행이 중지될 수 있다.\n다. 깃대에서 2클럽 이상의 거리에 있는 공을 동반자 요구가 없는데 임의로 마크를할경우 2벌타를 부여한다.\n라. 경기자가 마크를 원할 경우 동반자가 볼 마커가 없을 시 나뭇잎이나 작은 돌로는 마크를 하면 안 된다.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":18,"q":"A 선수가 티 샷을 하여 페어웨이로 공이 굴러가는데 옆 홀에서 B 선수가 티샷을 한 공과 충돌하여 A, B 선수의 공이 모두 OB가 되었다. 이후 처리 방 법이 맞는 것을 고르시오.\n가. A 선수의 잘못이 없으므로 심판 및 동반자에게 확인후 다시티 샷을한다.\n나. A 선수의 잘못이 없으므로 나간 지점의 페어웨이에 공을 놓고 무벌타로 세컨드샷을 한다.\n다.A 선수. B 선수는 공을 회수하여각각 자신의 홀에서 다시티 샷을하도록 한다.\n라.A.B선수공은OB로 판정하여 OB가난 추정 지점에서 규칙대로 OB 처치 를 해야한다.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":19,"q":"파크골프장의 시설물과 설치물에 관한 내용이다. 틀린 내용을 고르시 오.\n가. 난이도를 부여하기 위해 벙커, 러프, 워터해저드 등을 설치한다. \n나. OB 말뚝은 홀의 경계를 구분하는 데 필요한 곳에 많이 설치하는 것이 좋다.\n다. 코스 내 안전망은 안전을 위해 필요한 것이지만 적절하게 설치하는 것이 권고된다.\n라. 시설물은 클럽하우스, 페어웨이, 그린, 벙커 등이며 설치물은 티잉 그라 운드, 안전망, 깃대, 배수구등이있다.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":20,"q":"파크골프는 에티켓과 매너를 중시한다. 대로 놔둔다.\n나. 가까이 대기 중인 심판에게 자신의 공에 대해 마크를 요청한다.\n다. 접근하면서 먼저 걸어나가서 깃대주위를 확인하고 퍼트 순서를 기다린다.\n라. 동반자가 이동하는 것을 확인하면서 동반자에게 통보하고 컵인하거나 마크를 한다.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":18,"q":"4번째 홀에 도착하여 순서에 따라 선수가 티샷을 하였는데 공이 우측으로 많이 밀려서 OB구역 쪽으로 굴러가 이후 조원과 같이 확인해본 결과, OB여부를 누가 먼저 결정하면 되는가?\n가. 본인 나. 동반자 다. 심판 라. 본부석(심판위원장)","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":19,"q":"A 선수가 동반자에게 배려와 매너를 준수하는 행위이다. 거리가 먼 것 을 고르시오.\n가. 그린위에서 동반자의 퍼팅라인을 밟지 않도록 하며, 필요할 경우는 선을 밟지 않게 넘어갈 수도 있다.\n나. 컵인이 되면 자신의 타수를 동반자에게 자연스레 알려주며, 동반자는 축 하와 격려의 말을 듣는다.\n다. 공이 비슷한 위치일 경우, 자신이 먼저 샷을 하려고 동반자의 이동 또는 샷행위를 중지시킨다.\n라. 조원 모두 홀아웃하면 각자의 타수를 확인한 후, 다음 홀로 이동하여 스 코어카드에 기록한다.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":20,"q":"본 대회에서 선수의 실격사유를 나열하였다. 아닌 것을 고르시오.\n가. 조원끼리 담합하여 타수를 조작한 경우\n나. 스코어카드를 실제 타수보다 많게 합산하여 제출한 경우\n다. 심판의 최종 판정에 이의가 있어 이를 불복하는 경우\n라. 선수가 홀 배치가 완료되어 경기가 시작된 이후에 해당 홀에 도착한 경우","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":21,"q":"본 대회에 심판으로 참가하여 역할을 수행하였다. 다음 중 가장 잘못된 것을 고르시오.\n가. 선수를 서로 잘 식별하도록 공의 색상을 스코어카드 이름위에다 표식 또 는 메모를 하게 하였다.\n나. OB경계구역을 완전히 벗어난 공을 접근하는 경기자에게 굴려서 전달 해주고 OB처치를 요구하였다.\n다. 경기 시작홀에서 스코어카드에 기록된 명단 순서대로 티샷 순서를 따르 도록 제시하여 진행시켰다.\n\n라. 경기자가 볼마커를 소지하고 있지를 않아 경기를 중지시키고서 동반자 에게 빌려주도록 하였다.\n\n[22~29] 전국대회시 경기도중에 발생하는 경기진행과 벌타유무에 대한 설 명이다. 아래 선수 4명(A,B,C,D)의 행동과 진행 상황을 이해하면서 질문에 답을 선택하시오.\n\n대회본부에서 경기를 시작하게 하여 A-1홀부터 진입을 한 선수 4명이 티샷 순서를 정하고서 매너와 경기 규정을 지키면서 3개 홀을 진행하였는데.\n\n(23)A-4홀에서는 러프에 빠진 조원 1명의 공을 찾는다고 많이\n\n(24)지체되어 늦게 홀아웃을 하였고, A-5(PAR5)홀로 이동해 보니 앞 조는 이미 홀아웃하고 빠져나가서 조간격을 유지하려는 다소 조급한 마음이 들었다.\n\n이때, 더블파로 홀아웃한 (25)A 선수가 먼저 티박스에서 기다리 다가 동반자가 도착하는 것을 보고 티박스 매트위에 있던 공을 그대로 티샷을 하였다.\n\n이후 나머지 제일 적은 타수로 홀아웃한 B선수를 포함한 C, D 선\n\n수가 티샷을 하였는데, A 선수 경우는 이번 홀에서도 공이 우측\n\n으로 밀려서 OB구역을 벗어나 처치후 4타만에 컵인을 하였으며\n\nB, C, D 선수도 (25~29)OB와 벌타를 부가받으며, 5~8타로 홀 아웃이 되었기에 앞 조와의 간격을 줄이지 못하였다.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":22,"q":"A 선수를 포함한 조원 모두가 A-4홀에서 경기를 진행한 결과이다. 규정 에 맞는 행위로 볼 수 없는 것은?\n\n가. 경기흐름(또는 조간격)을 유지하고자 A 선수의 요청을 동반자가 양해하\n에 티샷을 하게 하였다.\n\n나. 앞 조와의 벌어진 간격을 좁히려고 A 선수의 티샷을 동반자가 요청할 수 도 있다.\n\n다. A-4홀에서 분실된 공을 조원 모두가 러프지역을 수색하면서 후속조를 대기시켜 경기를 지연시켰다.\n\n라. A선수가 더블파로 다음 홀에서 타수를 만회하도록 조원이 양해해주어 미리 다음 홀로 이동 대기하였다.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":23,"q":"이 선수 조는 모두가 러프지역 등에 빠진 공은()분내로 찾도록 하고, 시간이 경과되어 못찾으면 분실구 처리를 해야 한다. ()에 맞는 시간은?\n\n가. 3분\n\n나. 5분\n\n다. 7분\n\n라. 10분","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":24,"q":"A 선수는 A-5홀에서 몇 타로 스코어카드에 기록하게 되는가?\n\n가. 8타\n\n나. 9타\n\n다. 10타\n\n라. 11타","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":25,"q":"다음 중 벌타에 해당하지 않는 것이 있다. 맞는 것을 고르시오.\n\n가. 어드레스하려고 클럽헤드를 공 뒤에 두다가 공을 건드려서 OB가 된 경우\n\n나. 벙커에서 백스윙 없이 공을 밀어내듯이 샷을 한 경우\n\n다. 페어웨이에서 본인 공이 아닌 동반자의 공으로 샷을 한 경우\n\n라. 러프에서 샷을 하였는데 공을 맞히지 못하여 헛스윙이 된 경우","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":26,"q":"티샷이후 페어웨이에서 선수가 다음 샷을 위한 여러 행위를 나열하였 다. 가장 좋은 행위를 고르시오.\n\n가. 자신의 공과 동일한 색상의 공이 있어 본인 공인지를 건드리면서 확인한다.\n\n나. 공의 위치가 좋지 않았지만 연습 스윙을 생략하고 어드레스 및 안정된 샷 에 집중한다.\n\n다. 티샷이 미스되어 세컨드 샷을 먼저해야 하므로 동반자의 티샷을 하는 중에 멀리 돌아 자신의 공으로 다가간다.\n\n라. 자신의 공이 그린에서 떨어져 먼저 샷을 하게 되었으나, 깃대주변의 상태\n를 다가가서 확인하면 좋다.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":27,"q":"다음 중 OB처치를 하는 경우이다. 잘못된 것을 고르시오.\n\n가. OB처치는 공이 안착된 최종 위치에서 최단 직선지점인 페어웨이로 이 동, 처치하는 로컬룰은 지양해야 한다.\n\n나. OB처치 시공은 어깨높이에서 Drop하기 보다는 허리를 숙여서 좋은 곳 을 선정할 수 있다.\n\n다. OB처치 시 위치 선정을 잘못하고서 다음 샷을 하였다고 인정될 시는 2벌 타를 부가하게 된다.\n\n라. OB처치는 클럽을 사용하여 깃대에 가깝지 않은 방향으로 그립길이로 2 회이내를 준수한다.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":28,"q":"벙커내에서 선수의 행동을 나열하였다. 틀린 것을 고르시오.\n\n가. 스탠스하려고 양발로 모래를 가볍게 문지르면서 발 위치를 고정할 수도 있다.\n\n나. 어드레스시 클럽헤드 소울부분을 모래에 살짝 갖다 댈 수도 있다.\n\n다. 빗물이 고여있어 발의 위치가 물 때문에 애로사항이 있으면, 무벌타로\n\n공을 2클럽이내로서 벙커밖에다 처치 하면 된다.\n\n라. 발자국에 안착된 공은 그대로 두고서 다음 샷을 하는 것이 원칙이지만,\n\n무벌타로 처치를 할 수 있는 로컬룰을 제시한 경우 공이 있는 앞, 뒤의 발자 국은 정리할 수 없다.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":29,"q":"장애물과 주변에 대한 설명을 나열하였다. 잘못된 것을 고르시오.\n\n가. 경기 도중에 코스내에서 접하는 자연물 및 인공물 모두를 말한다.\n\n나. 움직일 수 없는 장애물 주변에서는 2벌타를 부과받고 다음 샷을 해야 한다.\n\n다. 통상 장애물은 움직일 수 있는 장애물과 움직일 수 없는 장애물로 구분 된다.\n\n라. 고정장애물이 방해되는 경우, 무벌타로 처치할 수 없다.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":30,"q":"아래 글을 읽고 맞는 답을 선택하시오.\n\n3개 코스가 있는 파크골프장에서 전국대회 개최시 샷건 방식으 로 27홀을 A→B→C→A순으로 진행한다고 한다.\n\nA선수는 B코스 9번홀에 종료되었고, B선수는 C코스 1번홀. C 선수는 A코스 9번홀에서 종료되었다면 선수자신의 조가 어느 홀에서 시작되었는가?\n\n가. A선수: B코스 9번홀, B선수: A코스 1번홀, C선수: C코스 9번홀\n\n나. A선수: C코스 1번홀, B선수: C코스 2번홀, C선수: B코스 1번홀\n\n다. A선수: A코스 9번홀, B선수: B코스 2번홀, C선수: A코스 9번홀\n\n라. A선수: A코스 1번홀, B선수: A코스 1번홀, C선수: C코스 1번홀\n\n단답형 30문항\n\n[31~44] 아래글을 읽고 질문에 답을 쓰시오.\n\n파크골프는 3대가 함께 즐기는 가족형 스포츠로서 도심의 공원 또는 유휴부지에 조성하여 일반 골프보다 쉽게 접하면서 재미있 게즐길 수 있도록 (31)( )년도에 일본 마쿠베츠에서 탄생한 운 동이다.\n\n국내에는 2003년에 도입된 이래 파크골프장이 계속해서 신설되\n\n고 있으며, 그 예가 2017년도에 완공되는 경기도 가평소재 대성 리파크골프장 36홀로서 전국에서 동호인 증가와 생활체육관심 종목으로 자리매김하고 있다.\n\n일반 골프와 같이 파크골프도 운동에 필요한(32~33)용구를 지참하고서 (34)조를 이루어 대한파크골프협회 경기 규정을 적용 하면서 해당 코스의 (35)1번홀부터 진입을 하여 티샷부터 홀아 웃하면서 (36)타수에 의한 (37)순위를 경쟁하는 것이다. 또한, 전국에는 150개가 넘는 파크골프장이 산재해 있으며, 구 장마다 특성과 난이도가 부여되고 있어 일반 회원부터 처음 접 하는 초보자는 지도자의 안내 또는 지도를 받고 (38)진행흐름에 동참하여 상호 배려하는 마음으로 (39)샷 순서와 안전수칙 등 을 지키면서 운동하는 모습이 타 종목의 모범이 되고 있다.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":31,"q":"괄호안에 해당하는 년도는? ()","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":32,"q":"운동에 필요한 용구 중에 파크골프채 및 공의 무게는 얼마인가?. (g이 하).(g)","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":33,"q":"운동에 필요한 용구 중에서 예비공과 스코어카드를 넣는 것을 무엇이라 하는가?()","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":34,"q":"초보자 17명이 단체로 파크골프장에서 다른 회원과 어울려 조를 편성 하여 라운드하려 한다. 17명을 어떻게 인원을 나누어서 몇개조로 편성하는 것이 가장 타당하고 좋겠는가?( )","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":35,"q":"34번항으로 조 편성후에 라운드가 시작되어 첫 번째  동반자에게 공을 빌려 처치하고 샷을 한 다음 그린쪽으로 접 근해 보니, 선수 4명이 온 그린(On Green)되었다.\n\n이후 A 선수와 C 선수는 2회씩 그리고 B선수와 D 선수는 3회씩 퍼팅을 시도하여 컵인이 되어서 홀아웃을 하였다.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":55,"q":"제일 먼저 경기 규정을 준수하지 않은 선수와 그 내용은 무엇인가?\n\n(\n\n)","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":56,"q":"두번째로 경기 규정을 준수하지 않은 선수와 그 내용은 무엇인가?\n\n(\n\n)","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":57,"q":"상기 경기 진행을 한 A 선수와 선수는 몇 타로 홀아웃을 하였는가? (A: D:)","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":58,"q":"상기 경기 진행을 하면서 A선수와 D 선수가 OB가 났다는데 만약, OB 경계에 Line를 깔아서 기준을 삼았다면 어떻게 확인하면서, OB여부를 판\n정하게 되는가?\n\n( )","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":59,"q":"상기 홀에서 홀아웃을 하고 나서 다음 홀로 이동하면서 후속조에게 보 여주는 매너 행위가 있다. 어떻게 하는 것을 말하는가?\n\n( )","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":60,"q":"만약, 4명의 선수가 상기 홀에서 단합을 하여 OB난 타수를 줄이는 등 순 위에 입상되는 승부조작을 하였다면, 본 협회의 스포츠공정위원회의 규정 상()년 이상의 자격정지, 해임 또는 영구 정지에 적용을 받아 위원회의 결정 에 따라 조치하게 된다.\n\n약술형 2문항\n\n[61~62] 다음 질문에 대해 약술하시오.","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":61,"q":"경기자가 설치된 안전망 주변에 공이 안착되어 이후 행위로 벌타가 발생 하거나 또는 벌타를 부과받고 경기를 하게 된다. 이에 해당하는 4가지 행위 를 나열하시오.\n\n①\n\n③\n\n②","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."},{"n":62,"q":"코스내에서 세컨드 샷을 하는데 오른쪽 사진 모습과 같이 사람(동반자. 제3자)을 맞히는 안전사고가 간혹 발생한다. 2가지 이상의 그 이유 및 예방 책을 약술하시오.\n\n①이유:\n\n예방:\n\n②이유:\n\n예방:","a":"원문에는 정답이 기재되어 있지 않습니다. 기존 심판용 100문제와 4대 기준자료를 함께 참고해 학습하세요."}]},{"name":"3급 심판 역할 예상문제 (1)","items":[{"n":1,"q":"<터샷시 발생한 문제해결>\n\n선수가 첫 번째 순서로 티샷을 하는데 선수 B의 전화를 듣고 그대로 스트 로크를 한 결과, 볼이 티에서 떨어지자 동반자 때문에 방해가 되어 삿이 잘 못되었다고 이의 제기하면서 다시 티샷을 하여 페어웨이에 공이 정지되었 다. 경기규칙 위반여부와다음 경기는 몇 타째인가?","a":"(1) 선수A: 벌타, 5타\n\n(2) 선수B: 매너위반"},{"n":2,"q":"<경기 시작전 심판역할>\n\n금년도 전국대회가 36홀인 천안파크골프장에서 2일간 288명 선수가 4개 그를 으로 조편성하고 심판은 홀별로 1명을 배치하였다. 대회 경기가 시작되 기 전에 홀별로 티잉 그라운드에서 통상심판이 하게 되는 역할은? ①공색깔확인하기②티샷순서 정하기 ③ 불참선수 확인하기 ④스코어카드 홀확인하기","a":"원문 답안 구분이 명확하지 않아 원문 문제만 수록했습니다."},{"n":3,"q":"<경기중 공찾는 시간/분실구처리.\n\nPar 4홀에서 선수 B가 티샷을 하였는데, 러프지역에 빠져 공을 찾지 못하 여 예비공으로 처치후 3타만에 홀아웃을 하였고, 동반자와 함께 다음홀에 도착해 보니 앞 홀은이미 비어 있었다. 공을 찾는 제한 시간은 몇 분이며, 선 수B의 타수는 몇 타인가? ①제한시간: 3분②타수:6타","a":"원문 답안 구분이 명확하지 않아 원문 문제만 수록했습니다."},{"n":4,"q":"마크 및 볼마커 이동 요령.\n\n선수 C가 세컨드 샷을 위하여 목표 방향쪽으로 있는 선수 D의 공을 마크와 함께 볼마커를 왼쪽으로 2회 이동을 요구하여 선수D가 이를 조치하였다.\n선수가 용구를 사용하여 조치한 방법을 순서에 맞게 쓰세요.","a":"①홀컵을 바라보고 볼마커를 공 뒤에 놓는다② 공을 들어올린다. ③ 왼쪽으 로 1클럽헤드 되는 곳에 볼마커를 옮긴다. ④ 다시 왼쪽으로 1클럽헤드 되는 곳에 볼마커를 옮긴다."},{"n":5,"q":"<그린위에서 퍼팅으로 충돌에 대한 조치>\n\n선수 4명이 그린에 공이 모두 위치하여 퍼팅 진행 중, 홀컵에서 제일 먼 선수 A가 퍼팅한 것을 심판이 지켜보는데 다른 위치의 선수 B가 퍼팅을 한 결과, 굴러 가던 선수 A의 공과 충돌하여 공 2개가 모두 컵인 되었다. 경기규칙 위 반여부와 심판은 어떻게 조치를 해야 하는가?","a":"①규칙위반: 경기규칙 위반으로 B에게 2벌타② 조치방법: A. B공 모두 컵인 인정하고 샷순서를 지키지 않은 선수 B선수에게 2벌타 적용한다."},{"n":6,"q":"<구제 처치시 길이기준>\n\nPar4 홀에서 선수 A가 티샷을 하였더니 공이 배수구위에 정지되어 있어 무 벌타로 구제를 받고서 세컨드 샷은 공이 홀컵에 못 미치다 보니 공이 예비 홀 컵 위에 있기에 처치를 한후 2타만에 컵인을 하였다. 선수 A가 처치시 적용한 길이 기준과 타수는 몇 타인가?","a":"①배수구위: 2클럽이내 ② 예비홀컵 위 : 2헤드길이 이내③타수: 4타"},{"n":7,"q":"마크요구가능/불가능한 경우.\n\n대회를 하다보면 마크를 하는 상황이 자주 발행하는데 선수 A의 잘못된 요 구를 동반자인 선수 B가 거부할 수 있는 상황은 자신의 공이 전방 20m 이상 있는 경우이다. 선수가 선수 B의 공에 대해 마크요구가 불가한 상황은 어 떤경우인가?","a":"설명: 티샷할 때"},{"n":8,"q":"홍진입 잘못한 선수에 대한 조치.\n\nA-5홀에서 홀아웃하고 다른 코스인 B-6홀로 잘못 진입하여 B-9홀에서 경\n기가 끝나고서 홀을 빼놓고 경기한 것을 알았다. 심판은 누구에게 몇 벌타를 부여하여 스코어카드에 기록해야하며, 이후 어떻게 조치를 해야하는지를 쓰세요.","a":"①벌타수: 총8벌타② 조치방법:누락된A-6홀로 되돌아가서 경기하고서 잘 못진행한 B-6홀부터 B-9홀까지 4개홀에 각각 2벌타씩을 조원 모두에게 부여한다. (더블파를 적용 안한다)"},{"n":9,"q":"<경기증 위반 행위에 대한 이해>\n\nPar 4홀에서 선수가 티샷을 하여 그린위에 안착하였다. 내리막 경사를 고 려하여 퍼팅을 약하게 하였는데 공이 홀컵을 지나치기에 클럽헤드로 막고 나서 공 이자기 마음에 안든다고 예비 공으로 교체하여 2타만에 홀아웃을 하였다. 경기규칙 위반여부와 선수 A의 타수는 몇 타인가?","a":"①규칙위반(1)클럽헤드로 막는 행위 (2)공을 교체한 행위 ② 타수:8타"},{"n":10,"q":"<마크 행위 위반에 대한이해>\n\nPar4홀에서 선수 K가 세컨드 샷을 하였는데 흘겁바로 옆에 정지되었다. 동 반자가 마크를 요구하여 선수 K는 공을 집어 들다가 바로 내려놓고 마크를 한이 후퍼팅을 시도하여 2타만에 홀아웃을 하였다.\n\n경기규칙 위반여부와 선수 K의 타수는 몇 타인가?","a":"①규칙위반: 마크를 하지 않고 공을 집어든 행위로 2벌 타를부여 받는다② 타수: 6타"},{"n":11,"q":"<티샷순서 위반에 대한 조치>\n\n선수 D가 전에 홀에서 가장 타수가 많았음에도 다음 홀인 Par5홀에 대하여 자신이 이번 홀의 공략 방법을 잘 안다면서 D선수가 먼저 티샷을 하였는데 동반자들 이2벌타를 제기하였다. 경기규칙 위반여부와 심판은 어떻게 처리 하면 되는가?","a":"①규칙위반: 개인전에서는 샷순서는에티켓 위반 포섬에서는 벌타부여조 지방법 : 개인전에서는 무벌타로써 동반자에게 사과하고 다음 경기를 진행,\n포섬은 팀에 2벌타부여한다."},{"n":12,"q":"안전망 주변에서의 경기 진행.\n\nPar4홀에서 선수 G가 티샷을 하였는데 공이 안전망 앞에 안착하였다. 다 음샷을 위한 백스윙 도중 클럽헤드가 안전망에 접촉하면서 샷을 한 이후 3 타만에 컵인을 하였다. 경기규칙 위반여부와 선수G의 타수는 몇 타인가? ①규칙위반 백스윙하면서 망을 건드린 경우는 무벌타②타수:5타","a":"원문 답안 구분이 명확하지 않아 원문 문제만 수록했습니다."},{"n":13,"q":"공끼리 충돌이후에 대한 조치.\n\n페어웨이에서 선수 2명이 다른 비슷한 거리에서 다음샷순서를 정하지 않고 동시에 샷을 하여 2개공이 충돌하면서 모두 OB가 되었는데 먼 거리에 있었 다고 주장하는 선수 A가 원래 위치로 OB난 공을 들고 가면서 다시 샷을 하 겠다고이 동하는 중이다. 경기규칙 위반여부와 심판은 어떻게 조치해야하 는가?","a":"①규칙위반: 순서를 지키지 않는 매너위반\n\n②조지방법: 2개의 공은 정지된 위치 즉 OB가 되었기 때문에 OB처치후두 선수에게 각각 2벌타를 부여하고 다음 경기를 하여야한다."},{"n":14,"q":"언플레이어블에 대한 처치 방법.\n\n선수K가 세컨드 샷을 하였는데 긴 러프에 빠져서 언플레이어블을 선언후 처 치할 적합한 장소를 계속 이동하여 찾고나서 다음 경기를 하였는데 그린을 지나서 OB가 되었고, 이후 2타만에 컵인을 하였다. 선수 K의 타수는 몇 타 이며, 언플레이어블 처치 방법을 정확히 쓰세요","a":"①타수:9타②처치방법 : 2벌타 부여, 그 위치에서 깃대를 바라보고 수직방 향으로 양팔을 벌려 좌, 우, 측에서 2클럽이내에 깃대에 가깝지 않는 지점에 공을 놓고 경기를 한 방향으로 이동하면서 샷이 가능한 지점에서 다음 경기 블한다."},{"n":15,"q":"샷 순서 지키기에 대한조치.\n선수가 세컨샷을하여 페어웨이로 공이 굴러가고 있는 선수 B가 다른 위 치에서 바로 샷을 하였다. 이때 공끼리 충돌을 피하였지만 옆에 있던 선수 C 가공이 굴러가고 있는 상태에서 선수 B가 샷순서를 지키지 않았으니 '2벌 타'라고 제기하였다. 경기규칙 위반여부와 어떻게 조치해야하는가?","a":"①규칙위반: 에티켓 위반② 조치방법 : 무벌타로서 동반자에게 사과하고 다 음경기를 진행한다."},{"n":16,"q":"캐주얼 워터에서 구제 방법.\n\n경기도중 갑자기 비가 내리는 가운데 케쥬얼워터가 생겼고 여기에 공이 들 어가 처치를 하려는데 목표 방향쪽에 다른 캐주얼 워터가 있다. 어떻게 처치 를 하여 다음 경기를 하는가?\n\n처치방법 : 공이 정지된 지점에서 깃대를 보고 수직방향으로 서서 좌, 우측 으로 캐주얼 워터를 벗어나 홀컵에 가깝지 않게 스탠스와 스트로크가 가능 한 지점에 벌타없이 공을 놓고 경기를 하려는데 목표방향에 있는 또다른 캐 주얼 워터까지 구제받을 수 없으므로 그 지점에서 2크럽이내의 좋은 위치에 공을 놓고 경기를 하여야 한다.","a":"원문 답안 구분이 명확하지 않아 원문 문제만 수록했습니다."},{"n":17,"q":"스윙 중 2회 이상클럽에 접촉시에 대한 조치.\n\n선수가 샷을 하면서 움직이는 공을 '다시 클럽에 접촉하였다.'고 동반자인 선수B가 벌타라고 지적하였더니, 선수 A는 경기 규칙에 아무런 문제가 안 된다고 심판한데 이의 제기를 하고 있다. 경기규칙 위반여부와 어떻게 조치 해야하는가?","a":"①규칙위반: 드리블②조치방법: 스트로크가 되었기에 1타 가산에 움직이 는 공을 쳤으므로 2별타를 부여하여 3타가 되며, 공이 정지된 지점에서 경 기를한다."},{"n":18,"q":"클럽헤드로공을 건드린 행위에 대한조치.\n\n선수 F가 페어웨이에서 어드레스 자세를 할 경우 글럽헤드를 공 뒤에 두다가 건드리면서 공이 움직였다. 경기규칙 위반여부와 심판은 어떻게 조치해야\n하는가?","a":"①규칙위반: 티샷이후는스트로크로 간주② 조치방법: 1타가산"},{"n":19,"q":"벙커 샷도중위반 행위에 대한조치.\n\n선수가 벙커에서 샷을 한 공이 되돌아오기에 클럽헤드로 막으면서 자신의 몸에 접촉되어 공이 정지하였다. 경기규칙 위반여부와 다음경기를 어떻게 하면 되는가?","a":"①규칙위반: (1)움직이는 볼을 클럽헤드로 막는 행위 2벌타 (2)자신의 몸에 공이 접촉되는 상황으로2벌타② 진행방법: 4벌타를 부여하고 공이 정지된 지점에서 진행한다."},{"n":20,"q":"우천시 이물질 제거에 대한 조치.\n\n선수B가 비가 내려 자신의 공에 진흙이 묻어있어 다음 경기에 방해되어 마 크를 하고서 이를 제거하였다. 경기규칙 위반여부와 다음 경기를 어떻게 하 면 되는가?","a":"①규칙위반: 우천시에도 이물질을 제거할 수 없으며 대회시 로컬룰로 정하 여이 물질을 제거 하도록 공지하지 않았으면 임의로 마크를 하였으므로 벌 타를 부여한다. ② 진행방법: 2벌타를 부여하고 현위치에서 진행한다."},{"n":21,"q":"2개 OB말뚝 중간에 대한 공의 관정방법.\n\n어떤 파크골프장에는 홀마다 OB말뚝이 설치되어 있다. 선수 B가 티샷한 공 이우측OB말뚝가운데 정지되었다. 선수B가 OB여부를 어떻게 판정하는 지 를쓰시오.","a":"==> 공이 안착된 지점에서 두 개 OB말뚝 연장선에서 벗어난 경우에 경기자 가OB로 판정한다(OB라인을 위에서 보았을때 걸리면 오비 아님)"}]},{"name":"3급 심판 역할 예상문제 (2)","items":[{"n":1,"q":"전국대회에서 경기가 시작되면서 실격 처리되는 경우가 종종 발생한 다.\n\n그중 사유에 해당되는 경우 4가지를 쓰시오.","a":"1. 경기시작전에 도착하지 못할시\n\n2. 경기중 연습연습 경기를 할때\n\n3. 심판에게 타당하지 않은 이유로 항의할 때\n\n4. 홀컵주변에서 홀아웃하지 않고 공을 집었을때"},{"n":2,"q":"Par 5홀에서 선수 A가 티샷을 하였는데 공이 수리지에 정지되었기 에 구제를 받고서 두번째 샷에 이어 세번째 샷을 한 결과 확인해보니 예비 홀 컵위에 정지해 있어 옆에 있는 선수 B에게 통보하고 퍼팅 3회 시도하여 컵인 을 하였다. 선수 A가 컵인을 할 때까지","a":"①수리지와②예비홀 컵에서 처치방법③타수는 얼마인지를 쓰세요.\n\n1. 수리지-무벌타로 구제받음 홀컵에 가깝지 않게 2클럽길이내에서 세칸드\n\n샷을함\n\n2. 홀컵 좌우로 클럽헤드기이 2개 거리내에서 옮기고 퍼팅\n\n3.6타"},{"n":3,"q":"Par 5홀에서 선수 A가 티 샷을 하였는데 공이 배수구 위에 정지되었 기에 구제를 받고서 두번째 것에 어어 세 번째 샷을 한 결과, 확인해보니 캐주 얼 워터에 있어 옆에 있는 선수 B에게 알리고서 저치를 한후 3타 만에 컵인을 할 때 선수 A가 컵인을 할 때까지 ①배수구와 케쥬얼 워터에서 처치 시용\n\n구사용방법③타수가 얼마인지를 쓰세요","a":"1. 깃대를 보고 홀컵과의 거리가 가깝지 않게 좌우로 2클럽길이만큼 옴겨 구 제를 받고 다음샷을 한다.\n\n2. 캐쥬얼 워터에 들어갔을때는 공이 놓인 자리로부터 가까운 쪽의 케쥬얼 워터의 가로 나가 2클럽이내의 거리와 깃대에 가깝지 않는 곳에서 구제받고 다음 샷을 한다.\n\n3.6타"},{"n":4,"q":"Par 5홀이 도그레그인 홀에서 직접 깃대를 향해 첫번째 적색으로 표 시된 말뚝 뒤쪽으로 샷을 하면 벌타라고 로컬룰로 공지하였는데 선수 A가 공이 OB발 뚝 못미쳐 있기에 다음 샷은 깃대를 향해 직접 공략하여 말뚝 뒤 쪽을 통과시켜 그린에 공을 정지시켰다. 심판은 ① 어떻게 경기규칙을 적용 하면서 ② 선수 A의 다음 샷이 몇타입니까","a":"1. 적색말뚝 뒤로 지나갔으므로 2벌타를 적용\n\n2.5타째 샷이다."},{"n":5,"q":"선수 4명이 PAR 3인 B-7에서 홀아웃을 하고 다음 홀로 이동하여 C-1홀에서 경기를 한 결과 모두 4타에 홀 아웃하였는데 2홀을 건너뛴 것을 알게 되었다. 그렇다면 심판은","a":"①누구에게 코어카드에 몇타로 기록한후 ② 어떤조치를 해야 하는지를 쓰세 요\n\n1.4명모두에게 4벌타를 더해서 8타로 기록한다.\n\n2.B-8번 홀로가서 티샷하도록 한다."},{"n":6,"q":"단체전 포성경기(베스트볼 적용)가 진행되어 A팀 1번과 2번은 페어웨이와 OB 그리고B팀은 거리가 짧아 페어웨이에 안착하였다. 팀별로 공을 선택한 결과, 페어웨이에 있는 B팀공은 홀컵에서 5m 위치에 먼 거리에 있기에 A팀 의 선수에게 마크를 요구하는데 있어 ①누가 하면 되는 지와 홀아웃을 하 고서 다음 홀에서 티샷하는 방법에 대하여 쓰세요.","a":"1. A팀 1번(다음샷을 할 사람)\n\n2. 적은 타수를 기록한 팀의 선수가 먼저 티샷후 두팀의 선수가 번갈아 가면 서 티샷한다."},{"n":7,"q":"Par 5홀에서 선수 A가 티 샷과 두 번째 어프로치 샷을 하고서 그린위 홀컵 바로 옆 20cm에 정지하기에 선수가 공을 집어들고 다음 홀로 가기에 B가 제지하였다. ① 선수 B가 이동을 제지한 이유와 다시 공을 원래 위치에 두고서 하면 컵인하면②몇 타가 되는 지를 쓰세요","a":"1. 공식경기에서는 실격처리되나 공을 집었으므로 2타를 더한다.\n\n2. 따라서 5타가 된다."},{"n":8,"q":"그린에서 선수C가 퍼팅을 하기 위하여 자신의 공바로 앞에 있는 D선 수에게 볼마커를 오른쪽으로 2회 이동을 요구하였다. 선수 D가 용구를 사 용하여 조치하는 방법을 5가지를 순서대로 쓰시오","a":"원문 답안 구분이 명확하지 않아 원문 문제만 수록했습니다."},{"n":9,"q":"Par4홀에인 전망 주변에서의 경기 진행\n\nPar4홀에서 선수 G가 티샷을 하였는데 공이 안전망 앞에 안착하였다 다음 샷을 백스윙 도중 클럽헤드가 안전망에 접촉히면서 샷을 한 이후 3타만에 컵인을 하였다. 경기규칙 위반여부와 선수 G의 타수는 몇 타인가? ①규칙위반 백스윙 하면서 망을 건드린 경우는 무벌 타 ②타수:5타","a":"원문 답안 구분이 명확하지 않아 원문 문제만 수록했습니다."},{"n":10,"q":"공끼리 충돌이후에 대한 조치\n\n페어웨이에서 선수 2명이 다른 비슷한 거리에서 다음 샷순서를 정하지 않고 동시에 샷을 하여 2개공이 충돌하면서 모두 OB가 되었는데 먼 거리에 있었 다고 주장하는 A가 원래 위치로 OB난 공을 들고 가면서 다시 샷을 하겠다고 이동하는 중이다. 경기규칙 위반여부와 심판은 어떻게 조치해야 하는가? ①규칙위반 순서를 지키지 않은 것은 매너위반\n\n②2개의 공은 정지된 위치 즉 OB가 되었기 때문에 OB처치후 각각에게 2번\n타를 부여하고 다음 경기를 하여야 한다.","a":"원문 답안 구분이 명확하지 않아 원문 문제만 수록했습니다."},{"n":11,"q":"전홀에서 A선수는 3타 B선수는 4타 C선수는 4타 D선수는 5타였다. 그런 데 D선수가 먼저 티샷을 하였는데 동반자들이 2벌타를 주었다 경기규칙 위 반여부와 심판은 어떻게 처리하면 되는가?","a":"①규칙위반여부 : 개인전에서는 샷 순서는 에티켓 위반② 조치 방법: 개인전 에서는 무벌타로써 동반자에게 사과하고 다음 경기를 행한다."},{"n":12,"q":"샷순서 지키기에 대한 조치\n\n선수 A가 세컨드 샷을 하여 페어웨이로 공이 굴러가고 있는데 선수 B가 바로 샷을 하였다. 이때 공끼리 충돌은 피하였지만 옆에서 있던 선수 C가 공이 구 르고 있는 상태에서 선수 B가 샷 순서를 지키지 않았으니 '2벌타'라고 제기 하였다 경기규칙 위반여부와 어떻게 조치해야 하는가?","a":"①규칙위반: 에티켓 위반\n\n② 조치방법:무벌타로시 동반자에게 사과하고 다음 경기를 한다."},{"n":13,"q":"티잉 그라운드에서 선수 A가 연습스윙을 2회 하고서 헛스윙으로 티잉그라 운드에 공이 정지하기에 기다리다가 조원이 모두 샷을 하여 이후 3타 만에 컵 인을 하였다.","a":"①경기규칙을 위반한 행위와② 선수의타수가 몇타인지 쓰시오\n\n1. A선수는 샷순서를 위반하였다. 에티켓 위반\n\n2.4타"},{"n":14,"q":"엔플레이어블에 대한 처치방법\n\n선수 K가 세컨드 샷을 하였는데 긴 퍼프에 빠져서 언플레이어블을 선언 후 처치 위한 장소를 계속 이동하여 찾고 나서 다음 경기를 하였는데 그런을 지\n나서 OB가 나고 그후 2타만에 컵인을 하였다.","a":"① 선수 K의 타수는 몇 타이며, 8타 OB 2타+ 언플레아블 2타+2타+2타 ② 언플레이어블 처치 방법을 정확히 쓰세요.\n\n놓인 장소로부터 치기 좋은쪽으로 2클럽이내의 거리와 홀컵에서 가깝지 않 은 거리에 공을 놓고 친다. 이경우 샷이 가능한 지점이 없을 경우는 이전 샷을 한방향으로 이동하면서 샷이 가능한 지점에서 다음 경기를 한다."},{"n":15,"q":"A 선수가 티샷을하였는데 벙커내 정위치해 있는 고르게 옆에 떨어 지자 고르개를 약간 옮기고 벙커샷을 하였는데 이번에는 배수구 위에 정지 하였다. 조치후 2타에 컵인하였다","a":"①A선수는 몇타로 기록되나요? 6타\n\n고르게 옮김-2벌타, 배수구 무벌타로 구제\n\n②A선수는 배수구 위에서 어떤조치를 했는가\n\n2클럽이내의 거리와 홀컵에 가깝지 않게 구제하고 경기한다."},{"n":16,"q":"선수 A가 Par 4홀에서 티샷을 하고, 어프로치 샷으로 홀컵과 3m 거리에 정 지하자 선수 B의 퍼팅에 방해가 되기에 배려 차원에서 임의로 마크를 하고\n\n볼를 주었다. 이후 샷 순서에 따라 볼마커 앞에 공을 내려놓고서 퍼팅을 하\n\n여 컵인했다. A가①경기규칙상 위반한 행위와 ②타수는 얼마인지를③계산 식으로 적으시오","a":"1. 홀컵으로부터 2m 넘는 거리에 있는 공을 임의로 집었으므로 2벌타\n\n2.5타\n\n3. 티샷 1타+어프로치샷 1타+퍼팅1타+2벌타"},{"n":17,"q":"케쥬얼 워터에서의 처치\n\n경기도중 갑자기 비가 내리는 가운데 선수 A가 티샷을 하였는데 페어웨이에 물이 고여 공을칠수가 없게 되었다. 이때 선수는 어떤 조치를 취할수 있는지 쓰시오","a":"1. 물이 고인 케쥬얼 워터 바깥쪽(공이 놓인곳에서부터 가까운 방향으로) 으로 2클럽 길이 이내에서 홀컵에 가깝지 않은 공에 놓고 친다."},{"n":18,"q":"A선수가 경사가 심한 PAR3홀에서 티샷을 하였는데 홀컵주변 바위 를 맞고 티박스 뒤에까지 굴러 내려왔다. A 선수는 OB처치후 2타로 컵인하 였다.","a":"①A선수가 OB처치는 어떻게 하는가 티박스 뒤쪽 선상에서 오비 처치한다.\n\n②A선수의 기록타수는? 5타"},{"n":19,"q":"4명이 한조가 되어 티샷을 하였는데 ABC 선수의 공은 페어웨이에 안착했는데 D선수의 공은 OB선 가까이 갔다. 이를 보고 A와 B선수는 오비 라고\n\n하고 C와 D선수는 오비가 아니라고 할때 이 상황에서 심판은 어떤 기준으로 어떤 판단과 조치를 해야하는가?","a":"①4선수가 일치하지 않을때는 심판이 판정해야하므로\n\n② 오비선과 공의 위에서 내려보아 선에 걸렸으면 오비가 아닌 것으로 판정 한다."},{"n":20,"q":"포섬경기에서 A조와 B조가 각 2명씩 경기를 하는 중에, 그린근처 에서 퍼팅하려하는데 A조의 동반자는 흡컵 뒤편에서 클럽헤드로 바닥을 짚 어주며 샷방향을 알려주는 행위를 했고 B조의 동반자는 클럽헤드를 바닥 에 대지 않고 방향을 조언했다.\n\n이경우에 어느조가 규칙을 위반했는지와 벌타를 쓰시오","a":"1. A조는 규칙 위반으로 2벌타를 부여 받는다."}]},{"name":"3급 심판 역할 예상문제 (3)","items":[{"n":1,"q":"A선수의 벌타이유를 기술하세요. (5점)","a":"갈대숲에 공이 있어 샷을 할 수 없어 언플레이어블을 선언하고 동반자의 확 인을 받아 2벌타를 부여한다."},{"n":2,"q":"A선수가 조치할 내용을 기술하세요. (5점)\n\n언플레이어블을 처치할 지역이 없을 경우에 공이 있던 지점에서 티잉 그라 운드 방향의 후방으로 샷을 할 수 있는 근접한 지점에 공을 놓고 경기를 한다\n\n상황2. 파4홀인 2번 홀에서 B선수가 티잉 그라운드에서 티샷한 공이 OB 말 뚝의 경계선이 있어 B선수가 동반자보다 먼저 나가 공을 보고 OB가 아니라 고 하며 샷을 하였으나 그린을 지나 OB 경계선을 벗어나서 OB 경계선을 벗 어난 지점 앞에 공을 놓고 퍼팅을 하여 컵인에 성공하였다. ※ 대회요강에로 컬룰로 더블 파를 적용하고, 2번 홀에는 좌·우측에 OB 티가 설치되어 적용 한다라고 명시되어 있다.","a":"원문 답안 구분이 명확하지 않아 원문 문제만 수록했습니다."},{"n":3,"q":"B선수에 대한 규칙 위반 이유 2개를 기술하세요.(10점)","a":"① 첫 번째 규칙 위반 이유 기술(5점)\n\n동반자의 OB 판정을 받지 않아 2벌타,\n\n나간지점에서 OB처치를 하지 않아 2벌타를 추가하여 4벌타\n\n② 두 번째 규칙 위반 이유 기술(5점)\n\nOB 경계선을 벗어나 OB로 판정 2벌타 로컬룰에 의해 OB티를 적용하지 않\n\n아 2벌타를 추가하여 4벌타"},{"n":4,"q":"B선수의 총타수와 이유를 기술하세요. (5점)\n\n3타에 컵인, 8벌타 합산 11벌타 이나 파4의 더블파(8타)를 적용하여 8타 로 기록한다.\n\n상황 3파3홀에서 C선수가 티잉 그라운드에서 티샷을 하였으나 살짝 맞아 티 에서 떨러졌기에 다시 티에 올려놓고 샷을 한 공이 그린의 홀컵에서 1클 럽이내에 안착되어 경기자가 먼저 컵 인을 시도 하였으나 홀컵을 맞고서 홀 컵에 붙어 있어 화가 나한손으로 퍼팅을 하여 컵인 되었다. ※ 대회요강에서 로컬룰로 더블 파를 적용한다","a":"원문 답안 구분이 명확하지 않아 원문 문제만 수록했습니다."},{"n":5,"q":"C선수의 규칙 위반 이유 3개를 기술하세요. (15점)","a":"① 첫 번째 규칙 위반 이유 기술(5점)\n\n티에서 떨어진 공을 집어 들었으므로 2벌타. 공이 떨어진 지점이 아닌 다른 지점(오소)인 티에 놓고 샷을 하여 2벌타를 추가하여 4벌타\n\n② 두 번째 규칙 위반 이유 기술 (5점)\n\n홀컵에서 2클럽 이내인 경우는 동반자에게 통보하지 않고 먼저 컵인을 하여 매너위반③ 세 번째 규칙 위반 이유 기술 (5점) 퍼팅 시 한손으로 한 경우는 매너 위반으로 무벌타"},{"n":6,"q":"C선수의 총타수와 인유를 기술하세요. (5점)\n\n4타에 컵인, 4벌타를 합산하여 8타이나 더블파(6타) 적용으로 6타로 기록 한다.\n\n상황4 파4홀에서 D선수는 티잉 그라운드에서 티샷을 하여 공이 그린 앞에 정지하였다. 동반자가 2번째 샷을 하는데 D선수의 공이 방해되어 마크를 요 구하여 마크를 하려고 하는데 공 마커를 갖고 오지 않아 주변의 작은나뭇잎 으로 공 뒤에 마크를 하였다. 이때 동반자가 D선수의 공마커 (작은나뭇잎) 가방해되니 좌측으로 공 마커를 옮겨줄 것을 요구하여 좌로 클럽헤드 1개 길이를 이동하고 공 마커를 놓은 후에 그 자리에서 퍼팅을 하여 컵인이 되었 다. ※ 대회요강에서 로컬 블로 더블 파를 적용한다.","a":"원문 답안 구분이 명확하지 않아 원문 문제만 수록했습니다."},{"n":7,"q":"D선수의 규칙 위반 이유 2개를 기술하세요. (10점)","a":"① 첫 번째 규칙 위반이유를 기술하세요. (5점)\n\n공마커가 아닌 나뭇잎으로 마크를 하여 매너 위반으로 무벌타\n\n② 두 번째 규칙 위반 이유를 기술하세요. (5점)\n\n공마커를 원위치하지 않고(오소플레이) 퍼팅을 하여 2벌타. (퍼팅은 컵인 으로 인정)"},{"n":8,"q":"D선수의 총타수와 이유를 기술하세요. (5점) 2타에 컵인, 2벌타를 합산하여 총 4타로 기록한다.\n\n상황 5 파5홀에서 E선수는 티잉 그라운드에서 티샷한 공이 옆 홀에서 OB 난 공과 충돌하여 페어웨이에 정지되었고 옆 홀의 공도 옆 홀의 페어 웨이에 정지되었다. 정지된 지점에서 다음 샷을 한 공이 옆 홀의 나무를 맞고 그린위 에 정지하였다. 다음 10미터 롱 퍼팅이 홀컵 가까이 있는 동반자의 공을 맞고 컵인 되었다.\n\n※ 대회요강에서 로컬 를로 더블 파를 적용한다.","a":"원문 답안 구분이 명확하지 않아 원문 문제만 수록했습니다."},{"n":9,"q":"E선수의 총타수와 이유를 기술하세요. (10점) 국외자의 공에 맞았으므로 무벌타로 1타 국외자(장애물)에 맞았으므로 무벌타로 1타 퍼팅이 동반자의 공에 맞아 무벌타로 컵인을 인정하여 1타가산 총 3타로 기록한다.\n\n상황 6파3홀에서 F선수는 티잉 그라운드에서 공을 티 위에 놓지 않고 티샷 을 하였는데 OB가 나서 공이 나간 지점에서 처치를 하여 롱퍼팅이 컵인이 되 었다.\n\n※ 대회요강에서 로컬블로 더블 파를 적용한다","a":"원문 답안 구분이 명확하지 않아 원문 문제만 수록했습니다."},{"n":10,"q":"F선수의 총타수와 이유를 기술하세요. (10점) 공을 티 위에 놓지 않아 2벌타 (3점) OB에 대해 2벌타를 합하여 4벌타(3점) 2타로 컵인되어 4벌타를 합산하여 총 6타로 기록한다. (4점)\n\n상황 7파3홀에서 G선수는 티잉 그라운드에서 티샷한 공이 러프지역에 정 지하여 공주위의 긴풀을 뽑아샷하기 좋게 하고 샷을 하여 그린에 안착되었\n다. 다음 퍼팅을 하기 위해 공 앞에 있는 작은 풀을 뽑고 퍼팅을 하여 공이 컵 인되었다.\n\n※ 대회요강에서 로컬 블로 더블 파를 적용한다.","a":"원문 답안 구분이 명확하지 않아 원문 문제만 수록했습니다."},{"n":11,"q":"G선수의 총타수와 이유를 기술하세요. (10점)","a":"러프에서 공주변을 개선하여 2벌타 (3점)\n\n그린위에서 퍼팅라인을 개선하여 2벌타(3점)\n\n3타에 컵인, 4벌타를 합산하여 총 7타이나 더블파(6타) 적용으로 총6타로\n\n기록한다. (4점)\n\n상황8. 1개조 4명이 모두 스코어카드를 기록하여 대회 주최 측에 제출하는 대회에서 대회 주최 측에서 스코어카드를 검증하는 과정에 1조의 동반자 3 명의 기록과 선수의 기록이 1번 홀에서 1타가 적게 기록되었고, 2조에서 는 2번홀에서 동반자 3명의 기록과 K선수의 기록이 1타가 많게 기록되어 있 는 것을 발견하였다. 심판으로써 어떻게 판정하여야 하는가?"},{"n":12,"q":"1조의 선수에 규칙 위반 이유와 판정을 기술하세요. (5점) 동반자의 기록보다 1타 적게 (실제 타수보다 적게) 기록하여 실격으로 처리 한다.","a":"원문 답안 구분이 명확하지 않아 원문 문제만 수록했습니다."},{"n":13,"q":"2조의 K선수에 규칙 위반 이유와 판정을 기술하세요. (5점)","a":"동반자의 기록보다 1타 많게(실제 타수보다) 기록하여 유효로 인정한다."}]}];let si=0,qi=0;const setsEl=document.getElementById('sets'),card=document.getElementById('card');
function renderSets(){setsEl.innerHTML=sets.map((s,i)=>'<button class="setbtn '+(i===si?'active':'')+'" onclick="pick('+i+')">'+s.name+' <small>('+s.items.length+'문제)</small></button>').join('')}
function pick(i){si=i;qi=0;renderSets();render()}
function render(){const s=sets[si],x=s.items[qi];card.innerHTML='<div class="meta">'+s.name+' · '+(qi+1)+' / '+s.items.length+' · 원문 '+x.n+'번</div><div class="q">'+esc(x.q)+'</div><div class="actions"><button onclick="toggle()">정답 확인</button><button class="list" onclick="window.scrollTo({top:0,behavior:\'smooth\'})">세트 선택</button></div><div id="ans" class="ans"><b>참고 답안</b><br>'+esc(x.a)+'</div><div class="move"><button '+(qi===0?'disabled':'')+' onclick="go(-1)">← 이전</button><button '+(qi===s.items.length-1?'disabled':'')+' onclick="go(1)">다음 →</button></div>'}
function esc(v){return String(v).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function toggle(){document.getElementById('ans').classList.toggle('show')}function go(d){qi+=d;render();window.scrollTo({top:document.getElementById('card').offsetTop-8,behavior:'smooth'})}renderSets();render();</script></body></html>
