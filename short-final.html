</main><script type="application/json" id="examData">[{"title":"기본지식형","desc":"역사·경기 원리·기본 구조","items":[["우리나라에서 최초로 파크골프장이 조성된 연도와 장소를 쓰시오.","2000년, 경상남도 진주시 판문동 상락원(종합사회복지관)","중"],["파크골프 9홀을 구성하는 파3·파4·파5의 홀 수를 각각 쓰고, 9홀의 기준타수를 계산하시오.","파3 4홀, 파4 4홀, 파5 1홀 / 기준타수 33타","중"],["파크골프 A·B·C·D코스에서 사용하는 깃발의 표준 색상을 순서대로 쓰시오.","A 적색, B 청색, C 황색, D 흰색","중"],["파크골프장을 구성하는 시설물과 설치물을 구분하여 각각 3가지씩 쓰시오.","시설물: 페어웨이, 러프, 그린 / 설치물: OB 말뚝, 안전망, 홀 표지판","상"],["스트로크 플레이의 최종 경기 성적을 구성하는 두 가지 타수 요소와 우승자 결정 원칙을 쓰시오.","실제 스트로크 수와 벌타를 합산합니다. 원칙적으로 총타수가 가장 적은 선수가 승리합니다(동타 시 대회요강에 따라 결정).","중"]]},{"title":"수치·규격형","desc":"용구와 코스의 수치 기준","items":[["파크골프 파3·파4·파5 홀의 표준 길이 범위를 각각 m 단위로 쓰시오.","파3 40~60m, 파4 60~100m, 파5 100~150m","중"],["성인용 파크골프 클럽의 최대 길이와 최대 무게를 각각 쓰시오.","길이 86cm 이하, 무게 600g 이하","중"],["파크골프 공의 기준 직경과 무게 범위를 각각 쓰시오.","직경 60mm(6cm), 무게 80~95g","중"],["파크골프 9홀과 18홀 코스의 표준 전체 길이 범위를 각각 쓰시오.","9홀 500~790m, 18홀 1,000~1,580m","상"],["표준 9홀 구성을 반복하는 파크골프장의 27홀과 36홀 기준타수 및 파5 홀 개수를 각각 계산하시오.","27홀: 99타·파5 3홀 / 36홀: 132타·파5 4홀","상"]]},{"title":"용어·개념형","desc":"규칙과 전문용어의 의미","items":[["언플레이어블(Unplayable)이란 무엇이며, 선언하여 구제받으면 몇 벌타인가?","공이 있으나 정상적인 스트로크가 어려워 플레이할 수 없음을 선언하는 것입니다. 규정에 따른 구제 시 2벌타입니다.","중"],["수리지(Ground Under Repair)란 무엇이며, 수리지 구제는 언제 적용되는가?","보수·보호가 필요해 지정한 구역입니다. 공이나 스탠스 일부가 수리지에 해당하면 규정에 따라 무벌타 구제를 받을 수 있습니다.","상"],["파크골프의 마크(Mark)와 마커(Marker)의 차이점을 설명하시오.","마크는 공의 위치를 표시하는 행위이며, 마커는 그 위치를 표시하는 도구입니다.","중"],["파크골프 대회의 샷건(Shotgun) 시작 방식이란 무엇인가?","여러 조가 미리 배정된 서로 다른 홀에서 동시에 경기를 시작하는 방식입니다.","중"],["로컬룰(Local Rule)의 뜻을 쓰고, 일반 경기규칙과의 관계를 설명하시오.","개별 코스·대회의 특성에 맞춰 사전 공지하는 보충 규칙입니다. 기본 경기규칙과의 관계는 해당 대회의 정당한 규정·허용 범위 안에서 정해야 합니다.","상"]]},{"title":"비교·구분형","desc":"유사한 경기 방식과 처치 기준 구별","items":[["스트로크 플레이와 매치 플레이의 승패 결정 방식을 비교하시오.","스트로크 플레이는 전체 타수의 합계로 결정하고, 매치 플레이는 각 홀의 승패를 누적해 결정합니다.","중"],["포섬과 포볼 방식은 사용하는 공의 수와 타격 방법에서 어떻게 다른가?","포섬: 한 팀 두 사람이 공 하나를 번갈아 칩니다. 포볼: 두 사람이 각자의 공을 치며, 각 홀에서 유리한 성적을 팀 성적으로 적용합니다.","상"],["OB와 분실구의 차이를 판정 기준 중심으로 설명하시오.","OB는 공이 경계선 밖으로 나간 경우, 분실구는 정해진 탐색시간(3분) 안에 공을 찾지 못한 경우입니다.","중"],["움직일 수 있는 장애물과 움직일 수 없는 장애물의 처리 방법을 비교하시오.","움직일 수 있는 장애물은 허용 범위에서 제거할 수 있으며, 제거 중 공이 움직이면 원위치합니다. 움직일 수 없는 장애물은 임의로 제거할 수 없고 해당 규정의 구제 여부에 따라 처리합니다.","상"],["'2클럽'과 '2클럽헤드'의 측정 기준과 적용 사례를 각각 쓰시오.","2클럽은 클럽 전체 길이의 2배로 OB·언플레이어블 등의 처치에 사용합니다. 2클럽헤드는 헤드 길이의 2배로 예비 홀컵 위 공과 방해되는 마커 처치 등에 사용합니다.","상"]]},{"title":"순서·절차형","desc":"기술 동작과 경기 처리 순서","items":[["파크골프 스윙의 6단계를 순서대로 쓰시오.","테이크백 → 백스윙 정점 → 다운스윙 → 임팩트 → 팔로스루 → 피니시","중"],["동반자의 마크 요청을 받은 경기자가 공을 들어 올린 뒤 다시 놓는 절차를 순서대로 쓰시오.","홀컵 방향을 보고 공 뒤에 마커 설치 → 공 집기 → 원래 위치에 공 놓기 → 마커 회수","상"],["샷한 공이 OB가 되었을 때 판정에서 다음 타격까지의 일반적인 처치 절차를 순서대로 쓰시오.","OB 여부 확인 → 공이 OB 경계선을 벗어난 지점 확인 → 해당 지점에서 깃대를 보고 수직으로 서서 좌우 2클럽 이내의 후방 반원 중 홀컵에 가깝지 않고 샷이 가능한 위치에 공 놓기 → 2벌타 반영 → 다음 샷","상"],["티샷 전에 지도자가 경기자에게 확인시킬 사항을 4단계 이상으로 정리하시오.","홀·거리·방향 확인 → 앞 조와 주변의 안전 확인 → 올바른 티업과 스탠스 점검 → 목표 방향 정렬 → 안전 확보 후 타격","중"],["스트로크 플레이에서 홀아웃한 뒤 스코어카드를 최종 제출하기까지의 순서를 쓰시오.","홀아웃 → 실제 타수·벌타 확인 → 홀별 타수 기록 → 전체 경기 종료 후 합계·누락 확인 → 필요한 서명·확인 → 제출","상"]]},{"title":"상황판단형","desc":"실제 상황에서 벌타와 구제 판단","items":[["경기자가 티샷을 하려고 준비 중 스윙 전에 공이 티에서 떨어졌다. 타수나 벌타가 발생하는가? 어떻게 조치하는가?","스트로크 전에 떨어졌다면 무타수·무벌타이며, 다시 티 위에 올려놓고 티샷합니다.","중"],["티샷을 하는 경기자의 발 일부가 티잉 그라운드 밖에 있었다. 정상적으로 타격한 경우 몇 벌타인가?","2벌타입니다. 티잉 구역을 벗어난 발로 스트로크하면 규정 위반입니다.","중"],["공이 장애물 가까이 있어 경기자가 클럽헤드가 아닌 그립 끝으로 공을 쳤다. 해당 타격의 실제 타수와 벌타는?","실제 타격 1타에 부정타 2벌타를 더합니다. 이 스트로크로 총 3타가 추가됩니다.","상"],["경기자의 공이 공식적으로 지정된 수리지 안에 멈췄다. 무벌타로 구제할 수 있는가? 어떻게 놓는가?","무벌타 구제를 받을 수 있습니다. 수리지 경계에서 좌우 가까운 쪽으로 옮겨 홀컵에 가깝지 않고 스탠스와 스트로크가 가능한 2클럽 이내의 허용 지점에 공을 놓습니다.","상"],["퍼팅한 공이 현재 사용하지 않는 예비 홀컵 위에 정지했다. 그대로 퍼팅하는가? 벌타와 이동 거리 기준을 쓰시오.","무벌타 구제 대상입니다. 홀컵에 더 가까워지지 않는 방향으로 클럽헤드 2개 길이 이내의 허용 위치에 옮겨서 플레이합니다.","상"]]},{"title":"계산·적용형","desc":"타수·벌타 및 백카운트","items":[["세 번째 샷이 OB가 되었다. 2벌타를 적용하면 다음 샷은 몇 타째인가?","6타째입니다. 3타(실제 샷) + 2벌타 = 누계 5타, 다음은 6타째입니다.","중"],["기준타수 66타인 18홀에서 A코스 31타, B코스 37타를 기록했다. 최종타수와 오버파·언더파를 쓰시오.","최종 68타, 2오버파입니다.","중"],["파5 홀에서 2타로, 파4 홀에서 2타로 홀아웃한 성적의 명칭을 각각 쓰시오.","파5 2타: 알바트로스 / 파4 2타: 이글","상"],["기준타수가 코스별 33타인 27홀에서 A코스 34타, B코스 32타, C코스 30타를 기록했다. 총타수와 기준타 대비 성적은?","총 96타, 3언더파입니다(기준 99타).","중"],["18홀에서 두 선수가 모두 64타이고 후반 9홀도 32타로 같다. 대회요강이 '총타수 → 후반 9홀 → 마지막 3홀'을 적용하고, 마지막 3홀 A 9타·B 8타라면 승자는?","B선수입니다. 주어진 대회요강의 다음 비교 단계인 마지막 3홀에서 B선수가 1타 적습니다.","상"]]},{"title":"지도·안전형","desc":"지도 및 안전 관리 능력","items":[["고령 초보자가 풀스윙 때 중심을 잃는다면 지도자가 우선 적용할 교정 방법 두 가지는?","안정된 스탠스와 균형을 확보하도록 하고, 스윙 크기·속도를 줄여 짧은 스윙부터 단계적으로 훈련합니다.","상"],["초보자가 임팩트 전에 머리를 들어 공을 정확하게 맞히지 못한다. 예상 문제와 지도법 두 가지를 쓰시오.","상체가 일찍 들려 미스샷이 발생합니다. 시선을 공에 두는 연습과 상체 자세를 유지하는 짧은 스윙 연습을 지도합니다.","중"],["앞 조가 타구 도달 범위에 있을 때 티샷하려는 경기자에게 지도자는 어떻게 조치해야 하는가?","티샷을 중지시키고 기다립니다. 앞 조가 충분한 안전거리 밖으로 이동한 것을 확인한 뒤 경기를 재개합니다.","중"],["경기 중 사람이 쓰러져 의식이 없고 정상 호흡도 하지 않는다. 기본 응급처치 순서를 쓰시오.","현장 안전과 반응 확인 → 119 신고 및 AED 요청 → 정상 호흡 확인 → 즉시 가슴압박을 포함한 심폐소생술 실시 → AED 도착 시 안내에 따라 사용하고 구조대에 인계","상"],["경기 도중 천둥과 번개가 발생했다. 지도자가 즉시 취해야 할 세 가지 조치는?","경기를 즉시 중단하고, 참가자를 안전한 건물·차량 등으로 대피시키며, 나무 아래·개활지·금속 용구 주변의 위험 장소를 피하도록 합니다.","상"]]}]</script><script>
const groups=JSON.parse(document.getElementById('examData').textContent);
const nav=document.getElementById('nav');
const container=document.getElementById('sections');
let number=0;
groups.forEach((group,groupIndex)=>{
  const jump=document.createElement('a');
  jump.href='#section-'+(groupIndex+1);
  jump.textContent=(groupIndex+1)+'. '+group.title;
  nav.appendChild(jump);
  const section=document.createElement('section');
  section.id='section-'+(groupIndex+1);
  section.className='group';
  const heading=document.createElement('h2');
  heading.textContent=(groupIndex+1)+'. '+group.title;
  section.appendChild(heading);
  const desc=document.createElement('p');
  desc.className='group-desc';
  desc.textContent=group.desc+' · 5문항';
  section.appendChild(desc);
  group.items.forEach(([question,answer,level])=>{
    number++;
    const card=document.createElement('article');
    card.className='question-card';
    const qhead=document.createElement('div');
    qhead.className='question-head';
    const no=document.createElement('span');
    no.className='number';
    no.textContent='문제 '+number;
    const lv=document.createElement('span');
    lv.className='level';
    lv.textContent='난이도 '+level;
    qhead.append(no,lv);
    const q=document.createElement('p');
    q.className='question';
    q.textContent=question;
    const details=document.createElement('details');
    details.className='answer';
    const summary=document.createElement('summary');
    summary.textContent='정답 확인';
    const answerText=document.createElement('p');
    answerText.textContent=answer;
    details.append(summary,answerText);
    details.addEventListener('toggle',refreshCount);
    card.append(qhead,q,details);
    section.appendChild(card);
  });
  container.appendChild(section);
});
function refreshCount(){
  document.getElementById('count').textContent=document.querySelectorAll('details.answer[open]').length+' / '+number;
}
document.getElementById('closeAll').addEventListener('click',()=>{
  document.querySelectorAll('details.answer[open]').forEach(node=>node.open=false);
  refreshCount();
});
refreshCount();
</script></body></html>
