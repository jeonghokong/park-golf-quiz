</main><script type="application/json" id="examData">[{"title":"기본지식형","desc":"역사·경기 원리·기본 구조","items":[["우리나라에서 최초로 파크골프장이 조성된 연도와 장소를 쓰시오.","2000년, 경상남도 진주시 판문동 상락원(종합사회복지관)","중"],["파크골프 9홀을 구성하는 파3·파4·파5의 홀 수를 각각 쓰고, 9홀의 기준타수를 계산하시오.","파3 4홀, 파4 4홀, 파5 1홀 / 기준타수 33타","중"],["파크골프 A·B·C·D코스에서 사용하는 깃발의 표준 색상을 순서대로 쓰시오.","A 적색, B 청색, C 황색, D 흰색","중"],["파크골프장을 구성하는 시설물과 설치물을 구분하여 각각 3가지씩 쓰시오.","시설물: 페어웨이, 러프, 그린 / 설치물: OB 말뚝, 안전망, 홀 표지판","상"],["파크골프에서 버디(Birdie), 이글(Eagle), 보기(Bogey), 더블보기(Double Bogey)는 기준타수와 비교해 각각 몇 타 차이를 의미하는가?","버디: 1타 적음(-1) / 이글: 2타 적음(-2) / 보기: 1타 많음(+1) / 더블보기: 2타 많음(+2)","중"]]},{"title":"수치·규격형","desc":"용구와 코스의 수치 기준","items":[["파크골프 파3·파4·파5 홀의 표준 길이 범위를 각각 m 단위로 쓰시오.","파3 40~60m, 파4 60~100m, 파5 100~150m","중"],["성인용 파크골프 클럽의 최대 길이와 최대 무게를 각각 쓰시오.","길이 86cm 이하, 무게 600g 이하","중"],["파크골프 공의 기준 직경과 무게 범위를 각각 쓰시오.","직경 60mm(6cm), 무게 80~95g","중"],["파크골프 9홀과 18홀 코스의 표준 전체 길이 범위를 각각 쓰시오.","9홀 500~790m, 18홀 1,000~1,580m","상"],["파크골프에서 사용하는 고무 티의 최대 허용 높이와 티잉 그라운드의 표준 크기 범위를 각각 쓰시오.","고무 티 높이: 2.3cm 이하 / 티잉 그라운드 크기: 1.5m × 1.5m ~ 2m × 2m","상"]]},{"title":"용어·개념형","desc":"규칙과 전문용어의 의미","items":[["파크골프에서 캐주얼워터(Casual Water)란 무엇이며, 공이나 스탠스 일부가 해당 구역에 걸친 경우 구제 시 벌타가 발생하는가?","캐주얼워터는 비 등으로 코스에 일시적으로 고인 물입니다. 동반자의 확인 등 규정상 절차에 따라 구제받으면 0벌타(무벌타)입니다.","중"],["파크골프 대회에서 서든데스(Sudden Death) 방식이란 무엇이며, 동타인 두 선수가 추가 홀 경기를 할 때 어떤 조건에서 승부가 결정되는가?","정규 경기 후 동타인 선수들이 대회요강에 정한 홀에서 추가 경기를 하는 순위 결정 방식입니다. 두 선수의 홀별 타수가 달라져 한 선수가 더 적은 타수를 기록하면 그 홀에서 승부가 결정됩니다. 구체적인 운영은 대회요강에 따릅니다.","상"],["파크골프의 마크(Mark)와 마커(Marker)의 차이점을 설명하시오.","마크는 공의 위치를 표시하는 행위이며, 마커는 그 위치를 표시하는 도구입니다.","중"],["파크골프 대회의 샷건(Shotgun) 시작 방식이란 무엇인가?","여러 조가 미리 배정된 서로 다른 홀에서 동시에 경기를 시작하는 방식입니다.","중"],["로컬룰(Local Rule)의 뜻을 쓰고, 일반 경기규칙과의 관계를 설명하시오.","개별 코스·대회의 특성에 맞춰 사전 공지하는 보충 규칙입니다. 기본 경기규칙과의 관계는 해당 대회의 정당한 규정·허용 범위 안에서 정해야 합니다.","상"]]},{"title":"비교·구분형","desc":"유사한 경기 방식과 처치 기준 구별","items":[["스트로크 플레이와 매치 플레이의 승패 결정 방식을 비교하시오.","스트로크 플레이는 전체 타수의 합계로 결정하고, 매치 플레이는 각 홀의 승패를 누적해 결정합니다.","중"],["포섬과 포볼 방식은 사용하는 공의 수와 타격 방법에서 어떻게 다른가?","포섬: 한 팀 두 사람이 공 하나를 번갈아 칩니다. 포볼: 두 사람이 각자의 공을 치며, 각 홀에서 유리한 성적을 팀 성적으로 적용합니다.","상"],["오른손잡이 경기자를 기준으로 오버래핑 그립과 인터로킹 그립의 차이를 양손 손가락의 결합 방법을 중심으로 비교하시오.","오버래핑 그립: 오른손 새끼손가락을 왼손 검지 위(또는 검지와 중지 사이)에 겹쳐 얹는다. 인터로킹 그립: 오른손 새끼손가락과 왼손 검지를 서로 깍지 끼듯 맞물리게 한다.","중"],["움직일 수 있는 장애물과 움직일 수 없는 장애물의 대표적인 종류를 각각 3가지씩 쓰고, 두 장애물의 처리 방법을 비교하시오.","① 움직일 수 있는 장애물: 낙엽, 작은 돌, 비닐봉지(또는 떨어진 나뭇가지 등). 경기에 방해되면 제거할 수 있으며, 제거 중 공이 움직인 경우 무벌타로 원래 위치에 놓는다.\n② 움직일 수 없는 장애물: OB 말뚝, 고정 안전망, 배수구(또는 고정된 스프링클러 등). 임의로 이동·훼손해서는 안 된다. 배수구 등 규정상 허용되는 경우에는 무벌타 구제가 가능하지만, 단순히 목표 방향에 고정 장애물이 있다는 이유만으로 공을 옮길 수는 없다.","상"],["'2클럽'과 '2클럽헤드'의 측정 기준과 적용 사례를 각각 쓰시오.","2클럽은 클럽 전체 길이의 2배로 OB·언플레이어블 등의 처치에 사용합니다. 2클럽헤드는 헤드 길이의 2배로 예비 홀컵 위 공과 방해되는 마커 처치 등에 사용합니다.","상"]]},{"title":"순서·절차형","desc":"기술 동작과 경기 처리 순서","items":[["파크골프 스윙의 6단계를 순서대로 쓰시오.","테이크백 → 백스윙 정점 → 다운스윙 → 임팩트 → 팔로스루 → 피니시","중"],["동반자의 마크 요청을 받은 경기자가 공을 들어 올린 뒤 다시 놓는 절차를 순서대로 쓰시오.","홀컵 방향을 보고 공 뒤에 마커 설치 → 공 집기 → 원래 위치에 공 놓기 → 마커 회수","상"],["샷한 공이 OB가 되었을 때 판정에서 다음 타격까지의 일반적인 처치 절차를 순서대로 쓰시오.","OB 여부 확인 → 공이 OB 경계선을 벗어난 지점 확인 → 해당 지점에서 깃대를 보고 수직으로 서서 좌우 2클럽 이내의 후방 반원 중 홀컵에 가깝지 않고 샷이 가능한 위치에 공 놓기 → 2벌타 반영 → 다음 샷","상"],["파크골프 경기에서 첫 홀과 두 번째 홀 이후의 티샷 순서를 정하는 방법을 설명하고, 직전 홀의 타수가 같은 경우 순서를 결정하는 절차를 쓰시오.","첫 홀: 순서 뽑기 또는 가위바위보 등으로 순서를 정합니다. 다음 홀부터: 직전 홀에서 가장 적은 타수를 기록한 경기자부터 순서대로 티샷합니다. 직전 홀에서 동타인 경우는 그 이전 홀의 타수를 거슬러 비교하여 순서를 정합니다(경기 시작 시까지 동타이면 최초에 정한 순서에 따름).","중"],["경기자가 깊은 러프에 친 공을 찾지 못했다. OB가 아닌 분실구인 경우, 공을 찾는 제한시간부터 다음 샷을 하기까지의 처리 절차와 벌타를 순서대로 쓰시오.","3분 이내 탐색 → 분실구로 처리 → 2벌타 부과 → 분실된 것으로 추정되는 지점에서 깃대를 바라보고 홀컵에 가깝지 않은 2클럽 이내의 허용된 지점에 예비공을 놓음 → 다음 샷 진행. 분실구 처리 후 예비공으로 스트로크하였다면 원래 공을 뒤늦게 찾아도 그 공으로 진행하지 않습니다.","상"]]},{"title":"상황판단형","desc":"실제 상황에서 벌타와 구제 판단","items":[["경기자가 티샷을 하려고 준비 중 스윙 전에 공이 티에서 떨어졌다. 타수나 벌타가 발생하는가? 어떻게 조치하는가?","스트로크 전에 떨어졌다면 무타수·무벌타이며, 다시 티 위에 올려놓고 티샷합니다.","중"],["경기자 B가 친 공이 이미 정지해 있던 동반자 A의 공에 충돌하였다. A의 공은 원래 자리에서 움직였고 B의 공은 충돌 후 페어웨이에 정지하였다. 두 공을 각각 어디에서 다음 샷을 해야 하며, 두 선수에게 벌타가 발생하는가?","A의 공: 충돌 전 원래 정지해 있던 위치로 되돌려 놓고 플레이합니다. B의 공: 충돌 후 최종 정지한 지점에서 플레이합니다. 누구에게도 벌타를 부과하지 않습니다(대한파크골프협회 경기규칙 제20-1조 제5항).","상"],["공이 장애물 가까이 있어 경기자가 클럽헤드가 아닌 그립 끝으로 공을 쳤다. 해당 타격의 실제 타수와 벌타는?","실제 타격 1타에 부정타 2벌타를 더합니다. 이 스트로크로 총 3타가 추가됩니다.","상"],["경기자의 공이 공식적으로 지정된 수리지 안에 멈췄다. 무벌타로 구제할 수 있는가? 어떻게 놓는가?","무벌타 구제를 받을 수 있습니다. 수리지 경계에서 좌우 가까운 쪽으로 옮겨 홀컵에 가깝지 않고 스탠스와 스트로크가 가능한 2클럽 이내의 허용 지점에 공을 놓습니다.","상"],["퍼팅한 공이 현재 사용하지 않는 예비 홀컵 위에 정지했다. 그대로 퍼팅하는가? 벌타와 이동 거리 기준을 쓰시오.","무벌타 구제 대상입니다. 홀컵에 더 가까워지지 않는 방향으로 클럽헤드 2개 길이 이내의 허용 위치에 옮겨서 플레이합니다.","상"]]},{"title":"계산·적용형","desc":"타수·벌타 및 백카운트","items":[["세 번째 샷이 OB가 되었다. 2벌타를 적용하면 다음 샷은 몇 타째인가?","6타째입니다. 3타(실제 샷) + 2벌타 = 누계 5타, 다음은 6타째입니다.","중"],["27홀 경기에서 A코스 실제 타격수 31타, B코스 32타, C코스 33타를 기록했다. A코스에서 OB 1회, C코스에서 언플레이어블 1회로 각각 2벌타가 발생했다. 실제 타격수에는 벌타가 포함되지 않았으며, 각 9홀의 기준타수는 33타이다. 최종 기록타수와 기준타수 대비 성적을 구하시오.","실제 타격수 31+32+33=96타, 벌타 (OB 2타)+(언플레이어블 2타)=4타. 최종 100타입니다. 27홀 기준타수는 33×3=99타이므로 1오버파(+1)입니다.","상"],["9홀 스코어카드에 벌타를 제외한 실제 홀별 타격수가 차례대로 [3, 4, 4, 3, 4, 4, 3, 4, 4]로 적혀 있고, 합계란에는 실수로 32타라고 적었다. 그런데 5번 홀에서 발생한 OB 2벌타도 누락됐다. 올바른 5번 홀 기록, 9홀 총타수, 합계란의 수정 증가분을 각각 구하시오.","5번 홀은 실제 4타에 OB 2벌타를 더해 6타입니다. 홀별 실제 타격수 합은 33타이고 여기에 2벌타를 더하면 9홀 총타수는 35타입니다. 합계란의 기존 32타보다 3타 늘려 정정해야 합니다.","상"],["2인 1팀 포볼 경기에서 각 홀은 팀원 두 명 중 적은 타수를 팀 성적으로 사용한다. 6홀 기록이 갑팀 A선수 [3,4,5,4,3,4]타, B선수 [4,3,4,5,4,3]타이고, 을팀 C선수 [4,4,3,4,4,4]타, D선수 [3,4,4,4,3,5]타이다. 갑팀과 을팀의 6홀 합계 및 승리 팀을 구하시오.","갑팀 홀별 최저타수는 [3,3,4,4,3,3]으로 합계 20타입니다. 을팀은 [3,4,3,4,3,4]로 합계 21타입니다. 따라서 갑팀이 1타 차로 승리합니다.","상"],["18홀에서 A·B 두 선수의 총타수가 모두 64타다. 대회요강의 동타 순위 결정은 '총타수 → 후반 9홀 합계 → 후반 코스 마지막 3홀 합계' 순서다. 후반 코스 1~9번 홀의 타수는 A선수 [4,4,3,3,3,3,3,4,3], B선수 [4,4,4,3,3,3,3,3,3]이다. 각 선수의 후반 9홀과 마지막 3홀 합계를 계산하고 승자를 결정하시오.","A·B 모두 후반 9홀은 30타로 동타입니다. 마지막 3홀(7~9번)은 A선수 3+4+3=10타, B선수 3+3+3=9타입니다. 따라서 정해진 백카운트 기준에 따라 B선수가 승리합니다.","상"]]},{"title":"지도·안전형","desc":"지도 및 안전 관리 능력","items":[["고령 초보자가 풀스윙 때 중심을 잃는다면 지도자가 우선 적용할 교정 방법 두 가지는?","안정된 스탠스와 균형을 확보하도록 하고, 스윙 크기·속도를 줄여 짧은 스윙부터 단계적으로 훈련합니다.","상"],["초보자가 임팩트 전에 머리를 들어 공을 정확하게 맞히지 못한다. 예상 문제와 지도법 두 가지를 쓰시오.","상체가 일찍 들려 미스샷이 발생합니다. 시선을 공에 두는 연습과 상체 자세를 유지하는 짧은 스윙 연습을 지도합니다.","중"],["앞 조가 타구 도달 범위에 있을 때 티샷하려는 경기자에게 지도자는 어떻게 조치해야 하는가?","티샷을 중지시키고 기다립니다. 앞 조가 충분한 안전거리 밖으로 이동한 것을 확인한 뒤 경기를 재개합니다.","중"],["경기 중 사람이 쓰러져 의식이 없고 정상 호흡도 하지 않는다. 기본 응급처치 순서를 쓰시오.","현장 안전과 반응 확인 → 119 신고 및 AED 요청 → 정상 호흡 확인 → 즉시 가슴압박을 포함한 심폐소생술 실시 → AED 도착 시 안내에 따라 사용하고 구조대에 인계","상"],["경기 도중 천둥과 번개가 발생했다. 지도자가 즉시 취해야 할 세 가지 조치는?","경기를 즉시 중단하고, 참가자를 안전한 건물·차량 등으로 대피시키며, 나무 아래·개활지·금속 용구 주변의 위험 장소를 피하도록 합니다.","상"]]}]</script><script>
const groups=JSON.parse(document.getElementById('examData').textContent);
const nav=document.getElementById('nav');
const container=document.getElementById('sections');
let number=0;
groups.forEach((group,groupIndex)=>{
  const jump=document.createElement('a');
  jump.href='#section-'+(groupIndex+1);
  jump.textContent=(groupIndex+1)+'. '+group.title;
  nav.appendChild(jump);
  const section=document.createElement('section');
  section.id='section-'+(groupIndex+1);
  section.className='group';
  const heading=document.createElement('h2');
  heading.textContent=(groupIndex+1)+'. '+group.title;
  section.appendChild(heading);
  const desc=document.createElement('p');
  desc.className='group-desc';
  desc.textContent=group.desc+' · 5문항';
  section.appendChild(desc);
  group.items.forEach(([question,answer,level])=>{
    number++;
    const card=document.createElement('article');
    card.className='question-card';
    const qhead=document.createElement('div');
    qhead.className='question-head';
    const no=document.createElement('span');
    no.className='number';
    no.textContent='문제 '+number;
    const lv=document.createElement('span');
    lv.className='level';
    lv.textContent='난이도 '+level;
    qhead.append(no,lv);
    const q=document.createElement('p');
    q.className='question';
    q.textContent=question;
    const details=document.createElement('details');
    details.className='answer';
    const summary=document.createElement('summary');
    summary.textContent='정답 확인';
    const answerText=document.createElement('p');
    answerText.textContent=answer;
    details.append(summary,answerText);
    details.addEventListener('toggle',refreshCount);
    card.append(qhead,q,details);
    section.appendChild(card);
  });
  container.appendChild(section);
});
function refreshCount(){
  document.getElementById('count').textContent=document.querySelectorAll('details.answer[open]').length+' / '+number;
}
document.getElementById('closeAll').addEventListener('click',()=>{
  document.querySelectorAll('details.answer[open]').forEach(node=>node.open=false);
  refreshCount();
});
refreshCount();
</script></body></html>
