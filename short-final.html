<p class="foot">이 자료는 학습용 자체 제작 예상문제이며 실제 시험의 공식 기출문제·정답표가 아닙니다. 경기규칙 문제는 최신 시험 교재 및 적용 규정을 우선하여 확인하세요.</p>

</main><script type="application/json" id="examData">[{"title":"기본지식형","desc":"역사·경기 원리·기본 구조","items":[["우리나라에서 최초로 파크골프장이 조성된 연도와 장소를 쓰시오.","2000년, 경상남도 진주시 판문동 상락원(종합사회복지관)","중"],["파크골프 9홀을 구성하는 파3·파4·파5의 홀 수를 각각 쓰고, 9홀의 기준타수를 계산하시오.","파3 4홀, 파4 4홀, 파5 1홀 / 기준타수 33타","중"],["파크골프 A·B·C·D코스에서 사용하는 깃발의 표준 색상을 순서대로 쓰시오.","A 적색, B 청색, C 황색, D 흰색","중"],["파크골프장을 구성하는 시설물과 설치물을 구분하여 각각 3가지씩 쓰시오.","시설물: 페어웨이, 러프, 그린 / 설치물: OB 말뚝, 안전망, 홀 표지판","상"],["파크골프에서 버디(Birdie), 이글(Eagle), 보기(Bogey), 더블보기(Double Bogey)는 기준타수와 비교해 각각 몇 타 차이를 의미하는가?","버디: 1타 적음(-1) / 이글: 2타 적음(-2) / 보기: 1타 많음(+1) / 더블보기: 2타 많음(+2)","중"]]},{"title":"수치·규격형","desc":"용구와 코스의 수치 기준","items":[["파크골프 파3·파4·파5 홀의 표준 길이 범위를 각각 m 단위로 쓰시오.","파3 40~60m, 파4 60~100m, 파5 100~150m","중"],["성인용 파크골프 클럽의 최대 길이와 최대 무게를 각각 쓰시오.","길이 86cm 이하, 무게 600g 이하","중"],["파크골프 공의 기준 직경과 무게 범위를 각각 쓰시오.","직경 60mm(6cm), 무게 80~95g","중"],["파크골프 9홀과 18홀 코스의 표준 전체 길이 범위를 각각 쓰시오.","9홀 500~790m, 18홀 1,000~1,580m","상"],["파크골프에서 사용하는 고무 티의 최대 허용 높이와 티잉 그라운드의 표준 크기 범위를 각각 쓰시오.","고무 티 높이: 2.3cm 이하 / 티잉 그라운드 크기: 1.5m × 1.5m ~ 2m × 2m","상"]]},{"title":"용어·개념형","desc":"규칙과 전문용어의 의미","items":[["파크골프에서 캐주얼워터(Casual Water)란 무엇이며, 공이나 스탠스 일부가 해당 구역에 걸친 경우 구제 시 벌타가 발생하는가?","캐주얼워터는 비 등으로 코스에 일시적으로 고인 물입니다. 동반자의 확인 등 규정상 절차에 따라 구제받으면 0벌타(무벌타)입니다.","중"],["파크골프 대회에서 서든데스(Sudden Death) 방식이란 무엇이며, 동타인 두 선수가 추가 홀 경기를 할 때 어떤 조건에서 승부가 결정되는가?","정규 경기 후 동타인 선수들이 대회요강에 정한 홀에서 추가 경기를 하는 순위 결정 방식입니다. 두 선수의 홀별 타수가 달라져 한 선수가 더 적은 타수를 기록하면 그 홀에서 승부가 결정됩니다. 구체적인 운영은 대회요강에 따릅니다.","상"],["파크골프의 마크(Mark)와 마커(Marker)의 차이점을 설명하시오.","마크는 공의 위치를 표시하는 행위이며, 마커는 그 위치를 표시하는 도구입니다.","중"],["파크골프 대회의 샷건(Shotgun) 시작 방식이란 무엇인가?","여러 조가 미리 배정된 서로 다른 홀에서 동시에 경기를 시작하는 방식입니다.","중"],["로컬룰(Local Rule)의 뜻을 쓰고, 일반 경기규칙과의 관계를 설명하시오.","개별 코스·대회의 특성에 맞춰 사전 공지하는 보충 규칙입니다. 기본 경기규칙과의 관계는 해당 대회의 정당한 규정·허용 범위 안에서 정해야 합니다.","상"]]},{"title":"비교·구분형","desc":"유사한 경기 방식과 처치 기준 구별","items":[["스트로크 플레이와 매치 플레이의 승패 결정 방식을 비교하시오.","스트로크 플레이는 전체 타수의 합계로 결정하고, 매치 플레이는 각 홀의 승패를 누적해 결정합니다.","중"],["오른손잡이 경기자를 기준으로 티샷, 페어웨이 샷, 퍼팅을 할 때 공의 위치가 어떻게 달라지는지 각각 쓰시오.","티샷은 왼발 발꿈치 안쪽 부근, 페어웨이 샷은 양발 중앙 또는 중앙보다 약간 목표 방향 쪽에 둔다. 퍼팅은 공이 왼쪽 눈 아래 또는 목표 방향 쪽에 오도록 두며 공의 상태와 거리에 따라 조금씩 조정한다.","상"],["오른손잡이 경기자를 기준으로 오버래핑 그립과 인터로킹 그립의 차이를 양손 손가락의 결합 방법을 중심으로 비교하시오.","오버래핑 그립: 오른손 새끼손가락을 왼손 검지 위(또는 검지와 중지 사이)에 겹쳐 얹는다. 인터로킹 그립: 오른손 새끼손가락과 왼손 검지를 서로 깍지 끼듯 맞물리게 한다.","중"],["움직일 수 있는 장애물과 움직일 수 없는 장애물의 대표적인 종류를 각각 3가지씩 쓰고, 두 장애물의 처리 방법을 비교하시오.","① 움직일 수 있는 장애물: 낙엽, 작은 돌, 비닐봉지(또는 떨어진 나뭇가지 등). 경기에 방해되면 제거할 수 있으며, 제거 중 공이 움직인 경우 무벌타로 원래 위치에 놓는다.\n② 움직일 수 없는 장애물: OB 말뚝, 고정 안전망, 배수구(또는 고정된 스프링클러 등). 임의로 이동·훼손해서는 안 된다. 배수구 등 규정상 허용되는 경우에는 무벌타 구제가 가능하지만, 단순히 목표 방향에 고정 장애물이 있다는 이유만으로 공을 옮길 수는 없다.","상"],["'2클럽'과 '2클럽헤드'의 측정 기준과 적용 사례를 각각 쓰시오.","2클럽은 클럽 전체 길이의 2배로 OB·언플레이어블 등의 처치에 사용합니다. 2클럽헤드는 헤드 길이의 2배로 예비 홀컵 위 공과 방해되는 마커 처치 등에 사용합니다.","상"]]},{"title":"순서·절차형","desc":"기술 동작과 경기 처리 순서","items":[["파크골프 스윙의 6단계를 순서대로 쓰시오.","테이크백 → 백스윙 정점 → 다운스윙 → 임팩트 → 팔로스루 → 피니시","중"],["동반자의 마크 요청을 받은 경기자가 공을 들어 올린 뒤 다시 놓는 절차를 순서대로 쓰시오.","홀컵 방향을 보고 공 뒤에 마커 설치 → 공 집기 → 원래 위치에 공 놓기 → 마커 회수","상"],["샷한 공이 OB가 되었을 때 판정에서 다음 타격까지의 일반적인 처치 절차를 순서대로 쓰시오.","OB 여부 확인 → 공이 OB 경계선을 벗어난 지점 확인 → 해당 지점에서 깃대를 보고 수직으로 서서 좌우 2클럽 이내의 후방 반원 중 홀컵에 가깝지 않고 샷이 가능한 위치에 공 놓기 → 2벌타 반영 → 다음 샷","상"],["파크골프 경기에서 첫 홀과 두 번째 홀 이후의 티샷 순서를 정하는 방법을 설명하고, 직전 홀의 타수가 같은 경우 순서를 결정하는 절차를 쓰시오.","첫 홀: 순서 뽑기 또는 가위바위보 등으로 순서를 정합니다. 다음 홀부터: 직전 홀에서 가장 적은 타수를 기록한 경기자부터 순서대로 티샷합니다. 직전 홀에서 동타인 경우는 그 이전 홀의 타수를 거슬러 비교하여 순서를 정합니다(경기 시작 시까지 동타이면 최초에 정한 순서에 따름).","중"],["경기자가 깊은 러프에 친 공을 찾지 못했다. OB가 아닌 분실구인 경우, 공을 찾는 제한시간부터 다음 샷을 하기까지의 처리 절차와 벌타를 순서대로 쓰시오.","3분 이내 탐색 → 분실구로 처리 → 2벌타 부과 → 분실된 것으로 추정되는 지점에서 깃대를 바라보고 홀컵에 가깝지 않은 2클럽 이내의 허용된 지점에 예비공을 놓음 → 다음 샷 진행. 분실구 처리 후 예비공으로 스트로크하였다면 원래 공을 뒤늦게 찾아도 그 공으로 진행하지 않습니다.","상"]]},{"title":"상황판단형","desc":"실제 상황에서 벌타와 구제 판단","items":[["경기자가 티샷을 하려고 준비 중 스윙 전에 공이 티에서 떨어졌다. 타수나 벌타가 발생하는가? 어떻게 조치하는가?","스트로크 전에 떨어졌다면 무타수·무벌타이며, 다시 티 위에 올려놓고 티샷합니다.","중"],["OB 경계선 부근의 경사진 곳에서 경기자가 어드레스한 뒤 클럽헤드가 공에 접촉했고, 그 공이 OB 경계선을 넘어갔다. 해당 행위의 타수와 벌타 및 이후 처리 방법을 쓰시오.","클럽헤드가 공에 접촉했으므로 스트로크 1타로 계산한다. 공은 OB가 된 것으로 처리하여 2벌타를 적용하고, 규정된 OB 처치 지점에 공을 놓은 뒤 다음 샷을 한다.","상"],["공이 장애물 가까이 있어 경기자가 클럽헤드가 아닌 그립 끝으로 공을 쳤다. 해당 타격의 실제 타수와 벌타는?","실제 타격 1타에 부정타 2벌타를 더합니다. 이 스트로크로 총 3타가 추가됩니다.","상"],["경기자의 공이 공식적으로 지정된 수리지 안에 멈췄다. 무벌타로 구제할 수 있는가? 어떻게 놓는가?","무벌타 구제를 받을 수 있습니다. 수리지 경계에서 좌우 가까운 쪽으로 옮겨 홀컵에 가깝지 않고 스탠스와 스트로크가 가능한 2클럽 이내의 허용 지점에 공을 놓습니다.","상"],["퍼팅한 공이 현재 사용하지 않는 예비 홀컵 위에 정지했다. 그대로 퍼팅하는가? 벌타와 이동 거리 기준을 쓰시오.","무벌타 구제 대상입니다. 홀컵에 더 가까워지지 않는 방향으로 클럽헤드 2개 길이 이내의 허용 위치에 옮겨서 플레이합니다.","상"]]},{"title":"계산·적용형","desc":"타수·벌타 및 백카운트","items":[["세 번째 샷이 OB가 되었다. 2벌타를 적용하면 다음 샷은 몇 타째인가?","6타째입니다. 3타(실제 샷) + 2벌타 = 누계 5타, 다음은 6타째입니다.","중"],["파5 홀에서 티샷 후 세컨드 샷이 OB가 되어 처치하였다. 이후 어프로치 샷 두 번으로 그린에 올리고, 세 번의 퍼팅 끝에 컵인하였다. 실제 스트로크와 벌타를 구분하여 총 기록타수를 계산하시오.","티샷 1타 + 세컨드 샷 1타 + OB 2벌타 + 어프로치 샷 2타 + 퍼팅 3타 = 총 9타.","상"],["경기자가 1번 홀부터 4번 홀까지 경기한 다음, 실수로 8번 홀과 9번 홀을 연속하여 홀아웃하였다. 이후 잘못을 확인하고 원래 순서인 5번 홀로 돌아왔다. 잘못 경기한 홀에 대해 조원 모두에게 추가되는 벌타는 몇 타인지 계산하시오.","잘못 경기한 홀은 8번과 9번의 2개 홀이다. 잘못 경기한 홀마다 2벌타를 적용하므로 조원 모두에게 총 4벌타를 추가한다.","상"],["더블파 적용이 공지된 대회에서 경기자가 파4 홀의 티샷을 그린에 올렸다. 이후 퍼팅한 공이 홀컵 10cm 지점에 정지했지만 컵인하지 않고 공을 집어 다음 홀에서 티샷하였다. 해당 홀의 기록타수와, 더블파 로컬룰이 없는 경우의 처리를 쓰시오.","더블파가 적용된 파4 홀이므로 해당 홀은 8타로 기록한다. 더블파 로컬룰이 공지되지 않은 경기라면 홀아웃하지 않고 다음 홀에서 티샷했으므로 해당 홀 실격 대상이다.","상"],["경기자 A가 세컨드 샷을 하여 정지해 있던 경기자 B의 공과 충돌했고, 충돌 후 두 공 모두 OB가 되었다. A와 B의 공을 각각 어떻게 처리하며 벌타는 누구에게 적용되는지 쓰시오.","A의 공은 최종적으로 OB가 되었으므로 OB 처치를 하고 2벌타를 적용한다. B의 공은 충돌 전 원래 위치로 되돌려 놓으며 B에게는 벌타가 없다. 필요한 경우 A 또는 다른 동반자가 B의 공을 원위치할 수 있다.","상"]]},{"title":"지도·안전형","desc":"지도 및 안전 관리 능력","items":[["지도자로서 초보자에게 파크골프의 스탠스 3가지를 설명하려고 한다. 스탠스의 명칭과 양발의 위치 관계를 각각 쓰시오.","스퀘어 스탠스: 양발 끝을 이은 선이 목표선과 평행하도록 선다.\n오픈 스탠스: 목표 방향 쪽 앞발을 뒤로 빼 몸을 목표 쪽으로 연다.\n클로즈드 스탠스: 뒤쪽 발을 뒤로 빼 몸을 목표 반대쪽으로 닫는다.","상"],["초보자가 임팩트 전에 머리를 들어 공을 정확하게 맞히지 못한다. 예상 문제와 지도법 두 가지를 쓰시오.","상체가 일찍 들려 미스샷이 발생합니다. 시선을 공에 두는 연습과 상체 자세를 유지하는 짧은 스윙 연습을 지도합니다.","중"],["파크골프 경기 도중 경기자가 지켜야 할 안전수칙을 3가지 이상 쓰시오.","다음 중 3가지 이상을 쓰면 정답으로 인정한다.\n\n- 동반자가 샷할 때 안전거리와 안전한 각도를 유지한다.\n- 목표 방향 앞에 사람이 있으면 샷하지 않는다.\n- 공이 다른 사람 쪽으로 날아가면 큰소리로 즉시 경고한다.\n- 경기 전 충분히 준비운동을 한다.\n- 경기 중 코스에서 연습스윙으로 공을 치지 않는다.\n- 공이 사람에게 맞으면 경기를 중단하고 부상 여부를 확인한다.\n- 앞 조가 안전거리 밖으로 이동한 후 샷한다.","중"],["경기 중 사람이 쓰러져 의식이 없고 정상 호흡도 하지 않는다. 기본 응급처치 순서를 쓰시오.","현장 안전과 반응 확인 → 119 신고 및 AED 요청 → 정상 호흡 확인 → 즉시 가슴압박을 포함한 심폐소생술 실시 → AED 도착 시 안내에 따라 사용하고 구조대에 인계","상"],["파크골프 코스 안에서 지켜야 할 에티켓과 매너를 4가지 이상 쓰시오.","다음 중 4가지 이상을 쓰면 정답으로 인정한다.\n\n- 다른 경기자가 샷할 때 조용히 한다.\n- 동반자의 퍼팅 라인을 밟지 않는다.\n- 퍼팅 중 움직이거나 그림자를 만들지 않는다.\n- 코스 안에서 흡연·음주·도박을 하지 않는다.\n- 코스를 훼손하지 않고 쓰레기를 버리지 않는다.\n- 앞 조와 적절한 간격을 유지하며 신속하게 경기한다.\n- 조원 모두가 홀아웃한 뒤 다음 홀로 이동한다.\n- 스코어는 그린을 벗어난 뒤 확인하고 기록한다.","중"]]}]</script><script>
const groups=JSON.parse(document.getElementById('examData').textContent);
const nav=document.getElementById('nav');
const container=document.getElementById('sections');
let number=0;
groups.forEach((group,groupIndex)=>{
  const jump=document.createElement('a');
  jump.href='#section-'+(groupIndex+1);
  jump.textContent=(groupIndex+1)+'. '+group.title;
  nav.appendChild(jump);
  const section=document.createElement('section');
  section.id='section-'+(groupIndex+1);
  section.className='group';
  const heading=document.createElement('h2');
  heading.textContent=(groupIndex+1)+'. '+group.title;
  section.appendChild(heading);
  const desc=document.createElement('p');
  desc.className='group-desc';
  desc.textContent=group.desc+' · 5문항';
  section.appendChild(desc);
  group.items.forEach(([question,answer,level])=>{
    number++;
    const card=document.createElement('article');
    card.className='question-card';
    const qhead=document.createElement('div');
    qhead.className='question-head';
    const no=document.createElement('span');
    no.className='number';
    no.textContent='문제 '+number;
    const lv=document.createElement('span');
    lv.className='level';
    lv.textContent='난이도 '+level;
    qhead.append(no,lv);
    const q=document.createElement('p');
    q.className='question';
    q.textContent=question;
    const details=document.createElement('details');
    details.className='answer';
    const summary=document.createElement('summary');
    summary.textContent='정답 확인';
    const answerText=document.createElement('p');
    answerText.textContent=answer;
    details.append(summary,answerText);
    details.addEventListener('toggle',refreshCount);
    card.append(qhead,q,details);
    section.appendChild(card);
  });
  container.appendChild(section);
});
function refreshCount(){
  document.getElementById('count').textContent=document.querySelectorAll('details.answer[open]').length+' / '+number;
}
document.getElementById('closeAll').addEventListener('click',()=>{
  document.querySelectorAll('details.answer[open]').forEach(node=>node.open=false);
  refreshCount();
});
refreshCount();
</script></body></html>
