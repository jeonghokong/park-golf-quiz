<title>참고 : 심판용 · 파크골프 심판 실전 100문제</title>
<style>
:root{--g:#176b43;--gl:#eef7f2;--line:#dce5df;--t:#17211b;--m:#6b766f;--gold:#9b7416}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#f5f7f6;color:var(--t)}
.wrap{max-width:720px;margin:auto;padding:8px 12px 28px}.head{text-align:center;padding:8px 0 10px}.head h1{font-size:21px;margin:0 0 4px}.head p{margin:0;color:var(--m);font-size:13px}
.nav{display:flex;gap:7px;margin-bottom:10px}.nav button,.nav a{flex:1;text-align:center;text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--g);padding:9px 7px;border-radius:11px;font-size:13px;font-weight:800}
.nav button.active{background:var(--gl);border-color:#b8d8c7}.qcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 3px 14px #0000000a;min-height:360px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--m);font-size:13px;margin-bottom:16px}.topMove{display:flex;align-items:center;gap:5px}.topMove button{border:1px solid var(--line);background:#fff;color:var(--g);border-radius:8px;padding:6px 9px;font-weight:800;font-size:12px}.topMove button:disabled{opacity:.35}.num{color:var(--g);font-weight:850}.q{font-size:19px;line-height:1.55;font-weight:760;white-space:pre-line;min-height:135px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.actions button{border:0;border-radius:11px;min-height:48px;font-size:15px;font-weight:800}.answerBtn{background:var(--g);color:#fff}.saveBtn{background:#fff7dc;color:var(--gold);border:1px solid #ead58b!important}.saveBtn.saved{background:#fff0b8}.ans{display:none;margin-top:13px;padding:14px;background:var(--gl);border-radius:12px;line-height:1.6;font-size:14px;white-space:pre-line}.ans.show{display:block}.ans b{color:var(--g)}
.move{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.move button{border:1px solid var(--line);background:#fff;color:var(--g);border-radius:11px;min-height:46px;font-weight:800;font-size:14px}.move button:disabled{opacity:.35}
.savedList{display:grid;gap:8px}.savedItem{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left}.savedItem b{color:var(--g);margin-right:7px}.empty{text-align:center;color:var(--m);padding:55px 10px}.note{text-align:center;color:var(--m);font-size:11px;margin:13px 0}@media(max-width:480px){.wrap{padding:5px 9px 20px}.head{padding:4px 0 7px}.qcard{padding:15px;min-height:330px}.q{font-size:18px;min-height:120px}.nav button,.nav a{padding:8px 5px}}
</style></head><body><main class="wrap"><header class="head"><h1>참고 : 심판용</h1><p>3급 심판 실전 연습문제 100 · 주관식 자율학습</p></header>
<nav class="nav"><a href="./">← 회차 목록</a><button id="allTab" class="active" onclick="showAll()">전체 문제</button><button id="savedTab" onclick="showSaved()">저장 문제 <span id="savedCount"></span></button></nav>
<section id="app"></section><p class="note">정답은 대한파크골프협회 표준교재·자격검정 문제집·경기규칙을 우선하고, 제공된 심판시험 대비 자료를 참고하여 정리했습니다.</p></main>
<script>
const data=[
["파크골프 심판의 역할에 대해 설명하시오.","경기규칙을 정확히 적용하여 공정하고 원활하게 경기가 진행되도록 판정하고 경기 운영을 관리한다.","규칙 적용 · 공정성 · 원활한 경기 진행"],
["파크골프 심판의 주요 임무를 간략히 서술하시오.","경기 진행 관리, 경기규칙 적용과 판정, 벌타 적용, 타수·기록 확인 등이다.","진행 → 판정 → 벌타 → 기록"],
["심판은 판정에 자신이 없을 경우 어떻게 해야 하는가?","사실관계를 다시 확인하고, 필요하면 다른 심판 또는 책임심판과 협의하여 규칙에 따라 판정한다.","추측으로 판정하지 않는다."],
["심판이 경기에서 판정할 때 반드시 지켜야 할 세 가지 원칙을 쓰시오.","공정성, 정확성, 일관성.","공 · 정 · 일"],
["심판이 경기 중 선수의 원활한 경기 진행을 위해 가장 우선적으로 확인해야 할 사항은 무엇인가?","판정에 앞서 발생한 상황과 사실관계를 정확하게 확인한다.","사실확인이 먼저다."],
["경기 중 판정에 대한 시비가 발생했을 때 심판은 어떠한 자세를 가져야 하는가?","감정적으로 대응하지 않고 중립적인 자세로 사실관계와 경기규칙에 따라 판정한다.","중립 · 사실 · 규칙"],
["심판이 경기 중 판정과 경기 운영을 위해 극복해야 할 감정 세 가지는 무엇인가?","긴장, 분노, 두려움 등의 감정을 스스로 통제해야 한다.","감정에 흔들리지 않는 판정"],
["심판의 권한과 의무에 대하여 설명하시오.","경기규칙에 따라 판정하고 경기를 관리하며, 필요한 조치를 취할 권한과 의무가 있다.","규칙에 근거한 판정과 경기 관리"],
["심판은 경기규칙에 명확하게 언급되지 않은 사항에 대해서도 판정을 내려야 하는가?","그렇다. 사실관계를 확인하고 경기규칙의 취지와 경기 운영 원칙에 따라 필요한 판정을 한다.","명문 규정이 없다고 판정을 회피하지 않는다."],
["심판의 권한을 침해할 수 없는 사람은 누구인가?","선수와 경기 관계자 등 경기 참가자는 심판의 정당한 권한을 침해해서는 안 된다.","정당한 심판 권한 존중"],
["심판에게는 어떤 권한과 의무가 있는가?","경기규칙 적용, 경기 진행 관리, 판정 및 필요한 조치를 취할 권한과 의무가 있다.","규칙 적용 · 진행 · 판정 · 조치"],
["파크골프 심판이 갖추어야 할 주요 의무를 4가지로 나누어 서술하시오.","① 경기규칙과 실무를 계속 학습한다. ② 맡은 심판업무를 성실히 수행한다. ③ 품위와 올바른 언행을 유지한다. ④ 위원회의 결정 및 위임사항을 준수한다.","학습 · 성실 · 품위 · 준수"],
["파크골프 심판의 연수교육과 보수교육의 정의를 각각 설명하시오.","연수교육은 심판 자격과 실무능력을 습득하기 위한 교육이며, 보수교육은 자격 취득 후 자질과 판정능력을 유지·향상하기 위한 교육이다.","연수=습득, 보수=유지·향상"],
["파크골프 심판이 판정할 때 유의해야 할 사항을 4가지 서술하시오.","정확한 판정, 정확한 타수 확인, 공정성 유지, 경기자의 신뢰를 얻을 수 있는 일관된 경기 운영에 유의한다.","정확 · 타수 · 공정 · 신뢰"],
["파크골프 심판이 자질을 향상시키기 위해 노력해야 할 사항을 4가지 서술하시오.","경기규칙 학습, 우수 판정사례 연구, 현장경험 축적, 지속적인 교육·훈련이 필요하다.","학습 · 사례 · 경험 · 교육"],
["파크골프에서 구제지역의 처치 기준을 각각 서술하시오.","OB·언플레이어블·분실구 등은 각각의 규칙에 따라 2벌타와 정해진 처치를 적용한다. 수리지·캐주얼워터·배수구·스프링클러·예비 홀컵 위 또는 걸친 공은 규칙에 따라 무벌타 구제를 받을 수 있다.","구제 종류마다 벌타 유무와 처치가 다르다."],
["경기 중 공이 충돌했을 때의 벌타 및 처치 기준을 서술하시오.","먼저 움직이는 공인지 정지된 공인지, 누구의 공과 충돌했는지를 확인한다. 정지한 동반자의 공이 스트로크한 공에 맞아 움직이면 그 공은 원위치하고, 스트로크한 공은 최종 정지 위치에서 규칙에 따라 경기한다. 앞 선수의 공이 움직이는 중 다음 선수가 스트로크해 충돌하면 다음 선수에게 2벌타가 적용된다.","충돌은 '움직이는 공/정지된 공'을 먼저 구분한다."],
["멈추어 있는 동반자의 공과 충돌했을 때의 처리방법을 서술하시오.","정지해 있던 동반자의 공이 다른 경기자의 스트로크한 공에 맞아 움직이면 동반자의 공은 벌타 없이 원위치한다. 스트로크한 공은 최종 정지한 위치에서 규칙에 따라 경기한다.","정지된 동반자 공은 원위치"],
["경기 중 공을 마크하는 방법과 유의사항을 서술하시오.","마크 요구를 받은 경우 볼마커를 공 뒤에 놓고 공을 집어 올린다. 마커를 이동했다면 원래 위치로 되돌린 후 공을 정확히 원위치한다. 티샷에는 마크 요구를 할 수 없고 세컨드 샷부터 20m 이내의 공에 대해 요구할 수 있다.","공 뒤에 마크 · 세컨드부터 20m 이내"],
["파크골프 경기에서 움직일 수 없는 장애물과 관련된 벌타 및 구제 기준을 서술하시오.","장애물 안·위 또는 근접하여 스탠스나 스트로크에 방해가 되는지를 판단한다. 수리지·캐주얼워터·배수구·스프링클러·예비 홀컵은 규칙에 따라 무벌타 구제가 가능하다. 단순히 목표방향에 고정 장애물이 있다는 이유로는 구제되지 않는다. 스트로크가 불가능하면 언플레이어블을 선언해 처치한다.","고정 장애물=항상 무벌타 구제가 아니다."],
["OB가 발생한 공의 처치방법과 벌타를 간략히 서술하시오.","OB는 2벌타이다. OB가 난 지점을 확인한 뒤 경기규칙이 정한 범위와 방향에 따라 홀컵에 가깝지 않게 공을 놓고 경기를 재개한다.","OB = 2벌타 + 규정에 따른 처치"],
["언플레이어블을 선언했을 때의 벌타와 경기방법을 간략히 서술하시오.","경기자 본인이 언플레이어블을 선언하고 2벌타를 받은 뒤 규정된 구제범위에서 공을 놓고 경기를 재개한다.","본인 선언 → 2벌타 → 구제"],
["경기 중 분실구가 발생했을 때의 벌타와 처리방법을 간략히 서술하시오.","분실구는 2벌타이다. 분실되었다고 추정되는 지점에서 가장 가까운 지점을 선정하고, 스탠스와 스트로크가 가능한 위치에서 홀컵과 가깝지 않게 2클럽 이내로 이동하여 공을 놓는다. 탐색·지연 기준은 3분이다.","분실구 2벌타 · 3분 · 추정지점 기준"],
["그린 위에서 공을 처치할 때 발생할 수 있는 주요 위반사항과 벌타를 서술하시오.","마크가 필요한 상황에서 정해진 절차를 지키지 않고 공을 임의로 집거나 옮기는 행위, 마커를 규정과 다르게 이동·복귀하는 행위 등이 위반이 될 수 있다. 해당 위반에는 경기규칙에 따른 2벌타와 원위치 등의 처치를 적용한다.","마크 절차와 원위치를 정확히 지킨다."],
["파크골프 경기장에서 경기자가 지켜야 할 주요 안전수칙을 3가지 서술하시오.","① 샷 전 스윙 반경과 주변 사람을 확인하고 안전거리를 확보한다. ② 동반자 전원이 샷을 끝내기 전에 앞으로 나가지 않는다. ③ 잘못 친 공이 사람에게 갈 위험이 있으면 큰소리로 즉시 경고한다.","안전 확인 · 앞서가지 않기 · 위험 즉시 경고"],
["파크골프 경기 중 경기 방해를 방지하기 위해 지켜야 할 사항을 서술하시오.","다른 경기자가 샷을 준비할 때 정숙하고 움직임을 삼가며, 휴대전화 소음을 방지하고 경기자의 플레이를 방해하지 않는다.","정숙 · 휴대전화 · 방해 금지"],
["파크골프 경기장에서 지켜야 할 좋은 매너를 6가지 서술하시오.","안전거리 유지, 경기순서 준수, 다른 경기자의 샷 때 정숙, 신속한 경기 진행, 코스 보호, 동반자 배려 등이다.","안전 · 순서 · 정숙 · 신속 · 보호 · 배려"],
["파크골프 경기장에서 삼가야 할 나쁜 매너를 3가지 서술하시오.","과도한 연습스윙, 다른 경기자의 플레이를 방해하는 말과 행동, 경기속도를 지연시키는 행동 등을 삼간다.","경기 방해와 지연을 하지 않는다."],
["전국대회 첫 경기 시작 전 각 홀에 배치된 심판의 주요 임무를 5가지 서술하시오.","선수 확인, 티샷 순서 확인, 경기진행 안내, 안전거리와 코스 상태 확인, 경기 시작 및 기록관리 등을 수행한다.","대회 운영지침이 별도로 있으면 그 지침을 우선한다."],
["파크골프대회에서 실격 처리되는 경우를 5가지 서술하시오.","경기규칙상 대표적인 실격 사유로 경기 당일 코스 내 연습 스트로크, 경기 시작 후 도착, 규칙 적용 배제나 벌타 면제를 합의한 경우, 부적합한 용구 관련 중대한 위반, 중대한 에티켓 위반으로 대회위원회가 실격 조치한 경우 등이 있다.","구체적인 실격 사유는 해당 대회규정도 함께 확인한다."],
["다음 경기 상황에서 A선수의 총 타수를 계산하시오.\n\n상황 :\nA선수가 티잉그라운드에서 티샷을 하였으나\n공이 클럽 헤드에 살짝 맞아 떨어졌다.\n이후 공을 집어 티 위에 다시 올려놓고 샷한 뒤\n퍼팅으로 컵인하였다.","티샷 1타 + 공을 집어 올린 행위 2벌타 + 다시 친 샷 1타 + 오소플레이 2벌타 + 퍼팅 1타 = 총 7타.","1 + 2 + 1 + 2 + 1 = 7타"],
["다음 상황에서 A선수의 총 타수를 계산하시오.\n\n상황 :\n직선형 PAR 3홀에서 A선수가 티샷한 공이\n그린을 지나 OB 경계선에 애매하게 정지하였다.\nA선수가 동반자의 확인 없이\n본인 판단으로 OB가 아니라고 생각하여\n그대로 퍼팅해 컵인하였다.","정답은 실제 OB 여부에 따라 달라진다. ① 실제로 OB가 아닌 경우: 티샷 1타 + 퍼팅 1타 = 총 2타. 동반자 확인 없이 경기했다는 사실만으로 별도 벌타를 더하지 않는다. ② 나중에 실제 OB였음이 확인된 경우: 티샷 1타 + OB 2벌타 + 그대로 퍼팅한 1타 + OB 처치방법 위반 2벌타 = 총 6타.","두 경우를 반드시 구분해 계산한다. OB 아님 → 총 2타 / 실제 OB로 확인 → 총 6타."],
["파크골프에서 어프로치샷이란 무엇인지 서술하시오.","그린 또는 홀컵 주변으로 공을 보내기 위해 거리와 방향을 조절하는 비교적 짧고 정확한 샷이다.","홀컵 주변에 정확히 보내는 샷"],
["어프로치샷 후 공이 홀컵에서 2클럽 이내에 위치한 경우, 경기자는 어떻게 처리해야 하는가?","그린 위 공이 홀컵에서 2클럽 이내이면 동반자에게 통보하고 우선해서 마크하거나 컵인을 실시하며, 필요한 경우 그대로 둘 수도 있다.","2024 개정 내용 기준"],
["볼을 마크하는 방법과 이동 방법, 위반 시 벌타를 서술하시오.","볼마커를 공 뒤에 놓고 공을 집어 올린다. 마커 이동이 필요하면 클럽헤드 길이를 기준으로 규정된 범위에서 이동하고, 경기 전 이동 순서의 역순으로 원위치한 뒤 공을 놓는다. 규정 위반 시 2벌타가 적용될 수 있다.","마커 이동은 클럽헤드 길이 기준, 원위치 필수"],
["티샷 이후 경기 진행 시 경기자가 지켜야 할 사항을 서술하시오.","경기순서를 지키고 다른 경기자의 샷과 퍼팅라인을 방해하지 않으며, 동반자 전원의 샷이 끝나기 전에 앞으로 나가지 않는다. 홀아웃 후에는 타수를 확인하고 신속하게 다음 홀로 이동한다.","안전 · 순서 · 신속한 진행"],
["파크골프 경기에서 스코어카드를 기록하는 방법을 서술하시오.","각 홀에서 홀아웃한 타수를 정확한 숫자로 기록하고 동반자와 상호 확인한다. 한 홀을 마친 뒤 후속조에 신호하고 다음 홀로 이동하여 기록하는 것이 원활한 진행에 도움이 된다.","홀별 타수 정확히 기록 · 상호 확인"],
["티잉그라운드에서 발생할 수 있는 상황별 경기규칙과 벌타를 서술하시오.","발 일부가 티잉그라운드 밖에서 티샷, 지정 장소 밖 티샷, 티 위에 공을 놓지 않은 티샷, 목표방향 표시물을 놓고 티샷 등은 2벌타이다. 스트로크에 의하지 않은 무의식적 접촉으로 공이 티에서 떨어지면 현행 조문상 1타 가산 없이 다시 티샷한다. 티샷 헛스윙으로 공이 움직이지 않으면 스트로크로 보지 않는다.","상황별 표와 본문 개정 조문이 다를 때 최신 개정 조문을 우선해 공부한다."],
["다음 상황에서 A선수에게 적용되는 총 벌타를 계산하시오.\n\n상황 :\nA선수가 티잉그라운드에서\n티에 공을 올려놓지 않고 티샷하였으며,\n이때 발뒤꿈치가 티잉그라운드 밖으로 나간 상태였다.\n\nA선수에게 적용되는 총 벌타는 얼마인가?","티 위에 공을 놓지 않은 위반과 발 일부가 티잉그라운드 밖에서 스트로크한 위반이 각각 제시되어 있다. 각 위반은 2벌타 규정이므로 문제 의도상 총 4벌타로 계산한다.","2벌타 + 2벌타 = 4벌타"],
["다음 상황에서 A선수에게 적용되는 벌타와 경기방법을 서술하시오.\n\n상황 :\nA선수가 첫 번째와 두 번째 티샷에서\n모두 헛스윙을 하였고,\n두 번째 헛스윙 후 공이 티에서 떨어졌다.\n\n이 경우 벌타와 경기방법은 무엇인가?","헛스윙으로 공이 움직이지 않으면 스트로크하지 않은 것으로 본다. 그러나 헛스윙으로 공이 움직였다면 그 헛스윙은 스트로크한 것으로 간주한다. 따라서 첫 헛스윙이 공을 움직이지 않았다면 0타, 두 번째 헛스윙으로 공이 티에서 떨어져 움직였다면 그 동작은 1스트로크로 계산한다. 이후 공의 정지 상태에 따라 다음 경기를 한다.","블로그의 '헛스윙은 의사가 있으면 모두 스트로크'는 현행 제17조와 다르다."],
["다음 두 가지 상황에서 A선수에게 적용되는 벌타를 각각 서술하시오.\n\n① 자신의 움직이는 공을 클럽으로 막거나 건드린 경우\n② 이동 중 정지되어 있는 공을 무의식적으로 건드려 움직인 경우","① 움직이는 자신의 공을 클럽이나 발로 막거나 건드린 경우에는 2벌타를 적용하고, 공이 멈춘 위치에서 다음 경기를 한다. ② 이동 중 정지되어 있는 공을 무의식적·무심결에 건드려 움직인 경우에는 무벌타이며, 공을 원래 있었다고 추정되는 위치에 놓고 경기를 계속한다.","움직이는 자신의 공을 막음 → 2벌타 / 정지된 공을 무심결에 건드림 → 무벌타 + 원위치"],
["경기 순서를 잘못 진행한 경우, 벌타와 경기 진행방법을 서술하시오.\n\n사례 :\nA선수가 A9홀을 홀아웃한 후\nA6홀을 빠뜨리고 A7~A9홀을 연속하여 경기한 사실을\n알게 되었다.\n\n이 경우 어떻게 처리해야 하는가?","문장에 홀 순서가 서로 모순되어 있어 그대로는 정확한 판정이 어렵다. 빠뜨린 홀이 확인되면 대회 경기규정과 홀 순서 관련 규칙에 따라 바로잡아야 하며, 잘못 경기한 홀의 타수·벌타 처리는 공식 출제기준을 확인해야 한다.","문제 문장 자체의 순서 오류에 주의"],
["그린 위에서 동반자의 요구 없이 공을 마크한 경우의 벌타와 처치방법을 서술하시오.","마크는 경기규칙이 허용하는 상황과 절차에 따라 해야 한다. 정당한 사유 없이 임의로 공을 집어 올린 경우에는 공 집어올림 관련 규정에 따른 2벌타와 원위치 처치를 적용할 수 있다.","마크 사유와 절차를 먼저 확인한다."],
["마크 요구에 따라 볼마커를 이동할 때, 허용된 범위를 초과하여 50cm 이동한 경우 벌타와 처치방법을 서술하시오.","규정된 클럽헤드 길이 기준을 초과하여 마커를 이동하면 마크 절차 위반이다. 2벌타를 적용하고 마커를 정확한 원래 위치로 복귀시킨 뒤 공을 놓고 경기한다.","거리 '50cm'보다 규정된 마커 이동 기준을 기억한다."],
["움직일 수 있는 장애물을 제거하고 샷한 경우의 벌타와 이유를 서술하시오.","낙엽·작은 돌·나뭇가지 등 움직일 수 있는 장애물은 제거할 수 있으므로 정상적으로 제거하고 샷하면 무벌타이다. 제거 도중 공이 움직여도 벌타 없이 원래 있었다고 추정되는 지점에 놓는다.","움직일 수 있는 장애물 제거 = 무벌타"],
["예비 홀컵에 공이 걸쳐 있는 경우의 벌타와 처치방법을 서술하시오.","무벌타 구제 대상이다. 경기규칙에 따른 구제 길이와 처치방법으로 홀컵에 가깝지 않게 공을 놓고 다음 경기를 한다.","예비 홀컵 = 무벌타 구제"],
["캐주얼워터에 공이 빠진 경우의 벌타와 처치방법을 서술하시오.","캐주얼워터는 무벌타 구제 대상이다. 규칙에 따른 구제 길이와 처치방법으로 홀컵에 가깝지 않게 공을 놓고 경기한다.","캐주얼워터 = 무벌타 구제"],
["OB 판정이 애매한 상황에서 동반자의 확인 없이 임의로 경기한 경우의 벌타와 처치방법을 서술하시오.","본인이 먼저 OB 여부를 판단하고 동반자 모두가 확인한다. 의견이 다르면 심판 판정을 받는다. 동반자 확인 없이 임의로 경기하고 그 위치가 OB 경계선 밖으로 확인되면 OB 처치 위반에 따른 2벌타가 추가될 수 있다.","애매한 OB는 확인부터"],
["안전망 주변에서 벌타가 되는 상황을 서술하시오.","안전망을 신체 일부로 걷어 올려 공간을 만들고 샷하거나, 안전망을 먼저 가격하면서 공을 치는 등 고정 장애물을 의도적으로 변형·훼손하며 스트로크하면 2벌타가 적용된다.","백스윙 중 우연히 안전망을 건드린 경우와 구분"],
["안전망 주변에서의 볼 처치와 타수를 서술하시오.","안전망은 움직일 수 없는 장애물로 본다. 단순히 목표방향에 있다는 이유로 구제받지 못한다. 장애 때문에 스트로크할 수 없으면 언플레이어블을 선언하고 2벌타 후 규정에 따라 처치한다.","고정 장애물 자동 구제 아님"],
["공에 묻은 이물질을 제거하기 위해 마크하지 않고 공을 집어 든 경우의 벌타와 처치방법을 서술하시오.","규칙이 허용한 절차 없이 공을 임의로 집어 올린 경우 2벌타를 적용하고 공을 원위치한 뒤 경기한다.","공을 임의로 집지 않는다."],
["그린에서 홀아웃하지 않고 공을 집어 든 경우의 벌타와 타수를 서술하시오.\n\n사례 :\nPAR 4홀에서 A선수가 3타째 샷 후\n그린에서 퍼팅하여 공이 홀컵 10cm 옆에 정지하였다.\nB선수가 “OK”라고 하여 공을 집어 들었으나,\n심판의 경고를 받고 공을 원위치하여\n1회 퍼팅으로 홀아웃하였다.\n\nA선수의 총 타수는?","3타째 샷 후 퍼팅이 4타째이고, 임의로 공을 집은 행위에 2벌타, 원위치 후 1회 퍼팅이 5번째 스트로크이므로 총 7타이다.","3 + 퍼팅1 + 2벌타 + 재퍼팅1 = 7타"],
["움직이는 공을 다른 선수가 샷하여 충돌한 경우의 벌타와 경기방법을 서술하시오.\n\n사례 :\nA선수가 스트로크한 공이 움직이고 있는 중에\n다음 순서인 B선수가 스트로크하여\nA선수의 공과 충돌하였다.\n\n이때 B선수에게 적용되는 벌타와\n경기방법을 서술하시오.","A의 공이 움직이는 중 B가 스트로크하여 충돌한 경우 B에게 2벌타를 부여한다. 충돌로 움직인 정지 공의 원위치 및 각 공의 최종 처치는 공 충돌 관련 규칙에 따라 처리한다.","다음 순서 선수가 움직이는 공에 충돌 = 2벌타"],
["대회 후 동타가 발생한 경우의 처리방법을 서술하시오.","해당 대회의 경기규정을 우선 적용한다. 대회규정에서 정한 백카운트 또는 서든데스 등의 방식으로 순위를 결정할 수 있다.","동타 결정은 대회규정 우선"],
["파크골프장 코스별 A~F 깃발 색상을 서술하시오.","A 적색, B 청색, C 황색, D 백색이며, E·F까지 운영하는 경우 제공된 대비자료는 E 적색, F 청색으로 제시한다.","표준문제집에서 직접 확인된 핵심은 A~D = 적·청·황·백"],
["9홀 파크골프장의 일반적인 제원을 서술하시오.","Par3 4홀, Par4 4홀, Par5 1홀로 총 9홀, 기준타수 33타이며 전체 길이는 500~790m이다. Par3는 40~60m, Par4는 60~100m, Par5는 100~150m이다.","4·4·1 / 33타 / 500~790m"],
["파크골프 벙커의 종류와 설치 이유를 서술하시오.","제공된 대비자료에서는 그린 주변 벙커, 크로스 벙커, 사이드 벙커 등을 예로 들며 코스 난이도와 전략성, 경기의 변화를 주기 위해 설치한다고 설명한다.","이 문항의 세부 분류는 제공된 대비자료 참고"],
["언플레이어블 여부를 판단하는 사람과 선언 시 벌타 및 구제범위를 서술하시오.","경기자 본인이 판단하여 선언한다. 2벌타 후 공이 있던 지점을 기준으로 경기규칙이 정한 구제범위에서 공을 놓고 경기한다.","본인 판단·선언 + 2벌타"],
["언플레이어블 선언 후 2클럽 이내에 샷 가능한 지점이 없는 경우의 처리방법을 서술하시오.","이전 샷을 한 지점의 방향으로 이동하여 샷 가능한 지점에 공을 놓는다. 이 처치에는 추가 벌타가 없다.","'이전 샷한 지점 방향'을 정확히 기억"],
["파크골프장의 시설물과 설치물의 종류 및 설치 이유를 서술하시오.","표준교재의 시설물·설치물 분류에 따라 작성한다. 2024 개정요약에서는 티잉그라운드를 '설치물'로 보완하고 '티박스'로도 칭한다고 제시한다.","시험에서는 교재의 분류 용어를 그대로 쓰는 것이 안전"],
["페어웨이, 그린, 러프의 잔디 길이를 각각 서술하시오.","제공된 대비자료 기준: 페어웨이 약 3cm, 그린 2cm 이하, 러프 5cm 이상.","그린 2cm 이하(20mm)는 표준문제집에서도 확인되는 수치"],
["대회에 참가하는 선수의 필수 휴대품을 서술하시오.","클럽, 공, 예비공, 볼마커, 스코어카드, 필기구 등을 준비한다.","대회별 필수품은 대회요강도 확인"],
["경기 도중 의식이 없는 응급환자 발생 시 골든타임과 우선 조치사항을 서술하시오.","골든타임은 약 4분으로 보고, 즉시 119 신고와 AED 요청, 호흡 확인, 심폐소생술 등 신속한 응급조치를 시행한다.","4분 · 119 · CPR · AED"],
["심폐소생술(CPR)을 위한 응급조치 방법을 순서대로 서술하시오.","안전 확인 → 의식 확인 → 119 신고 및 AED 요청 → 호흡 확인 → 가슴압박 30회 → 필요시 인공호흡 2회 → AED 도착 시 안내에 따라 사용 → 구급대 도착까지 반복한다.","응급교육에서 배운 최신 절차를 우선 적용"],
["운동 전에 준비운동을 실시해야 하는 이유를 서술하시오.","체온과 심폐기능을 점진적으로 높이고 근육과 관절을 이완하여 운동 수행을 준비하며 부상을 예방하기 위해서이다.","체온 · 심폐 · 근육 · 부상 예방"],
["파크골프에서 그립을 잡는 3가지 방법을 서술하시오.","오버래핑 그립, 인터로킹 그립, 베이스볼 그립.","오버래핑 · 인터로킹 · 베이스볼"],
["파크골프에서 사용하는 퍼팅 그립의 종류와 특징을 간략히 서술하시오.","제공된 대비자료에서는 리버스 오버래핑, 크로스 핸드, 핑거본 그립 등을 제시하며, 손목 움직임을 억제하고 안정적인 스트로크를 만드는 데 목적이 있다고 설명한다.","세부 명칭은 표준교재 표현과 함께 암기"],
["파크골프에서 티샷과 퍼팅 시 적정한 그립 압력은 어느 정도인가?","제공된 대비자료 기준으로 티샷은 약 60~70%, 퍼팅은 약 50% 정도로 제시한다.","이 수치는 제공된 심판시험 대비자료 참고"],
["파크골프에서 안정적인 퍼팅을 위한 스탠스 방법을 서술하시오.","체형에 맞는 안정된 스탠스 폭을 유지하고 몸의 흔들림을 줄여 일정한 스트로크가 가능하도록 자세를 취한다.","안정 · 균형 · 일정한 스트로크"],
["파크골프에서 기본 스탠스의 방법과 거리별 스탠스 폭을 서술하시오.","기본적으로 어깨너비 정도의 안정된 폭을 취하고, 짧은 거리는 기본 폭, 장거리는 필요에 따라 조금 넓게 하여 균형을 유지한다.","거리보다 균형과 안정이 핵심"],
["깊은 러프에서 깃대까지 50m 이상 남은 경우, 공을 깃대에 가깝게 보내기 위한 스윙방법을 서술하시오.","깊은 러프에서는 무리하게 비거리를 내기보다 클럽을 안정적으로 잡고 정확한 임팩트로 먼저 러프를 탈출한 뒤 다음 샷을 준비한다.","제공된 대비자료는 '클럽을 짧게 잡고 정확한 임팩트'를 강조"],
["파크골프에서 베이스볼 그립은 어떤 경기자에게 적합한지 서술하시오.","손가락을 겹치거나 걸지 않고 열 손가락으로 잡는 방식으로, 일반적으로 초보자나 손이 작은 경기자가 쉽게 잡기 좋은 방식으로 설명된다.","초보자 · 손이 작은 경기자"],
["파크골프에서 어드레스 시 신체와 발의 방향에 따라 구분되는 스탠스 3가지의 명칭과 특징을 서술하시오.","스퀘어 스탠스, 오픈 스탠스, 클로즈 스탠스이다. 목표선에 대해 양발의 정렬이 평행이면 스퀘어, 앞쪽을 열면 오픈, 닫으면 클로즈로 구분한다.","스퀘어 · 오픈 · 클로즈"],
["파크골프 초보자의 샷 종류에 따른 공 위치를 오른손잡이 기준으로 서술하시오.","제공된 대비자료 기준으로 티샷은 왼발 뒤꿈치 쪽, 페어웨이 샷은 양발 중앙 또는 약간 목표방향, 퍼팅은 왼쪽 눈 아래를 기본으로 조절한다.","개인 체형과 샷에 따라 조절 가능"],
["OB 판정을 받은 공의 처치 방법을 단계별로 서술하시오.","OB 여부와 경계선을 확인 → 공이 OB 경계를 벗어난 지점을 확인 → 2벌타 적용 → 규정된 구제 방향과 범위에서 홀컵에 가깝지 않게 공을 놓음 → 다음 스트로크를 한다.","OB = 2벌타, 처치 위치가 핵심"],
["경기 당일 파크골프장별로 자체적으로 정하여 적용하는 규칙을 무엇이라고 하는가?","로컬룰(Local Rule).","로컬룰"],
["잔디 식재 구역이나 어린 묘목 식수지 등을 보호하기 위한 구제 구역을 무엇이라고 하는가?","수리지.","수리지"],
["파크골프 티잉그라운드의 규격과 고무티의 높이를 서술하시오.","티잉그라운드는 1.5m×1.5m에서 2m×2m 범위로 제시되며, 티 높이는 2.3cm이다.","1.5×1.5~2×2m / 티 2.3cm"],
["기준타수(Par)보다 3타를 많이 기록하여 홀아웃한 경우의 타수 용어와 해당 사례를 서술하시오.","트리플보기. Par3에서 6타, Par4에서 7타, Par5에서 8타가 해당한다.","+3 = 트리플보기"],
["Par 5홀에서 2타로 컵인하여 홀아웃한 경우 타수 용어는 무엇이며 타수별 명칭을 서술하시오.","Par5에서 2타는 기준타수보다 3타 적으므로 알바트로스이다. -1 버디, -2 이글, -3 알바트로스, -4 콘도르.","Par5 2타 = 알바트로스"],
["파크골프 단체전에서 포섬 방식의 경기방법을 서술하시오.","일반 포섬은 2명이 한 팀이 되어 팀별 공 1개로 번갈아 스트로크하는 방식이다. 경기규칙에는 베스트볼을 적용하는 포섬도 별도로 규정되어 있어 대회방식을 확인해야 한다.","일반 포섬과 베스트볼 포섬을 구분"],
["파크골프 경기에서 매치플레이 방식의 경기방법을 서술하시오.","각 홀에서 적은 타수로 홀아웃한 경기자가 그 홀을 이기고, 전체 경기에서 더 많은 홀을 이긴 경기자가 승리하는 방식이다.","홀별 승패를 합산"],
["파크골프 경기에서 백카운트란 무엇인지 서술하시오.","동타가 발생했을 때 대회규정에서 정한 후반 코스 또는 특정 홀의 타수를 순차적으로 비교하여 순위를 정하는 방식이다.","세부 비교 순서는 대회규정 우선"],
["긴 풀이나 고정 장애물 등으로 인해 공을 정상적으로 플레이하기 어려운 경우의 경기규칙 적용 방법을 서술하시오.","공은 원칙적으로 있는 그대로 경기한다. 정상적인 스트로크가 불가능하면 경기자가 언플레이어블을 선언하고 2벌타 후 규정된 방법으로 처치한다. 고정 장애물은 단순히 목표방향에 있다는 이유로 무벌타 구제되지 않는다.","있는 그대로 경기 → 불가능하면 언플레이어블"],
["파크골프장 코스 내에서 옮길 수 있는 장애물을 2가지 이상 서술하시오.","낙엽, 작은 돌, 나뭇가지, 비닐봉지 등 쉽게 이동할 수 있는 장애물.","제거 도중 공이 움직여도 무벌타 원위치"],
["전국대회에서 상위권 동타자가 발생했을 때 최종 순위를 결정하는 2가지 방법을 약술하시오.","백카운트와 서든데스가 사용될 수 있다. 실제 적용은 해당 대회의 경기규정을 우선한다.","백카운트 · 서든데스"],
["경기 중 마크 요구를 받은 경우, 볼 마커 사용 시 벌타가 적용되는 행위를 2가지 이상 서술하시오.","마크 요구를 받고도 정해진 마크 절차를 위반하는 행위, 이동한 마커를 원위치하지 않고 경기하는 행위, 허용 범위를 넘겨 마커를 이동하는 행위 등이 해당될 수 있다.","공 뒤 마크 · 이동 후 원위치"],
["그린에서 퍼팅 시 동반자의 공에 마크를 요구하는 경우, 볼 마커의 사용요령을 서술하시오.","세컨드 샷부터 20m 이내의 방해되는 공에 마크를 요구할 수 있다. 요구받은 경기자는 공 뒤에 볼마커를 놓고 공을 집어 올리며, 필요하면 규정에 따라 마커를 이동한 뒤 반드시 원위치한다.","티샷 마크 요구 불가 · 세컨드부터 20m"],
["마크 요구를 받은 동반자가 다음 순서로 퍼팅할 경우, 공을 원래 위치로 되돌리는 방법을 서술하시오.","이동시킨 볼마커가 있다면 이동 순서의 역순으로 원래 위치로 되돌리고, 마커 앞의 원래 공 위치에 공을 놓은 뒤 마커를 제거한다.","역순 복귀 → 공 원위치 → 마커 제거"],
["경기 중 페어웨이 또는 그린에서 공의 충돌이 발생하는 주요 원인을 2가지 이상 서술하시오.","마크가 필요한 방해 공을 그대로 두고 샷한 경우, 앞 경기자의 공이 아직 움직이는 중 다음 선수가 샷한 경우, 경기순서나 안전거리를 지키지 않은 경우 등이 있다.","충돌 예방은 마크·순서·대기"],
["Par 5홀에서 세컨드 샷이 OB가 된 경우, 홀아웃까지의 총 타수를 샷 순서와 벌타를 포함하여 서술하시오.","세컨드 샷까지 2스트로크에 OB 2벌타가 더해져 다음 스트로크는 5타째가 된다. 그 이후 몇 번의 어프로치와 퍼팅으로 홀아웃했는지가 문제에 제시되지 않았으므로 총타수는 하나로 확정할 수 없다.","블로그의 9타는 이후 어프로치 2타·퍼팅 3타를 임의로 가정한 값이다."],
["티샷한 공이 첫 번째 OB 말뚝 주변에 정지한 경우, OB 여부를 판정하는 방법을 서술하시오.","OB라인 또는 2개의 OB말뚝 외측 연장선을 기준으로 공의 위치를 확인한다. 경계선 근처로 애매하면 본인이 먼저 판단하고 동반자 모두가 확인하며, 의견이 다르면 심판의 판정을 받는다.","눈대중으로 임의 판정하지 않는다."],
["페어웨이에서 A선수가 B선수의 공에 마크를 요구하지 않고 샷하여 두 공이 모두 OB가 된 경우, 각 선수의 처리방법을 서술하시오.","A의 스트로크한 공이 정지해 있던 B의 공을 맞혀 B의 공이 움직였다면 B의 공은 원위치한다. A의 공이 최종적으로 OB에 정지했다면 A는 OB 규칙에 따라 2벌타와 처치를 적용한다. B의 공을 충돌 결과 그대로 OB로 처리하지 않는다.","정지된 B공은 원위치 · A공은 최종 위치 판정"],
["티샷한 공이 페어웨이로 굴러가던 중 다른 홀에서 굴러 들어온 공과 충돌하여 OB가 된 경우, 그 이유와 조치방법을 약술하시오.","움직이는 외부의 다른 공과 우연히 충돌한 경우 각 공의 상태와 최종 위치를 규칙에 따라 판정한다. 자신의 공이 최종적으로 OB로 확인되면 OB 규칙에 따라 2벌타 후 처치한다.","충돌 자체와 OB 결과를 구분"],
["어프로치 샷 또는 퍼팅 후 깃대 주변 2클럽 이내에 공이 놓인 경우, 경기자의 행동요령을 약술하시오.","그린 위 공이 홀컵에서 2클럽 이내이면 동반자에게 통보하고 우선해서 마크하거나 컵인을 실시하며, 필요한 경우 그대로 둘 수 있다.","2024 개정 내용 기준"],
["파크골프에서 ‘언플레이어블’을 선언하는 상황과 이후의 처치방법을 약술하시오.","나무 밑, 깊은 러프, 움직일 수 없는 장애물 등으로 정상적인 스트로크가 불가능할 때 경기자 본인이 선언할 수 있다. 2벌타 후 규정된 구제방법으로 공을 놓고 경기한다. 2클럽 이내에 샷 가능한 지점이 없으면 이전 샷한 지점 방향으로 이동해 샷 가능한 곳에 놓으며 추가 벌타는 없다.","본인 선언 · 2벌타 · 규정 처치"],
["수리지 또는 캐주얼워터에 공이 정지한 경우, 무벌타 구제방법을 약술하시오.","무벌타로 구제받는다. 경기규칙이 정한 구제 길이와 처치방법에 따라 홀컵에 가깝지 않은 위치에 공을 놓고 경기한다.","수리지·캐주얼워터 = 무벌타 구제"],
["장애물에 대한 설명 중 잘못된 것은?\n\n가. 장애물이란 경기 도중 코스 내에서 접하는 자연물 및 인공물을 말한다.\n나. 장애물은 움직일 수 있는 장애물과 움직일 수 없는 장애물로 크게 분류된다.\n다. 움직일 수 있는 장애물은 동반자의 양해 없이도 치울 수 있다.\n라. 고정 장애물이 샷을 하는 데 방해되는 경우 무벌타로 구제받을 수 있다.","정답: 라. 고정 장애물이라고 해서 모든 경우 자동으로 무벌타 구제가 되는 것은 아니다. 특히 목표방향에 움직일 수 없는 장애물이 있다는 이유만으로는 구제받을 수 없다.","정답 라"],
["1번 홀에서 첫 샷 순서를 정하는 방법으로 옳은 것은?\n\n가. 순서 뽑기로 정한다.\n나. 가위바위보로 정한다.\n다. 연장자 순으로 정한다.\n라. 티잉그라운드에 도착한 순서대로 정한다.","정답: 가. 순서 뽑기로 정한다.","정답 가"],
["2번 홀부터 샷의 순서를 정할 때 적용하는 방법으로 옳은 것은?\n\n가. 1번 홀에서 정한 순서를 그대로 적용한다.\n나. 1번 홀에서 먼저 홀아웃한 순서대로 한다.\n다. 전 홀의 타수가 적은 순서대로 적용한다.\n라. 1번 홀과 같은 방법으로 다시 순서를 정한다.","정답: 다. 전 홀의 타수가 적은 순서대로 적용한다. 동타의 세부 순서는 경기규칙 및 대회 운영기준을 확인한다.","정답 다"]
];
const app=document.getElementById("app");
const SAVEKEY="pg_referee_saved_v1";
let idx=Number(localStorage.getItem("pg_referee_pos")||0); if(idx<0||idx>=data.length)idx=0;
let mode="all";
function saved(){try{return JSON.parse(localStorage.getItem(SAVEKEY)||"[]")}catch(e){return[]}}
function setSaved(a){localStorage.setItem(SAVEKEY,JSON.stringify(a));updateCount()}
function updateCount(){const n=saved().length;document.getElementById("savedCount").textContent=n?"("+n+")":""}
function showAll(){mode="all";document.getElementById("allTab").classList.add("active");document.getElementById("savedTab").classList.remove("active");render()}
function showSaved(){mode="saved";document.getElementById("savedTab").classList.add("active");document.getElementById("allTab").classList.remove("active");renderSaved()}
function render(){localStorage.setItem("pg_referee_pos",idx);const x=data[idx],s=saved().includes(idx);app.innerHTML='<article class="qcard"><div class="top"><span class="num">문제 '+(idx+1)+'</span><div class="topMove"><button onclick="prev()" '+(idx===0?'disabled':'')+'>← 이전</button><span>'+(idx+1)+' / '+data.length+'</span><button onclick="next()" '+(idx===data.length-1?'disabled':'')+'>다음 →</button></div></div><div class="q">'+x[0]+'</div><div class="actions"><button class="answerBtn" onclick="toggleAnswer()">정답 확인</button><button class="saveBtn '+(s?'saved':'')+'" onclick="toggleSave()">'+(s?'★ 저장됨':'☆ 문제 저장')+'</button></div><div class="ans" id="ans"><b>모범답안</b>\n'+x[1]+'\n\n<b>핵심</b> '+x[2]+'</div></article>'}
function toggleAnswer(){const a=document.getElementById("ans"),b=document.querySelector(".answerBtn"),on=!a.classList.contains("show");a.classList.toggle("show",on);b.textContent=on?"정답 닫기":"정답 확인"}
function toggleSave(){let a=saved();if(a.includes(idx))a=a.filter(n=>n!==idx);else a.push(idx);a.sort((x,y)=>x-y);setSaved(a);render()}
function prev(){if(idx>0){idx--;render();scrollTo({top:0,behavior:"smooth"})}}
function next(){if(idx<data.length-1){idx++;render();scrollTo({top:0,behavior:"smooth"})}}
function renderSaved(){const a=saved();if(!a.length){app.innerHTML='<div class="qcard empty">저장한 문제가 없습니다.<br>문제 화면에서 <b>☆ 문제 저장</b>을 눌러 저장하세요.</div>';return}app.innerHTML='<div class="savedList">'+a.map(n=>'<button class="savedItem" onclick="openSaved('+n+')"><b>문제 '+(n+1)+'</b>'+data[n][0].replace(/\\n/g," ").slice(0,72)+'</button>').join("")+'</div>'}
function openSaved(n){idx=n;showAll();scrollTo({top:0,behavior:"smooth"})}
updateCount();render();
</script></body></html>
