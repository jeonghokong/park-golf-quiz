const items=[

{q:"티잉 그라운드에서 티 샷을 하기 위해 연습 스윙을 2~3회 정도 해도 무방하다.",a:0},

{"q":"시설물 중에 난이도를 높이기 위해 설치된 벙커는 3가지 종류가 있다. 아닌 것은?","opts":["그린 벙커","페어웨이 벙커","사이드 벙커","크로스 벙커"],"a":1},
{"q":"경기에 참가하는 선수의 필수 휴대품이 아닌 것을 고르시오.","opts":["클럽, 공","티, 볼 포켓","볼 마커, 공","다과류, 음료수"],"a":3},

{"q":"정지된 공에 대한 규칙 중 2벌타가 아닌 것을 고르시오.","opts":["풀 등에 파묻힌 공을 움직여서 자신의 공인지를 확인한 경우","공에 접근하다가 무의식적으로 공을 밟은 경우","공에 접근하여 고의로 공을 움직여서 위치를 이동한 경우","잔디나 모래 등을 클럽 헤드로 눌러 공을 치기 쉽게 수정하는 경우"],"a":1},
{"q":"파크골프는 양호한 매너행위가 요구된다. 다음 중 이에 해당하지 않는 행위는?","opts":["그린 위에서 동반자의 퍼팅라인을 밟지 않도록 동반자의 뒤 쪽으로 이동한다.","컵인이 되면 자신의 타수를 동반자에게 자연스레 알려준다.","동반자 모두 홀 아웃하면 그린 위에서 각자의 타수를 확인하여 기록한 다음, 이동하면서 다음 조에게 OK수신호를 준다.","공이 비슷한 위치일 경우, 상호간 양해 하에 자연스레 순서를 정한다."],"a":2},
{"q":"PAR 3홀에서 티 위에 올려 놓지 않고 티 샷을 하였는데 OB가 나서 처치 후에 다음 샷을 한 결과, 컵인이 되었다면 모두 몇 타로 기록하는가?","opts":["4타","5타","6타","7타"],"a":2},
{"q":"PAR 4홀에서 티 샷을 하였는데 살짝 맞아 티에서 떨어져 계속하여 제2타째 쳤으나 OB 라인을 벗어나서 풀 속으로 들어가서 이후 공을 찾지 못해 분실구 처리를 하여 처치한 다음에 2타 만에 컵인이 되었다. 몇 타로 기록하는가?","opts":["6타","7타","8타","9타"],"a":0},
{"q":"대회 시 참가선수 중 가장 적은 타수를 기록한 경기자가 최종적으로 승자가 되는 경기방식을 무엇이라고 하는가?","opts":["스트로크플레이 방식","서든데스 방식","매치플레이 방식","포볼 방식"],"a":0},
{"q":"샷을 한 공이 반쪽으로 쪼개졌을 경우 어떻게 조치하면 되는가?","opts":["반쪽으로 나누어진 공의 큰 쪽을 사용하여 다음 샷을 시도한다.","반쪽으로 나누어진 공의 큰 쪽 위치에서 예비공을 놓고서 다음 샷을 시도한다.","경기 진행을 돕기 위하여 해당 홀에서만 동반자의 양해 하에 나누어진 공의 위치상 좋은 쪽을 선택하여 다음 샷을 시도한다.","샷을 한 장소로 되돌아가서 예비공으로 다시 샷을 한다."],"a":3},
{"q":"티 샷은 반드시 티 위에 볼을 올려놓고 공을 쳐야 한다. 티의 높이는 (   )cm 이하이다.","short":"2.3cm"},
{"q":"티잉 그라운드에서 목표 방향을 정한 다음 티 위에 놓인 공을 치려고 클럽 헤드를 갖다 대면서 자세를 취하는 것을 (   )라 한다.","short":"어드레스"},
{"q":"파크골프 용어로 PAR 5홀에서 2타로 홀컵에 공을 넣었다면 이를 무엇이라고 하는가?","short":"알바트로스"},
{"q":"대회 시 참가 선수 중 가장 적은 타수를 기록한 경기자가 2명 이상이 있을 경우 홀을 지정하여 승자를 가리는 경기 방식을 무엇이라고 하는가?","short":"서든데스 방식"},
{"q":"샷의 종류 중 긴 풀에 공이 정지하여 깃대를 향해 치거나 페어웨이로 빼내려고 시도하는 샷을 무엇이라 하는가?","short":"러프 샷"}

function start(){i=0;score=0;el("menu").classList.add("hide");el("result").classList.add("hide");el("quiz").classList.remove("hide");draw()}
function draw(){answered=false;const item=items[i];el("progress").textContent="2급 지도자 A형 · "+(i+1)+" / "+items.length;el("question").textContent=item.q;el("feedback").textContent="";el("next").classList.add("hide");el("choices").innerHTML=item.short?'<input id="short" aria-label="단답형 답안" placeholder="정답을 입력하세요" style="grid-column:1/-1;padding:13px;border:1px solid #dce5df;border-radius:10px;font-size:16px"><button class="action" style="grid-column:1/-1" onclick="answerShort()">정답 확인</button>':(item.opts||["X","O"]).map((label,n)=>'<button class="choice" data-i="'+n+'" onclick="answer('+n+')">'+(item.opts?["가. ","나. ","다. ","라. "][n]:"")+label+'</button>').join("")}
function reveal(ok,correctLabel){if(ok)score++;el("feedback").textContent=(ok?"정답입니다. ":"오답입니다. ")+"문제집 84쪽 정답표: "+correctLabel;el("next").textContent=i===items.length-1?"결과 보기 →":"다음 문제 →";el("next").classList.remove("hide")}
function answer(n){if(answered)return;answered=true;const item=items[i],correct=item.a,ok=n===correct;for(const b of el("choices").children){b.disabled=true;if(Number(b.dataset.i)===correct)b.classList.add("ok");else if(Number(b.dataset.i)===n)b.classList.add("bad")}reveal(ok,item.opts?["가","나","다","라"][correct]:(correct?"O":"X"))}
function answerShort(){if(answered)return;answered=true;const item=items[i],typed=el("short").value.replace(/\s/g,"").toLowerCase(),expected=item.short.replace(/\s/g,"").toLowerCase(),ok=typed===expected;el("short").disabled=true;reveal(ok,item.short)}
function next(){if(++i<items.length)draw();else{el("quiz").classList.add("hide");el("result").classList.remove("hide");el("result").innerHTML='<h2>A형 25문제 완료</h2><p>정답 '+score+' / '+items.length+'</p><button class="action" onclick="location.reload()">기출문제 목록으로</button>'}}
