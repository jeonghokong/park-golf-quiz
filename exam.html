<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>파크골프 자격별 기출문제</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#17211b;background:#f5f7f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:690px;margin:0 auto;padding:18px 12px 40px}h1{font-size:21px;margin:9px 0 5px}p{line-height:1.6;color:#55645c}a{color:#176b43}nav{display:flex;gap:10px;flex-wrap:wrap;margin:13px 0 20px}.card{background:white;border:1px solid #dce5df;border-radius:15px;padding:18px;margin-top:11px}h2{font-size:18px;margin:3px 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.set{border:1px solid #dce5df;background:#eff6f2;color:#176b43;padding:12px;border-radius:11px;font-size:15px;font-weight:700}.set:disabled{background:#f5f5f5;color:#7b817e}.notice{background:#fff7e9;border:1px solid #f3dfab;border-radius:12px;padding:12px;line-height:1.6;font-size:13px}.q{font-weight:750;line-height:1.6;font-size:18px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:14px 0}.choice{border:1px solid #dce5df;background:white;padding:14px;border-radius:10px;font-size:16px}.choice:disabled{color:#17211b}.choice.ok{border:2px solid #176b43;background:#eef7f2}.choice.bad{border:2px solid #b42318;background:#fff3f2}.action{background:#176b43;color:white;border:0;border-radius:11px;padding:13px 16px;font-weight:700;width:100%}.detail{font-size:13px;color:#4d5e54;margin:12px 0}.hide{display:none}button{cursor:pointer}button:disabled{cursor:default}
</style></head><body><main class="wrap"><a href="./">← 기존 문제 목록</a><h1>자격별 기출문제</h1><p>제공하신 「파크골프 자격검정 문제집」 원문을 기준으로 등록합니다. 기존 예상 1~5회와 심판 참고문제는 변경하지 않습니다.</p><div class="notice">현재 원문과 정답표를 대조하는 단계입니다. 2급 지도자 A형의 1~5번 OX 문제만 검수 완료되어 시범 제공하며, 나머지 문제는 검수가 끝난 뒤 순차 등록됩니다. 아직 모든 기출문제가 게시된 것은 아닙니다.</div>
<section id="menu"><div class="card"><h2>2급 지도자</h2><div class="grid"><button class="set" onclick="start()">A형 · 1~5번 시범</button><button class="set" disabled>B형 · 검수 중</button><button class="set" disabled>C형 · 검수 중</button><button class="set" disabled>D형 · 검수 중</button></div></div><div class="card"><h2>1급 지도자</h2><div class="grid"><button class="set" disabled>A형 · 검수 중</button><button class="set" disabled>B형 · 검수 중</button><button class="set" disabled>C형 · 검수 중</button></div></div><div class="card"><h2>3급 심판</h2><div class="grid"><button class="set" disabled>기출문제 · 검수 중</button></div></div></section>
<section id="quiz" class="card hide"><div id="progress"></div><div id="question" class="q"></div><div class="choices" id="choices"></div><div id="feedback" class="detail"></div><button class="action hide" id="next" onclick="next()">다음 문제 →</button></section><section id="result" class="card hide"></section>
</main><script>
const items=[
{q:"우천 시 페어웨이에서 자신의 공에 진흙이 묻어 있어 이를 제거하고 샷을 하였는데 동반자가 2벌타를 부과하였다.",a:1},
{q:"파크골프는 1개 코스는 9개 홀로 구성되어 있으며, 기준타수는 36타이다.",a:0},
{q:"파크골프장이 36홀인 경우 안내 표지판에 A, B, C, D코스 명칭으로 표시되어 있다.",a:1},
{q:"티잉 그라운드에서 티 샷을 하기 위해 연습 스윙을 2~3회 정도 해도 무방하다.",a:0},
{q:"경기 도중 안전수칙 미준수로 동반자 또는 동반자 외 다른 사람에게 신체적 손상을 입힌 경우에 경기중 중지하고 응급조치를 하여야 한다.",a:1}
];let i=0,score=0,answered=false;const el=x=>document.getElementById(x);
function start(){i=0;score=0;el("menu").classList.add("hide");el("result").classList.add("hide");el("quiz").classList.remove("hide");draw()}
function draw(){answered=false;el("progress").textContent="2급 지도자 A형 · "+(i+1)+" / "+items.length;el("question").textContent=items[i].q;el("feedback").textContent="";el("next").classList.add("hide");el("choices").innerHTML=["X","O"].map((label,n)=>'<button class="choice" data-i="'+n+'" onclick="answer('+n+')">'+label+'</button>').join("")}
function answer(n){if(answered)return;answered=true;const correct=items[i].a,ok=n===correct;if(ok)score++;for(const b of el("choices").children){b.disabled=true;if(Number(b.dataset.i)===correct)b.classList.add("ok");else if(Number(b.dataset.i)===n)b.classList.add("bad")}el("feedback").textContent=(ok?"정답입니다. ":"오답입니다. ")+"문제집 84쪽 정답표: "+(correct?"O":"X");el("next").textContent=i===items.length-1?"결과 보기 →":"다음 문제 →";el("next").classList.remove("hide")}
function next(){if(++i<items.length)draw();else{el("quiz").classList.add("hide");el("result").classList.remove("hide");el("result").innerHTML='<h2>시범 문제 완료</h2><p>정답 '+score+' / '+items.length+'</p><button class="action" onclick="location.reload()">기출문제 목록으로</button>'}}
if(new URLSearchParams(location.search).get("set")==="2a")start();
</script></body></html>
