function start(set='2a'){activeItems=set==='1a'?items1A:set==='2d'?itemsD:set==='2c'?itemsC:set==='2b'?itemsB:items;activeTitle=set==='1a'?'1급 지도자 A형':set==='2d'?'2급 지도자 D형':set==='2c'?'2급 지도자 C형':set==='2b'?'2급 지도자 B형':'2급 지도자 A형';i=0;score=0;el("menu").classList.add("hide");el("result").classList.add("hide");el("quiz").classList.remove("hide");draw()}
function draw(){answered=false;const item=activeItems[i];el("progress").textContent=activeTitle+" · "+(i+1)+" / "+activeItems.length;el("question").textContent=item.q;el("feedback").textContent="";el("next").classList.add("hide");el("choices").innerHTML=item.short?'<input id="short" aria-label="단답형 답안" placeholder="정답을 입력하세요" style="grid-column:1/-1;padding:13px;border:1px solid #dce5df;border-radius:10px;font-size:16px"><button class="action" style="grid-column:1/-1" onclick="answerShort()">정답 확인</button>':(item.opts||["X","O"]).map((label,n)=>'<button class="choice" data-i="'+n+'" onclick="answer('+n+')">'+(item.opts?["가. ","나. ","다. ","라. "][n]:"")+label+'</button>').join("")}
function reveal(ok,correctLabel){if(ok)score++;el("feedback").textContent=(ok?"정답입니다. ":"오답입니다. ")+"문제집 "+(activeTitle.startsWith("1급")?"120":activeTitle.endsWith("D형")?"100":activeTitle.endsWith("C형")?"94":activeTitle.endsWith("B형")?"89":"84")+"쪽 정답표: "+correctLabel;el("next").textContent=i===activeItems.length-1?"결과 보기 →":"다음 문제 →";el("next").classList.remove("hide")}
function answer(n){if(answered)return;answered=true;const item=activeItems[i],correct=item.a,ok=n===correct;for(const b of el("choices").children){b.disabled=true;if(Number(b.dataset.i)===correct)b.classList.add("ok");else if(Number(b.dataset.i)===n)b.classList.add("bad")}reveal(ok,item.opts?["가","나","다","라"][correct]:(correct?"O":"X"))}
function answerShort(){if(answered)return;answered=true;const item=activeItems[i];el("short").disabled=true;el("feedback").innerHTML='모범답안: <b>'+item.short+'</b><br>원문과 비교하여 스스로 채점해 주세요.<div style="display:flex;gap:8px;margin-top:8px"><button class="choice" style="flex:1" onclick="selfGrade(true)">정답으로 채점</button><button class="choice" style="flex:1" onclick="selfGrade(false)">오답으로 채점</button></div>'}
function selfGrade(ok){if(ok)score++;el("feedback").innerHTML=(ok?"정답으로":"오답으로")+" 기록했습니다. 모범답안: <b>"+activeItems[i].short+"</b>";el("next").textContent=i===activeItems.length-1?"결과 보기 →":"다음 문제 →";el("next").classList.remove("hide")}
function next(){if(++i<activeItems.length)draw();else{el("quiz").classList.add("hide");el("result").classList.remove("hide");el("result").innerHTML='<h2>기출문제 완료</h2><p>정답 '+score+' / '+activeItems.length+'</p><button class="action" onclick="location.reload()">기출문제 목록으로</button>'}}
if(["2a","2b","2c","2d","1a"].includes(new URLSearchParams(location.search).get("set")))start(new URLSearchParams(location.search).get("set"));
</script></body></html>
