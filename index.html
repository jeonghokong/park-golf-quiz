const rounds=[
{id:1,title:"1회차 · 기본이론",type:"ox",label:"OX · 20문제",qs:[
["파크골프 소개","파크골프(Parkgolf)는 공원에서 골프를 한다는 의미의 합성어이다.",true,"문제집에서 파크골프를 공원에서 골프를 하는 의미의 합성어로 설명합니다."],["파크골프 소개","파크골프는 게이트볼과 유사하여 주로 어르신만을 위한 운동이다.",false,"어르신뿐 아니라 유소년 등 다양한 연령층에게 권장되는 스포츠입니다."],["코스 구성","파크골프장 1개 코스는 9홀로 구성되며 기준타수는 33타이다.",true,"9홀 기준타수는 33타이며 18홀은 66타입니다."],["코스 구성","18홀은 Par3 8개, Par4 8개, Par5 2개로 구성된다.",true,"문제집의 18홀 구성 기준입니다."],["코스 규격","Par3 홀의 길이는 40~60m이다.",true,"Par3는 40~60m입니다."],["코스 규격","Par4 홀의 길이는 60~120m이다.",false,"Par4는 60~100m입니다."],["코스 규격","Par5 홀의 길이는 100~150m이다.",true,"Par5는 100~150m입니다."],["코스 규격","9홀 코스의 합산 길이는 500~790m이다.",true,"9홀 합산 길이는 500~790m입니다."],["코스 표시","A·B·C·D 코스의 깃발 색상은 각각 적색·청색·황색·백색이다.",true,"A 적색, B 청색, C 황색, D 백색입니다."],["코스 표시","2개 코스로 구성된 18홀은 홀 번호를 1번부터 18번까지 연속 표시한다.",false,"각 코스별로 1번부터 9번까지 표시합니다."],["시설","그린의 크기는 지름 5m 이상을 기준으로 한다.",true,"그린 지름은 5m 이상입니다."],["시설","그린의 잔디 길이는 20mm 이내이다.",true,"그린 잔디 길이는 20mm 이내입니다."],["시설","티잉그라운드 크기는 1.5m×1.5m에서 2m×2m 범위이다.",true,"문제집의 티잉그라운드 규격입니다."],["용구","성인용 파크골프 클럽 길이는 86cm 이하이다.",true,"성인용 클럽 길이는 86cm 이하입니다."],["용구","성인용 파크골프 클럽 무게는 700g 이하이다.",false,"클럽 무게는 600g 이하입니다."],["용구","파크골프 공의 무게는 80~95g이다.",true,"공의 무게는 80~95g입니다."],["용구","파크골프 티의 높이는 2.3cm이다.",true,"티 높이는 2.3cm입니다."],["안전","응급상황에서 골든타임의 기준은 4분이다.",true,"안전관리 문항의 골든타임은 4분입니다."],["경기규칙","분실구를 찾는 시간은 5분이다.",false,"분실구 탐색 시간은 3분입니다."],["경기규칙","홀컵 가장자리에 걸쳐 정지한 공은 10초 동안 홀인 여부를 기다릴 수 있다.",true,"대기시간은 10초입니다."]]},
{id:2,title:"2회차 · 핵심수치·규칙",type:"mcq",label:"4지선다 · 20문제",qs:[
["코스 구성","9홀의 기준타수는? ",["30타","33타","36타","39타"],1,"9홀 기준타수는 33타입니다."],["코스 구성","18홀의 기준타수는?",["66타","68타","70타","72타"],0,"18홀 기준타수는 66타입니다."],["코스 구성","18홀의 Par3·Par4·Par5 구성으로 맞는 것은?",["6·8·4","8·8·2","8·6·4","6·10·2"],1,"18홀은 Par3 8개, Par4 8개, Par5 2개입니다."],["홀 길이","Par3의 길이 기준은?",["30~50m","40~60m","50~70m","60~80m"],1,"Par3는 40~60m입니다."],["홀 길이","Par4의 길이 기준은?",["50~90m","60~100m","60~120m","80~120m"],1,"Par4는 60~100m입니다."],["홀 길이","Par5의 길이 기준은?",["80~120m","90~130m","100~150m","120~160m"],2,"Par5는 100~150m입니다."],["코스 규격","9홀 코스의 합산 길이 기준은?",["400~690m","450~750m","500~790m","600~900m"],2,"9홀 합산 길이는 500~790m입니다."],["코스 표시","D코스의 깃발 색상은?",["적색","청색","황색","백색"],3,"D코스는 백색입니다."],["코스 표시","A·B·C·D 코스의 올바른 색상 순서는?",["적·청·황·백","적·황·청·백","청·적·황·백","백·황·청·적"],0,"A 적색, B 청색, C 황색, D 백색입니다."],["코스 표시","2개 코스로 구성된 18홀의 홀 번호 표시는?",["1~18 연속","각 코스 1~9","A코스 1~9, B코스 10~18","홀 번호를 쓰지 않는다"],1,"각 코스마다 1번부터 9번까지 표시합니다."],["시설","그린의 지름 기준은?",["3m 이상","4m 이상","5m 이상","6m 이상"],2,"그린은 지름 5m 이상입니다."],["시설","그린 잔디 길이 기준은?",["10mm 이내","15mm 이내","20mm 이내","30mm 이내"],2,"그린 잔디 길이는 20mm 이내입니다."],["시설","티잉그라운드 크기 기준으로 맞는 것은?",["1×1m~1.5×1.5m","1.5×1.5m~2×2m","2×2m~3×3m","2.5×2.5m 고정"],1,"티잉그라운드는 1.5m×1.5m에서 2m×2m 범위입니다."],["용구","성인용 클럽의 최대 길이는?",["80cm","83cm","86cm","90cm"],2,"성인용 클럽 길이는 86cm 이하입니다."],["용구","성인용 클럽의 최대 무게는?",["500g","550g","600g","700g"],2,"클럽 무게는 600g 이하입니다."],["용구","파크골프 공의 무게 기준은?",["60~75g","70~85g","80~95g","90~105g"],2,"공의 무게는 80~95g입니다."],["용구","파크골프 티의 높이는?",["1.5cm","2.0cm","2.3cm","3.0cm"],2,"티 높이는 2.3cm입니다."],["안전","응급상황에서 제시된 골든타임은?",["2분","3분","4분","5분"],2,"문제집의 안전관리 문항에서는 4분으로 제시합니다."],["경기규칙","분실구를 찾는 시간은?",["2분","3분","4분","5분"],1,"분실구 탐색 시간은 3분입니다."],["경기규칙","홀컵 가장자리에 걸쳐 정지한 공을 기다리는 시간은?",["5초","10초","15초","20초"],1,"홀인 여부를 기다리는 시간은 10초입니다."]]},
{id:3,title:"3회차 · 실전 경기규칙",type:"mcq",label:"4지선다 · 20문제",qs:[
["스트로크","스트로크 의사가 있었으나 헛스윙이 되어 공이 움직이지 않았다. 올바른 적용은?",["1타 가산","2벌타","타수 가산 없음","실격"],2,"공이 움직이지 않은 헛스윙은 스트로크를 하지 않은 것으로 간주합니다."],
["스트로크","헛스윙이 되었지만 공이 움직였다. 올바른 적용은?",["스트로크로 간주","무조건 2벌타","타수 가산 없음","실격"],0,"헛스윙으로 공이 움직인 경우에는 스트로크를 한 것으로 간주합니다."],
["어드레스","티샷 후 다음 샷을 위해 어드레스하면서 클럽헤드가 공에 접촉해 공이 움직였다. 적용은?",["무벌타·원위치","1타 가산","2벌타만 부여","실격"],1,"티샷 후 어드레스 중 클럽헤드가 공에 접촉해 공이 움직이면 스트로크로 간주하고 1타를 가산합니다."],
["부정타","클럽헤드가 아닌 샤프트나 그립 끝으로 공을 쳤다. 적용은?",["무벌타","1타만 가산","스트로크 1타 + 2벌타","실격"],2,"샤프트·그립 끝으로 친 경우 스트로크로 간주해 1타를 가산하고 부정타 2벌타를 부여합니다."],
["부정타","백스윙 없이 공을 밀어내기·당기기·퍼올리기 한 경우 적용은?",["스트로크 1타 + 2벌타","1타만 가산","2벌타만 부여","무벌타"],0,"정상적인 스윙이 아닌 밀어내기·당기기·퍼올리기는 스트로크 1타에 부정타 2벌타가 적용됩니다."],
["부정타","한 번의 스트로크 중 클럽에 공이 2회 이상 접촉했다. 적용은?",["무벌타","1타만 가산","스트로크 1타 + 2벌타","실격"],2,"1회의 스트로크 중 2회 이상 접촉하면 스트로크 1타에 부정타 2벌타가 적용됩니다."],
["벌타","대한파크골프협회 경기규칙에서 모든 벌타는 몇 타인가?",["1타","2타","3타","상황마다 다름"],1,"경기규칙 제8조는 모든 벌타에 2타를 부여한다고 규정합니다."],
["마크","경기에 방해되는 공에 대한 마크 요구가 가능한 시점과 거리로 맞는 것은?",["티샷부터 10m 이내","티샷부터 20m 이내","세컨드 샷부터 20m 이내","세컨드 샷부터 거리 제한 없음"],2,"티샷에서는 마크 요구를 할 수 없고 세컨드 샷부터 20m 이내의 공에 대해 요구할 수 있습니다."],
["마크","마크 요구를 받은 경기자가 취할 수 있는 행동으로 맞는 것은?",["반드시 공을 집어야 한다","마크하거나 동반자 동의하에 먼저 샷할 수 있다","공을 임의로 옆으로 옮긴다","마크 요구를 무조건 거절한다"],1,"마크를 하거나 동반자의 동의하에 먼저 샷을 할 수 있으며, 집어 올린 공은 원위치해야 합니다."],
["장애물","낙엽·작은 돌·나뭇가지 등 움직일 수 있는 장애물을 제거하다 공이 움직였다. 적용은?",["2벌타","1타 가산","무벌타로 공을 원위치","실격"],2,"움직일 수 있는 장애물을 제거하다 공이 움직이면 벌타 없이 원래 있었다고 추정되는 지점에 놓습니다."],
["장애물","공이 움직일 수 있는 장애물 안 또는 위에 있다. 올바른 처리는?",["공을 그대로 두어야 한다","2벌타 후 이동","벌타 없이 공을 집어 장애물을 제거하고 공을 원위치","언플레이어블만 가능"],2,"벌타 없이 공을 집어 올려 장애물을 제거할 수 있고, 공은 원위치합니다."],

["어려움 · 안전 판단","A가 샷을 준비하고 있는데 목표 방향 오른쪽에 다른 조의 경기자가 이동하고 있다. 동반자는 '공이 그쪽으로 갈 가능성이 낮으니 치라'고 한다. 가장 적절한 행동은?",["그대로 샷한다.","낮은 탄도로 샷한다.","안전이 확보될 때까지 기다린다.","다른 조에 알리지 않고 빠르게 샷한다."],2,"타구가 빗나갈 가능성까지 고려해 사람의 안전이 확보될 때까지 기다리는 것이 우선입니다."],

["어려움 · 위험 타구","경기자가 샷한 공이 예상과 달리 우측으로 크게 휘어 다른 경기자 쪽으로 향한다. 가장 먼저 해야 할 행동은?",["공을 따라 달린다.","'볼!' 또는 '공!'이라고 크게 경고한다.","자신의 동반자에게만 알린다.","공이 정지할 때까지 기다린다."],1,"위험한 방향으로 공이 향하면 즉시 큰소리로 주변 사람에게 위험을 알려야 합니다."],
["어려움 · 홀아웃","한 조의 A·B·C는 홀아웃했지만 D의 경기가 남아 있다. 후속 조가 가까이 접근하고 있다. 가장 적절한 행동은?",["A·B·C가 먼저 다음 홀로 이동한다.","D도 경기를 중단하고 이동한다.","조원 모두 홀아웃한 뒤 신속하게 이동한다.","후속 조가 먼저 경기하도록 한다."],2,"한 조는 조원 모두가 홀아웃한 뒤 다음 홀로 이동하는 것이 원칙이며, 경기 지연을 줄이도록 신속히 이동합니다."],
["어려움 · 코스 보호","다음 중 파크골프 코스에서의 행동으로 가장 부적절한 것은?",["코스 내 꽃이나 나무를 보호한다.","경기 진행을 위해 필요한 경우에도 주변 시설물을 함부로 훼손하지 않는다.","자신의 샷에 방해가 되는 나뭇가지를 임의로 꺾는다.","다른 경기자의 플레이를 방해하지 않는다."],2,"경기에 방해된다는 이유로 나뭇가지나 코스 환경을 임의로 훼손해서는 안 됩니다."],
["어려움 · 앞 조 안전","앞 조가 아직 자신의 최대 비거리 범위 안에 있다. 동반자는 'Par3이므로 먼저 쳐도 괜찮다'고 한다. 가장 적절한 판단은?",["Par3에서는 가능하다.","낮은 공으로 치면 가능하다.","충분한 안전거리가 확보될 때까지 기다린다.","한 명만 먼저 샷한다."],2,"홀의 Par와 관계없이 앞 조와 충분한 안전거리가 확보된 뒤 샷해야 합니다."],
["어려움 · 에티켓","다음 중 경기 중 좋은 에티켓이라고 보기 가장 어려운 것은?",["다른 경기자가 샷할 때 조용히 한다.","홀아웃 후 후속 조에 진행 신호를 줄 수 있다.","동반자가 샷하는 동안 다음 샷 준비를 위해 목표선 앞쪽으로 이동한다.","경기 흐름을 방해하지 않도록 신속하게 이동한다."],2,"다른 경기자의 샷 중 목표선 앞쪽으로 이동하면 경기 방해와 안전사고 위험이 있으므로 적절하지 않습니다."],
["어려움 · 응급상황","의식이 없는 사람이 발생했다. 다음 조치 중 가장 부적절한 것은?",["환자의 상태를 확인한다.","특정 사람을 지목해 119 신고를 요청한다.","필요한 경우 심폐소생술을 실시한다.","여러 사람이 알아서 신고할 것이라고 생각하고 즉시 자리를 떠난다."],3,"응급상황에서는 상태 확인, 구체적인 도움 요청과 119 신고, 필요한 응급조치가 중요합니다."],
["어려움 · CPR","심폐소생술 상황에서 주변 사람에게 도움을 요청하는 방법으로 가장 적절한 것은?",["'누가 신고해 주세요'라고만 말한다.","특정 사람을 지목하여 119 신고 등 필요한 조치를 요청한다.","환자를 혼자 두고 직접 도움을 찾으러 간다.","경기 종료 후 신고한다."],1,"표준문제집은 주변 사람을 명확하게 지정해 도움을 요청하는 것을 올바른 조치로 제시합니다."],
["어려움 · 초보자 지도","지도자가 초보자에게 첫 라운드를 지도한다. 기술 지도에 앞서 가장 우선적으로 습관화해야 할 내용의 조합은?",["비거리·풀스윙·스코어 계산","전방 확인·안전거리·샷 순서·위험 경고","클럽 선택·코스 공략·백카운트","홀별 목표타수·순위 계산"],1,"초보자 지도에서는 비거리보다 안전수칙과 경기 진행의 기본을 먼저 습관화시키는 것이 중요합니다."],
["극히 어려움 · 복합 안전","A가 티샷을 준비한다. 앞 조는 이동 중이지만 A의 예상 비거리보다 조금 멀리 있고, 우측 인접 홀에는 다른 경기자가 공을 찾고 있으며, 자신의 동반자는 목표 방향 옆쪽에 서 있다. 가장 적절한 조치는?",["앞 조만 비거리 밖이면 즉시 샷한다.","인접 홀 경기자만 이동하면 샷한다.","자신의 동반자만 뒤로 이동시키고 샷한다.","앞 조·인접 홀·동반자의 위치를 모두 확인하여 안전이 확보된 뒤 샷한다."],3,"한 요소만 확인하는 것이 아니라 예상 타구 범위의 모든 사람과 주변 상황을 확인한 뒤 안전이 확보되어야 샷할 수 있습니다."],
["극히 어려움 · 그린 상황","A가 그린에서 퍼팅하려 한다. B의 공은 A의 퍼팅 라인 옆에 있고, C는 홀컵 뒤쪽에서 움직이고 있으며, D는 다음 홀로 먼저 이동하려 한다. 지도자가 가장 먼저 바로잡아야 할 행동을 종합적으로 설명한 것으로 가장 적절한 것은?",["A가 빨리 퍼팅하도록 한다.","B의 공만 치운 뒤 그대로 진행한다.","그린 위 경기 방해 요소를 정리하고 조원 모두 홀아웃한 뒤 이동하도록 한다.","D가 먼저 이동하여 다음 홀을 확보하게 한다."],2,"그린에서는 퍼팅 방해를 최소화하고 조원 모두가 홀아웃한 뒤 다음 홀로 이동하도록 지도해야 합니다."],
["극히 어려움 · 안전거리","초보자 교육 중 한 참가자가 '앞사람까지 40m 정도 떨어져 있으므로 내 평균 비거리가 30m라면 쳐도 된다'고 주장한다. 지도자의 설명으로 가장 적절한 것은?",["평균 비거리만 기준으로 판단하면 된다.","가장 잘 맞았을 때의 최대 비거리와 오타 가능성까지 고려하여 충분한 안전거리를 확보해야 한다.","Par3에서만 가능하다.","동반자가 동의하면 가능하다."],1,"안전거리는 평균 비거리만이 아니라 최대 비거리와 방향 오차까지 고려해 충분히 확보해야 합니다."],
["극히 어려움 · 응급 대응","경기 도중 한 참가자가 갑자기 쓰러졌다. 한 사람은 119 신고를 하러 가고, 다른 사람은 환자 주변에 모여 있으며, 한 사람은 경기 진행을 계속하려 한다. 지도자의 조치로 가장 적절한 것은?",["경기는 그대로 진행하고 환자만 돌본다.","주변 안전을 확보하고 역할을 명확히 분담하여 신고·응급조치를 실시한다.","여러 사람이 동시에 119에 전화한다.","환자가 의식을 회복할 때까지 아무 조치 없이 기다린다."],1,"응급상황에서는 경기보다 환자와 주변 안전이 우선이며, 역할을 분담해 신고와 응급조치를 신속하게 시행해야 합니다."],
["극히 어려움 · 종합 판단","지도자가 초보자에게 에티켓을 설명했다. 다음 네 행동 중 안전·매너·경기 흐름을 모두 고려했을 때 가장 문제가 큰 것은?",["자신의 차례가 되기 전에 미리 공 위치를 확인한다.","홀아웃 후 후속 조에 신호하고 이동한다.","앞 조가 아직 안전거리 안에 있는데 경기 지연을 줄이기 위해 먼저 샷한다.","다른 경기자의 샷 중에는 조용히 기다린다."],2,"경기 지연을 줄이더라도 안전거리를 희생해서는 안 됩니다. 안전이 경기 진행보다 우선입니다."]
]}

let round=null,i=0,correct=0,wrong=[],review=false,list=[],pos=0;const A=document.getElementById("app"),sub=document.getElementById("subtitle");

window.start=id=>{round=rounds.find(r=>r.id===id);i=0;correct=0;wrong=[];review=false;sub.textContent=round.title+" · "+round.label;draw()}

function answer(b){let idx=review?list[pos]:i,q=round.qs[idx],v=round.type==="ox"?b.dataset.v==="true":Number(b.dataset.v),ans=round.type==="ox"?q[2]:q[3],ok=v===ans;if(!review){if(ok)correct++;else if(!wrong.includes(idx))wrong.push(idx)}document.querySelectorAll(".choice").forEach(x=>x.disabled=true);b.classList.add("sel",ok?"ok":"bad");let s=document.getElementById("status");s.textContent=ok?"정답입니다.":"오답입니다. 정답은 "+(round.type==="ox"?(ans?"O":"X"):["①","②","③","④"][ans])+"입니다.";s.className="status "+(ok?"oktxt":"badtxt");document.getElementById("after").classList.add("show")}
