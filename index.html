<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>파크골프 자격시험 문제풀이</title><style>
:root{--g:#176b43;--gl:#eef7f2;--line:#dce5df;--t:#17211b;--m:#6b766f;--bad:#b42318}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#f5f7f6;color:var(--t)}.wrap{max-width:680px;margin:auto;padding:9px 12px 28px}.head{text-align:center;padding:8px 0 12px}.head h1{font-size:20px;margin:0 0 3px}.head p{font-size:13px;margin:0;color:var(--m)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 3px 14px #0000000a}.top{display:flex;justify-content:space-between;color:var(--m);font-size:13px;margin-bottom:10px}.bar{height:4px;background:#edf1ee;border-radius:8px;margin-bottom:16px;overflow:hidden}.bar span{display:block;height:100%;background:var(--g)}.q{font-size:20px;line-height:1.48;font-weight:760;min-height:82px}.answers{display:grid;gap:9px;margin-top:16px}.answers.ox{grid-template-columns:1fr 1fr}.choice{border:2px solid var(--line);background:#fff;border-radius:13px;min-height:62px;padding:11px 13px;font-size:16px;font-weight:700;text-align:left;color:var(--t)}.ox .choice{text-align:center;font-size:32px}.choice.sel.ok{border-color:var(--g);background:var(--gl);color:var(--g)}.choice.sel.bad{border-color:#e4a6a1;background:#fff3f2;color:var(--bad)}.choice:disabled{opacity:1}.after{display:none;margin-top:11px}.after.show{display:block}.status{font-weight:800;margin-bottom:9px}.oktxt{color:var(--g)}.badtxt{color:var(--bad)}.next,.start{width:100%;border:0;border-radius:12px;min-height:50px;background:var(--g);color:#fff;font-size:16px;font-weight:800}.details{margin-top:9px;border:1px solid var(--line);border-radius:11px;background:#fafcfb}.details summary{padding:12px 13px;font-weight:700;list-style:none}.explain{padding:0 13px 13px;line-height:1.5;font-size:14px}.source{font-size:12px;color:var(--m);margin-top:6px}.score{text-align:center;color:var(--m);font-size:13px;margin-top:10px}.homeIntro{text-align:center;padding:12px 2px 17px}.homeIntro h2{font-size:23px;margin:0 0 6px}.homeIntro p{margin:0;color:var(--m);font-size:14px}.rounds{display:grid;gap:12px}.round{border:1px solid var(--line);border-radius:15px;padding:14px 16px;cursor:pointer;transition:.15s;background:#fff}.round.done{background:var(--gl);border-color:#cfe0d6}.round:active{border-color:var(--g)}.roundTitle{font-size:18px;font-weight:800;margin-bottom:5px}.roundLine{display:flex;align-items:center;justify-content:space-between;gap:10px}.roundMeta{font-size:13px;color:var(--m);margin:0}.stats{font-size:13px;color:var(--g);margin:0;text-align:right;white-space:nowrap}.finish{text-align:center;padding:17px 0}.big{font-size:40px;font-weight:850;color:var(--g)}.finishBtns{display:grid;gap:9px;margin-top:16px}.finishBtns button{border:0;border-radius:12px;padding:14px;background:var(--g);color:#fff;font-weight:750;font-size:15px}.finishBtns .secondary{background:#edf3ef;color:var(--g)}.note{font-size:11px;color:var(--m);text-align:center;margin-top:11px}@media(max-width:480px){.wrap{padding:5px 9px 18px}.head{padding:3px 0 7px}.head h1{font-size:19px;margin-bottom:1px}.head p{font-size:12px}.card{padding:13px}.top{margin-bottom:7px}.bar{margin-bottom:10px}.q{font-size:18px;line-height:1.38;min-height:48px}.answers{gap:7px;margin-top:10px}.choice{min-height:49px;padding:8px 11px;font-size:15px}.ox .choice{font-size:29px}.after{margin-top:8px}.status{margin-bottom:6px}.next{min-height:45px}.details summary{padding:9px 11px}.explain{padding:0 11px 10px;font-size:13px}.score{margin-top:7px}.note{margin-top:7px}}
</style></head><body><main class="wrap"><header class="head"><h1>파크골프 자격시험</h1><p id="subtitle">회차를 선택해 주세요</p></header><section class="card" id="app"></section><p class="note">대한파크골프협회 자격검정 문제집의 내용과 정답 체계를 기준으로 구성</p></main><script>
const rounds=[
{id:1,title:"1회차 · 기본이론",type:"ox",label:"OX · 20문제",qs:[
["파크골프 소개","파크골프(Parkgolf)는 공원에서 골프를 한다는 의미의 합성어이다.",true,"문제집에서 파크골프를 공원에서 골프를 하는 의미의 합성어로 설명합니다."],["파크골프 소개","파크골프는 게이트볼과 유사하여 주로 어르신만을 위한 운동이다.",false,"어르신뿐 아니라 유소년 등 다양한 연령층에게 권장되는 스포츠입니다."],["코스 구성","파크골프장 1개 코스는 9홀로 구성되며 기준타수는 33타이다.",true,"9홀 기준타수는 33타이며 18홀은 66타입니다."],["코스 구성","18홀은 Par3 8개, Par4 8개, Par5 2개로 구성된다.",true,"문제집의 18홀 구성 기준입니다."],["코스 규격","Par3 홀의 길이는 40~60m이다.",true,"Par3는 40~60m입니다."],["코스 규격","Par4 홀의 길이는 60~120m이다.",false,"Par4는 60~100m입니다."],["코스 규격","Par5 홀의 길이는 100~150m이다.",true,"Par5는 100~150m입니다."],["코스 규격","9홀 코스의 합산 길이는 500~790m이다.",true,"9홀 합산 길이는 500~790m입니다."],["코스 표시","A·B·C·D 코스의 깃발 색상은 각각 적색·청색·황색·백색이다.",true,"A 적색, B 청색, C 황색, D 백색입니다."],["코스 표시","2개 코스로 구성된 18홀은 홀 번호를 1번부터 18번까지 연속 표시한다.",false,"각 코스별로 1번부터 9번까지 표시합니다."],["시설","그린의 크기는 지름 5m 이상을 기준으로 한다.",true,"그린 지름은 5m 이상입니다."],["시설","그린의 잔디 길이는 20mm 이내이다.",true,"그린 잔디 길이는 20mm 이내입니다."],["시설","티잉그라운드 크기는 1.5m×1.5m에서 2m×2m 범위이다.",true,"문제집의 티잉그라운드 규격입니다."],["용구","성인용 파크골프 클럽 길이는 86cm 이하이다.",true,"성인용 클럽 길이는 86cm 이하입니다."],["용구","성인용 파크골프 클럽 무게는 700g 이하이다.",false,"클럽 무게는 600g 이하입니다."],["용구","파크골프 공의 무게는 80~95g이다.",true,"공의 무게는 80~95g입니다."],["용구","파크골프 티의 높이는 2.3cm이다.",true,"티 높이는 2.3cm입니다."],["안전","응급상황에서 골든타임의 기준은 4분이다.",true,"안전관리 문항의 골든타임은 4분입니다."],["경기규칙","분실구를 찾는 시간은 5분이다.",false,"분실구 탐색 시간은 3분입니다."],["경기규칙","홀컵 가장자리에 걸쳐 정지한 공은 10초 동안 홀인 여부를 기다릴 수 있다.",true,"대기시간은 10초입니다."]]},
{id:2,title:"2회차 · 핵심수치·규칙",type:"mcq",label:"4지선다 · 20문제",qs:[
["코스 구성","9홀의 기준타수는? ",["30타","33타","36타","39타"],1,"9홀 기준타수는 33타입니다."],["코스 구성","18홀의 기준타수는?",["66타","68타","70타","72타"],0,"18홀 기준타수는 66타입니다."],["코스 구성","18홀의 Par3·Par4·Par5 구성으로 맞는 것은?",["6·8·4","8·8·2","8·6·4","6·10·2"],1,"18홀은 Par3 8개, Par4 8개, Par5 2개입니다."],["홀 길이","Par3의 길이 기준은?",["30~50m","40~60m","50~70m","60~80m"],1,"Par3는 40~60m입니다."],["홀 길이","Par4의 길이 기준은?",["50~90m","60~100m","60~120m","80~120m"],1,"Par4는 60~100m입니다."],["홀 길이","Par5의 길이 기준은?",["80~120m","90~130m","100~150m","120~160m"],2,"Par5는 100~150m입니다."],["코스 규격","9홀 코스의 합산 길이 기준은?",["400~690m","450~750m","500~790m","600~900m"],2,"9홀 합산 길이는 500~790m입니다."],["코스 표시","D코스의 깃발 색상은?",["적색","청색","황색","백색"],3,"D코스는 백색입니다."],["코스 표시","A·B·C·D 코스의 올바른 색상 순서는?",["적·청·황·백","적·황·청·백","청·적·황·백","백·황·청·적"],0,"A 적색, B 청색, C 황색, D 백색입니다."],["코스 표시","2개 코스로 구성된 18홀의 홀 번호 표시는?",["1~18 연속","각 코스 1~9","A코스 1~9, B코스 10~18","홀 번호를 쓰지 않는다"],1,"각 코스마다 1번부터 9번까지 표시합니다."],["시설","그린의 지름 기준은?",["3m 이상","4m 이상","5m 이상","6m 이상"],2,"그린은 지름 5m 이상입니다."],["시설","그린 잔디 길이 기준은?",["10mm 이내","15mm 이내","20mm 이내","30mm 이내"],2,"그린 잔디 길이는 20mm 이내입니다."],["시설","티잉그라운드 크기 기준으로 맞는 것은?",["1×1m~1.5×1.5m","1.5×1.5m~2×2m","2×2m~3×3m","2.5×2.5m 고정"],1,"티잉그라운드는 1.5m×1.5m에서 2m×2m 범위입니다."],["용구","성인용 클럽의 최대 길이는?",["80cm","83cm","86cm","90cm"],2,"성인용 클럽 길이는 86cm 이하입니다."],["용구","성인용 클럽의 최대 무게는?",["500g","550g","600g","700g"],2,"클럽 무게는 600g 이하입니다."],["용구","파크골프 공의 무게 기준은?",["60~75g","70~85g","80~95g","90~105g"],2,"공의 무게는 80~95g입니다."],["용구","파크골프 티의 높이는?",["1.5cm","2.0cm","2.3cm","3.0cm"],2,"티 높이는 2.3cm입니다."],["안전","응급상황에서 제시된 골든타임은?",["2분","3분","4분","5분"],2,"문제집의 안전관리 문항에서는 4분으로 제시합니다."],["경기규칙","분실구를 찾는 시간은?",["2분","3분","4분","5분"],1,"분실구 탐색 시간은 3분입니다."],["경기규칙","홀컵 가장자리에 걸쳐 정지한 공을 기다리는 시간은?",["5초","10초","15초","20초"],1,"홀인 여부를 기다리는 시간은 10초입니다."]]}
];
let round=null,i=0,correct=0,wrong=[],review=false,list=[],pos=0;const A=document.getElementById("app"),sub=document.getElementById("subtitle");
const key=(id,x)=>"pgq_r"+id+"_"+x;
function home(){round=null;sub.textContent="회차를 선택해 주세요";A.innerHTML='<div class="rounds">'+rounds.map(r=>{let sc=localStorage.getItem(key(r.id,"score")),w=JSON.parse(localStorage.getItem(key(r.id,"wrong"))||"[]");return '<div class="round '+(sc?'done':'')+'" role="button" tabindex="0" onclick="start('+r.id+')" onkeydown="if(event.key===\\'Enter\\'||event.key===\\' \\'){event.preventDefault();start('+r.id+')}"><div class="roundTitle">'+r.title+'</div><div class="roundLine"><div class="roundMeta">'+r.label+'</div><div class="stats">'+(sc?'최근 '+sc+(w.length?' · 오답 '+w.length:''):'NEW')+'</div></div></div>'}).join("")+'</div>'}
window.start=id=>{round=rounds.find(r=>r.id===id);i=0;correct=0;wrong=[];review=false;sub.textContent=round.title+" · "+round.label;draw()}
function draw(){let idx=review?list[pos]:i,q=round.qs[idx],total=review?list.length:round.qs.length,n=review?pos+1:i+1;let opts=round.type==="ox"?[["O",true],["X",false]]:q[2].map((x,j)=>[["①","②","③","④"][j]+" "+x,j]);A.innerHTML='<div class="top"><span>'+(review?"오답 다시풀기 · ":"")+q[0]+'</span><span>'+n+' / '+total+'</span></div><div class="bar"><span style="width:'+(n/total*100)+'%"></span></div><div class="q">'+q[1]+'</div><div class="answers '+(round.type==="ox"?"ox":"")+'" id="answers">'+opts.map(o=>'<button class="choice" data-v="'+o[1]+'">'+o[0]+'</button>').join("")+'</div><div class="after" id="after"><div class="status" id="status"></div><button class="next" id="next">'+((review&&pos===total-1)||(!review&&i===total-1)?"결과 보기 →":"다음 문제 →")+'</button><details class="details"><summary>해설 보기</summary><div class="explain">'+(round.type==="ox"?(q[2]?"O. ":"X. ")+q[3]:q[4])+'<div class="source">출처: 대한파크골프협회 자격검정 문제집</div></div></details></div><div class="score">'+(review?"오답 복습 중":"정답 "+correct+" / "+i)+'</div>';document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(b));document.getElementById("next").onclick=next}
function answer(b){let idx=review?list[pos]:i,q=round.qs[idx],v=round.type==="ox"?b.dataset.v==="true":Number(b.dataset.v),ans=round.type==="ox"?q[2]:q[3],ok=v===ans;if(!review){if(ok)correct++;else if(!wrong.includes(idx))wrong.push(idx)}document.querySelectorAll(".choice").forEach(x=>x.disabled=true);b.classList.add("sel",ok?"ok":"bad");let s=document.getElementById("status");s.textContent=ok?"정답입니다.":"오답입니다. 정답은 "+(round.type==="ox"?(ans?"O":"X"):["①","②","③","④"][ans])+"입니다.";s.className="status "+(ok?"oktxt":"badtxt");document.getElementById("after").classList.add("show")}
function next(){if(review){if(pos<list.length-1){pos++;draw()}else reviewDone()}else{if(i<round.qs.length-1){i++;draw()}else finish()}}
function finish(){localStorage.setItem(key(round.id,"score"),correct+" / "+round.qs.length);localStorage.setItem(key(round.id,"wrong"),JSON.stringify(wrong));A.innerHTML='<div class="finish"><div>'+round.id+'회차 완료</div><div class="big">'+correct+' / '+round.qs.length+'</div><p>정답률 '+Math.round(correct/round.qs.length*100)+'%</p><div class="finishBtns">'+(wrong.length?'<button onclick="reviewWrong()">틀린 문제 다시 풀기 ('+wrong.length+')</button>':'')+'<button class="secondary" onclick="start('+round.id+')">전체 다시 풀기</button><button class="secondary" onclick="home()">회차 목록으로</button></div></div>'}
window.reviewWrong=()=>{list=[...wrong];review=true;pos=0;sub.textContent=round.title+" · 오답 다시풀기";draw()}
function reviewDone(){localStorage.setItem(key(round.id,"wrong"),"[]");A.innerHTML='<div class="finish"><div class="big">복습 완료</div><p>오답 '+list.length+'문제를 다시 확인했습니다.</p><div class="finishBtns"><button onclick="start('+round.id+')">이 회차 다시 풀기</button><button class="secondary" onclick="home()">회차 목록으로</button></div></div>'}
home();</script></body></html>
